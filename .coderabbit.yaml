language: en-US

reviews:
  profile: assertive
  request_changes_workflow: false
  high_level_summary: false
  high_level_summary_in_walkthrough: true
  review_status: false
  commit_status: false
  fail_commit_status: false
  collapse_walkthrough: false
  changed_files_summary: true
  sequence_diagrams: false
  estimate_code_review_effort: false
  assess_linked_issues: true
  related_issues: true
  related_prs: true
  suggested_labels: false
  suggested_reviewers: false
  in_progress_fortune: false
  poem: false
  abort_on_close: true

  path_filters:
    - '!brain/reference/'
    - '!**/__screenshots__/'
    - '!pnpm-lock.yaml'

  auto_review:
    enabled: true
    auto_incremental_review: true
    drafts: false

  finishing_touches:
    docstrings:
      enabled: false
    unit_tests:
      enabled: false

  pre_merge_checks:
    docstrings:
      mode: off
    title:
      mode: warning
    description:
      mode: warning

  tools:
    eslint:
      enabled: true
    oxc:
      enabled: true
    markdownlint:
      enabled: true
    actionlint:
      enabled: true
    yamllint:
      enabled: true
    shellcheck:
      enabled: true
    gitleaks:
      enabled: true
    github-checks:
      enabled: true
      timeout_ms: 90000

chat:
  auto_reply: true

knowledge_base:
  opt_out: false
  code_guidelines:
    enabled: true
    filePatterns:
      - '**/CLAUDE.md'
      - '**/AGENTS.md'
