name: Setup Agent Browser
description: Install the agent-browser CLI and browser runtime

runs:
  using: composite
  steps:
    - name: Install agent-browser
      shell: bash
      run: |
        set -euo pipefail
        npm install -g agent-browser

    - name: Install browser runtime
      shell: bash
      run: |
        set -euo pipefail
        agent-browser install
