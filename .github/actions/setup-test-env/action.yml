name: 'Setup Test Environment'
description: 'Setup Node.js, pnpm, dependencies, and Playwright browsers'

inputs:
  node-version:
    description: 'Node.js version'
    required: true
  playwright-browsers:
    description: 'Space-separated Playwright browsers to install'
    required: false
    default: 'chromium'

runs:
  using: 'composite'
  steps:
    - name: Setup dependencies
      uses: ./.github/actions/setup-node-deps
      with:
        node-version: ${{ inputs.node-version }}

    - name: Get Playwright version
      id: playwright-version
      shell: bash
      run: echo "version=$(pnpm exec playwright --version | awk '{ print $2 }')" >> "$GITHUB_OUTPUT"

    - name: Cache Playwright browsers
      uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
      id: playwright-cache
      with:
        path: |
          ~/.cache/ms-playwright
          ~/Library/Caches/ms-playwright
        key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ steps.playwright-version.outputs.version }}-${{ inputs.playwright-browsers }}

    - name: Install Playwright system dependencies
      if: runner.os == 'Linux'
      shell: bash
      env:
        PLAYWRIGHT_BROWSERS: ${{ inputs.playwright-browsers }}
      run: |
        set -euo pipefail
        read -r -a browsers <<< "$PLAYWRIGHT_BROWSERS"
        pnpm exec playwright install-deps "${browsers[@]}"

    - name: Install Playwright browsers
      if: steps.playwright-cache.outputs.cache-hit != 'true'
      shell: bash
      env:
        PLAYWRIGHT_BROWSERS: ${{ inputs.playwright-browsers }}
      run: |
        set -euo pipefail
        read -r -a browsers <<< "$PLAYWRIGHT_BROWSERS"
        pnpm exec playwright install "${browsers[@]}"
