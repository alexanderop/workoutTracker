name: Post QA report
description: Read qa-report.md and post (or update) it as a sticky PR comment.

inputs:
  pr-number:
    description: PR number to comment on. Required for issue_comment / workflow_dispatch flows where github.event.pull_request isn't populated.
    required: false
    default: ''
  marker:
    description: Hidden HTML marker used to find and update the sticky comment on subsequent runs.
    required: false
    default: '<!-- claude-qa-report -->'
  heading:
    description: Markdown heading rendered above the report body.
    required: false
    default: '## Claude QA Report'
  report-path:
    description: Path to the report file Claude wrote.
    required: false
    default: 'qa-report.md'
  github-token:
    description: Token with pull-requests:write scope.
    required: true
  head-sha:
    description: Exact head SHA tested by QA; defaults to the triggering event SHA.
    required: false
    default: ''

outputs:
  comment-id:
    description: The exact issue-comment ID created or updated for this report.
    value: ${{ steps.publish.outputs.comment-id }}
  report-ready:
    description: Whether a real report file was successfully published.
    value: ${{ steps.publish.outputs.report-ready }}

runs:
  using: composite
  steps:
    - name: Post or update sticky QA report
      id: publish
      uses: actions/github-script@373c709c69115d41ff229c7e5df9f8788daa9553 # v9
      env:
        PR_NUMBER_INPUT: ${{ inputs.pr-number }}
        MARKER: ${{ inputs.marker }}
        HEADING: ${{ inputs.heading }}
        REPORT_PATH: ${{ inputs.report-path }}
        REPORT_RUN_ID: ${{ github.run_id }}
        REPORT_HEAD_SHA: ${{ inputs.head-sha || github.event.pull_request.head.sha || github.event.workflow_run.head_sha || github.sha }}
        GITHUB_TOKEN: ${{ inputs.github-token }}
      with:
        github-token: ${{ inputs.github-token }}
        script: |
          const fs = require('fs');

          const prNumberRaw = process.env.PR_NUMBER_INPUT
            || context.payload.pull_request?.number
            || context.payload.issue?.number
            || '';
          const prNumber = parseInt(prNumberRaw, 10);
          if (!prNumber) {
            core.warning('No PR number available — skipping QA report comment.');
            return;
          }

          const marker = process.env.MARKER;
          const heading = process.env.HEADING;
          const reportPath = process.env.REPORT_PATH;

          let report;
          try {
            report = fs.readFileSync(reportPath, 'utf8').trim();
          } catch {
            core.setFailed(`No ${reportPath} was produced by the QA run.`);
            return;
          }
          if (!report) {
            core.setFailed(`${reportPath} was empty.`);
            return;
          }

          const provenance = `<!-- qa-report-provenance run-id=${process.env.REPORT_RUN_ID} head-sha=${process.env.REPORT_HEAD_SHA} -->`;
          const body = `${marker}\n${provenance}\n${heading}\n\n${report}`;

          const comments = await github.paginate(github.rest.issues.listComments, {
            owner: context.repo.owner,
            repo: context.repo.repo,
            issue_number: prNumber,
            per_page: 100,
          });
          // Only reuse a comment created by this workflow. A user-posted
          // lookalike marker must never become the trusted QA report that a
          // later write-capable follow-up consumes.
          const existing = comments.find(c =>
            c.user?.login === 'github-actions[bot]'
            && c.user?.id === 41898282
            && c.body?.includes(marker)
          );

          if (existing) {
            await github.rest.issues.updateComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: existing.id,
              body,
            });
            core.setOutput('comment-id', String(existing.id));
            core.setOutput('report-ready', 'true');
            core.info(`Updated sticky QA report comment ${existing.id} on PR #${prNumber}.`);
          } else {
            const { data: created } = await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              body,
            });
            core.setOutput('comment-id', String(created.id));
            core.setOutput('report-ready', 'true');
            core.info(`Created sticky QA report comment on PR #${prNumber}.`);
          }
