name: Claude execution log tailer
description: Streams Claude Code action's execution JSON log live to the GitHub Actions console so tool calls are visible during the run instead of only at the end. Writes TAILER_PID to $GITHUB_ENV; stop it with the `stop` action or `kill $TAILER_PID`.

inputs:
  log-path:
    description: Path to the Claude execution output JSON log.
    required: false
    default: /home/runner/work/_temp/claude-execution-output.json
  wait-seconds:
    description: How long to wait for the log file to appear before giving up.
    required: false
    default: '120'

runs:
  using: composite
  steps:
    - name: Ensure jq is available
      shell: bash
      run: command -v jq >/dev/null 2>&1 || sudo apt-get install -y jq >/dev/null 2>&1 || true

    - name: Start tailer
      shell: bash
      env:
        LOG_PATH: ${{ inputs.log-path }}
        WAIT_SECONDS: ${{ inputs.wait-seconds }}
      run: |
        set -euo pipefail
        (
          for _ in $(seq 1 "$WAIT_SECONDS"); do
            [ -f "$LOG_PATH" ] && break
            sleep 1
          done
          if [ ! -f "$LOG_PATH" ]; then
            echo "::warning::claude-log-tailer: $LOG_PATH never appeared within ${WAIT_SECONDS}s"
            exit 0
          fi
          echo "::notice::claude-log-tailer: streaming $LOG_PATH"
          tail -n +1 -F "$LOG_PATH" 2>/dev/null | while IFS= read -r line; do
            echo "$line" | jq -r '
              if .type == "assistant" then
                (.message.content[]? | select(.type == "tool_use") |
                  "[TOOL] \(.name): " +
                  ((.input.command // .input.description // (.input | tostring))
                    | gsub("\n"; " ") | .[:300]))
              elif .type == "user" then
                (.message.content[]? | select(.type == "tool_result") |
                  "[RESULT] " + ((.content | tostring) | gsub("\n"; " ") | .[:200]))
              elif .type == "result" then
                "[RESULT END] terminal=\(.result.terminal_reason // .terminal_reason // "?") turns=\(.result.num_turns // .num_turns // "?")"
              else empty end
            ' 2>/dev/null || true
          done
        ) &
        echo "TAILER_PID=$!" >> "$GITHUB_ENV"
