# Automatically address reviewer-bot findings (CodeRabbit, Copilot) with
# Claude: judge each unresolved finding, fix the valid ones, reply in-thread
# with the fix SHA or a skip reason, resolve fixed threads, and push.
name: Claude Fix Review Findings

on:
  pull_request_review:
    types: [submitted]
  # Chained from claude-ci-fix after it pushes to a PR branch: pushes made
  # with GITHUB_TOKEN never fire pull_request_review, so findings CodeRabbit
  # left before (or on) an agent commit would otherwise sit unresolved until
  # the next bot review. Also usable manually:
  #   gh workflow run claude-fix-review.yml -f pr_number=<N>
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number with unresolved reviewer-bot findings'
        required: true
        type: string

permissions: {}

env:
  CLAUDE_MODEL: claude-sonnet-4-6

jobs:
  fix-review:
    name: Address reviewer-bot findings
    # Bots only — human reviews are conversations, not work queues. The
    # same-repo guard keeps fork code away from this workflow's write token;
    # for workflow_dispatch runs the gate step re-checks it via the API.
    if: |
      github.event_name == 'workflow_dispatch' ||
      ((github.event.review.user.login == 'coderabbitai[bot]' ||
        github.event.review.user.login == 'copilot-pull-request-reviewer[bot]') &&
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    # Shared writer lock: at most one of claude-ci-fix / claude-fix-review /
    # claude-qa-followup pushes to a given PR branch at a time, so their
    # commits stack via rebase instead of racing each other's pushes.
    # Combined with the unresolved-threads gate below, this also bounds the
    # fix -> re-review -> fix loop: it only continues while unresolved
    # findings actually exist.
    concurrency:
      group: claude-writer-${{ github.event.pull_request.number || inputs.pr_number }}
      cancel-in-progress: false

    permissions:
      contents: write # push the fix commit back to the PR branch
      pull-requests: write # reply to review threads, resolve them
      issues: write # createComment posts through the issues API
      actions: write # dispatch ci.yml after pushing fixes
      id-token: write # OIDC for claude-code-action auth

    steps:
      - name: Gate on unresolved review threads
        id: gate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_PR_NUMBER: ${{ github.event.pull_request.number }}
          INPUT_PR_NUMBER: ${{ inputs.pr_number }}
          REPO_OWNER: ${{ github.repository_owner }}
          REPO_NAME: ${{ github.event.repository.name }}
        run: |
          set -euo pipefail
          PR_NUMBER="${EVENT_PR_NUMBER:-$INPUT_PR_NUMBER}"
          PR_JSON=$(gh api "repos/${REPO_OWNER}/${REPO_NAME}/pulls/${PR_NUMBER}")
          {
            echo "pr_number=$PR_NUMBER"
            echo "head_ref=$(jq -r '.head.ref' <<<"$PR_JSON")"
          } >> "$GITHUB_OUTPUT"
          # Dispatched runs carry no event-level guard, so re-check here:
          # only open, same-repo PRs may reach the write-token steps below.
          if [ "$(jq -r '.state' <<<"$PR_JSON")" != "open" ] ||
             [ "$(jq -r '.head.repo.full_name' <<<"$PR_JSON")" != "${REPO_OWNER}/${REPO_NAME}" ]; then
            echo "unresolved=0" >> "$GITHUB_OUTPUT"
            echo "PR #${PR_NUMBER} is closed or from a fork; skipping."
            exit 0
          fi
          # shellcheck disable=SC2016
          # GraphQL variables must remain literal for gh to bind with -F.
          unresolved=$(gh api graphql \
            -F owner="$REPO_OWNER" \
            -F name="$REPO_NAME" \
            -F number="$PR_NUMBER" \
            -f query='query($owner: String!, $name: String!, $number: Int!) {
              repository(owner: $owner, name: $name) {
                pullRequest(number: $number) {
                  reviewThreads(first: 100) {
                    nodes {
                      isResolved
                      comments(first: 1) { nodes { author { login } } }
                    }
                  }
                }
              }
            }' --jq '[.data.repository.pullRequest.reviewThreads.nodes[] |
              select(.isResolved == false) |
              select(.comments.nodes[0].author.login == "coderabbitai" or
                     .comments.nodes[0].author.login == "copilot-pull-request-reviewer")] |
              length')
          echo "unresolved=$unresolved" >> "$GITHUB_OUTPUT"
          echo "Unresolved review threads: $unresolved"

      - name: Checkout PR branch # zizmor: ignore[artipacked]
        # Credentials are intentionally persisted: the push step below pushes
        # Claude's fix commit back to the PR branch with this token.
        if: steps.gate.outputs.unresolved != '0'
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ steps.gate.outputs.head_ref }}
          # This workflow's prompt never diffs against main (unlike
          # claude-qa-followup's), so a shallow slice of head-branch history
          # is enough for the commit-range log in the push step below.
          fetch-depth: 50
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup git identity
        if: steps.gate.outputs.unresolved != '0'
        shell: bash
        run: |
          set -euo pipefail
          git config user.email "41898282+claude[bot]@users.noreply.github.com"
          git config user.name "claude[bot]"

      - name: Setup dependencies
        if: steps.gate.outputs.unresolved != '0'
        uses: ./.github/actions/setup-node-deps
        with:
          node-version: '22'

      - name: Pre-fetch unresolved findings
        if: steps.gate.outputs.unresolved != '0'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }} # pr-comments.ts shells out to gh, which reads this
        run: |
          set -euo pipefail
          pnpm -s pr:comments ${{ steps.gate.outputs.pr_number }} --json |
            jq 'map(select(.user == "coderabbitai[bot]" or
                           .user == "copilot-pull-request-reviewer[bot]"))' \
            > /tmp/pr-findings.json

      - name: Run Claude to address findings
        if: steps.gate.outputs.unresolved != '0'
        uses: anthropics/claude-code-action@76c083468952ef555951bbe4d9e21a3929ae2637 # v1.0.93
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # github-actions is the actor when claude-ci-fix chains into this
          # workflow via workflow_dispatch.
          allowed_bots: coderabbitai,copilot-pull-request-reviewer,github-actions
          show_full_output: true
          prompt: |
            Reviewer bots left unresolved findings on PR
            #${{ steps.gate.outputs.pr_number }}. Address them following the
            "Responding to review feedback" convention in CLAUDE.md.

            Steps:
            1. Read the unresolved findings from `/tmp/pr-findings.json`
               (already fetched; resolved threads filtered out). If empty or
               nothing actionable, stop without changes. If you need fresher
               state after fixing something, re-run
               `pnpm -s pr:comments ${{ steps.gate.outputs.pr_number }} --json`.
            2. Triage ALL findings up front: decide fix vs skip for each. Skip
               findings that are invalid, over-engineered, or conflict with
               repo conventions.
            3. Immediately reply in-thread to every SKIPPED finding with the
               reason, using its `commentId`:
               gh api -X POST repos/${{ github.repository }}/pulls/${{ steps.gate.outputs.pr_number }}/comments/<commentId>/replies \
                 -f body='Skipping: <reason>.'
            4. Then work through the fixes ONE FINDING AT A TIME, most important
               first. For each finding, complete the full cycle before starting
               the next:
               a. Fix it — root cause, minimal diff.
               b. Verify: `pnpm type-check`; run the affected test file when
                  source code changed.
               c. Commit with conventional format: fix(scope): description.
               d. Reply in-thread: gh api -X POST ... /comments/<commentId>/replies
                  -f body='Fixed in <sha> — <what changed>.'
               e. Resolve that thread via GraphQL resolveReviewThread (thread
                  ids come from the reviewThreads query).
               Never batch commits or replies for the end: if the turn limit
               cuts you off, completed cycles must already be committed and
               replied so the push step can salvage them.
            5. After the last fix, run `pnpm lint` and (when source changed)
               `pnpm test`; fix fallout in a follow-up commit if needed.

            Important:
            - Do not suppress errors, weaken checks, or blindly apply every
              suggestion. You are the judge of validity, not a patch applier.
            - Keep changes minimal; never refactor beyond the finding.
            - Use the Grep/Glob tools to search the codebase — shell commands
              other than git/pnpm/gh/cat/ls are denied and waste a turn.
          claude_args: |
            --max-turns 120
            --model ${{ env.CLAUDE_MODEL }}
            --allowedTools "Edit,Write,Read,Glob,Grep,Skill,Bash(git:*),Bash(pnpm:*),Bash(gh:*),Bash(cat:*),Bash(ls:*)"

      - name: Push fix commits if any
        id: push-fix
        # `!cancelled()` on purpose: when the Claude step dies mid-run (e.g.
        # max-turns), findings already fixed follow the commit-and-reply-per-
        # finding cycle above, so pushing the finished commits salvages them.
        if: ${{ !cancelled() && steps.gate.outputs.unresolved != '0' }}
        shell: bash
        env:
          HEAD_BRANCH: ${{ steps.gate.outputs.head_ref }}
        run: |
          set -euo pipefail
          if [ -n "$(git status --porcelain)" ]; then
            # A dirty tree means the run was cut off mid-fix; that half-done
            # change was never verified or replied to, so drop it and keep
            # only the completed, committed cycles.
            echo "::warning::Working tree dirty after Claude run; discarding uncommitted changes."
            git status --short
            git checkout -- .
            git clean -fd
          fi
          # Rebase onto the current branch tip first: the shared writer
          # concurrency group above serializes claude-ci-fix / claude-fix-review
          # / claude-qa-followup, but a human push between checkout and here is
          # still possible. Recompute both SHAs AFTER the rebase so the
          # "nothing to push" comparison below reflects the rebased state.
          if ! git pull --rebase origin "${HEAD_BRANCH}"; then
            git rebase --abort
            echo "::error::git pull --rebase origin ${HEAD_BRANCH} failed; aborting rebase and not pushing. Resolve the conflict manually."
            exit 1
          fi
          LOCAL_SHA=$(git rev-parse HEAD)
          REMOTE_SHA=$(git rev-parse "origin/${HEAD_BRANCH}" 2>/dev/null || echo "")
          if [ "$LOCAL_SHA" = "$REMOTE_SHA" ]; then
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            echo "No new commits from Claude; nothing to push."
            exit 0
          fi
          git push origin "HEAD:${HEAD_BRANCH}"
          echo "pushed=true" >> "$GITHUB_OUTPUT"
          # shellcheck disable=SC2016
          # Backticks in the git format are Markdown, not shell substitutions.
          {
            echo "commits<<COMMITS_EOF"
            if [ -n "$REMOTE_SHA" ]; then
              git log --format='- `%h` %s' "${REMOTE_SHA}..${LOCAL_SHA}"
            else
              git log --format='- `%h` %s' -1 "$LOCAL_SHA"
            fi
            echo "COMMITS_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Dispatch CI on the pushed branch
        # The push above used GITHUB_TOKEN, which never triggers CI itself.
        if: ${{ !cancelled() && steps.push-fix.outputs.pushed == 'true' }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_BRANCH: ${{ steps.gate.outputs.head_ref }}
        run: |
          set -euo pipefail
          gh workflow run ci.yml --ref "$HEAD_BRANCH"

      - name: Comment on PR with pushed commits
        if: ${{ !cancelled() && steps.push-fix.outputs.pushed == 'true' }}
        uses: actions/github-script@373c709c69115d41ff229c7e5df9f8788daa9553 # v9
        env:
          PR_NUMBER: ${{ steps.gate.outputs.pr_number }}
          COMMITS: ${{ steps.push-fix.outputs.commits }}
        with:
          script: |
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: parseInt(process.env.PR_NUMBER, 10),
              body: `🤖 **Claude addressed review findings** and pushed:\n\n${process.env.COMMITS}\n\nPer-finding details are in the replies on each review thread. [View run](${runUrl})\n\nPlease review the changes before merging.`
            });
