# Classify failed CI runs as flaky vs. real bug and auto-rerun the flaky
# ones. Chains into claude-ci-fix.yml (via workflow_dispatch) for everything
# else, instead of racing a second workflow_run trigger on CI against it:
# whoever decided first used to win, which meant claude-ci-fix sometimes
# started diagnosing a failure this workflow was about to auto-retry.
name: Claude Flaky Detect

on:
  workflow_run:
    workflows: ['CI']
    types: [completed]

permissions: {}

env:
  CLAUDE_MODEL: claude-haiku-4-5-20251001

jobs:
  classify:
    if: |
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.pull_requests[0] &&
      !startsWith(github.event.workflow_run.head_branch, 'claude-auto-fix-')
    runs-on: ubuntu-latest
    timeout-minutes: 8

    concurrency:
      group: claude-flaky-${{ github.event.workflow_run.head_branch }}
      cancel-in-progress: true

    permissions:
      contents: read
      actions: write
      pull-requests: write
      id-token: write

    steps:
      - name: Pre-filter deterministic tool failures
        id: prefilter
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
        run: |
          set -euo pipefail
          if [ "$RUN_ATTEMPT" -gt 1 ]; then
            echo "retry_failed=true" >> "$GITHUB_OUTPUT"
            echo "deterministic=true" >> "$GITHUB_OUTPUT"
            echo "The automatic flaky retry failed again; handing off to claude-ci-fix."
            exit 0
          fi
          echo "retry_failed=false" >> "$GITHUB_OUTPUT"
          FAILED_JOBS=$(gh run view "$RUN_ID" -R "$REPO" --json jobs \
            --jq '[.jobs[] | select(.conclusion == "failure") | .name]')
          echo "Failed jobs: $FAILED_JOBS"

          # Deterministic tooling checks (see .github/workflows/ci.yml job
          # ids) never flake -- a quality/type-check/build/etc failure is always
          # a real bug, so classifying it would just spend a Haiku call to
          # reach the same "real bug" verdict every time. Skip straight to
          # dispatching claude-ci-fix instead. Names are matched as
          # substrings because the reusable quality workflow renders as
          # "quality / run" via the Actions API.
          PATTERN='quality|type-check|build|osv|gitleaks|sbom'
          TOTAL=$(echo "$FAILED_JOBS" | jq 'length')
          NON_DETERMINISTIC=$(echo "$FAILED_JOBS" | jq --arg pat "$PATTERN" '[.[] | select(test($pat) | not)] | length')

          if [ "$TOTAL" -gt 0 ] && [ "$NON_DETERMINISTIC" -eq 0 ]; then
            echo "deterministic=true" >> "$GITHUB_OUTPUT"
            echo "All failed jobs are deterministic tooling checks; skipping the classifier."
          else
            echo "deterministic=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout repository
        if: steps.prefilter.outputs.deterministic != 'true'
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ github.event.workflow_run.head_branch }}
          fetch-depth: 1

      - name: Classify failure
        id: classify
        if: steps.prefilter.outputs.deterministic != 'true'
        uses: anthropics/claude-code-action@76c083468952ef555951bbe4d9e21a3929ae2637 # v1.0.93
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          allowed_bots: dependabot
          show_full_output: true
          prompt: |
            A CI run on this branch failed on its first attempt.

            Failed run: ${{ github.event.workflow_run.html_url }}
            Run ID: ${{ github.event.workflow_run.id }}

            Fetch the failed job logs with:
              gh run view ${{ github.event.workflow_run.id }} --log-failed

            Classify whether this is likely a flaky failure (retry would pass)
            or a real bug that needs code changes.

            Flaky signals:
            - Timeouts, network hiccups, rate-limit responses
            - Race conditions, "element not found" with no clear cause
            - Tests that passed on main within the last day for unchanged code
            - Intermittent Vitest browser-mode / Playwright errors

            Real-bug signals:
            - Deterministic lint / type-check / knip errors
            - Test assertion failures tied to source changes in this PR
            - Build or compile errors

            Return: is_flaky, confidence (0..1), summary (one sentence).
          additional_permissions: |
            actions: read
          claude_args: |
            --max-turns 8
            --model ${{ env.CLAUDE_MODEL }}
            --allowedTools "Read,Glob,Grep,Bash(gh:*),Bash(git log:*),Bash(git diff:*)"
            --json-schema '{"type":"object","properties":{"is_flaky":{"type":"boolean"},"confidence":{"type":"number","minimum":0,"maximum":1},"summary":{"type":"string"}},"required":["is_flaky","confidence","summary"],"additionalProperties":false}'

      - name: Act on classification
        if: always()
        uses: actions/github-script@373c709c69115d41ff229c7e5df9f8788daa9553 # v9
        env:
          STRUCTURED_OUTPUT: ${{ steps.classify.outputs.structured_output }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          DETERMINISTIC: ${{ steps.prefilter.outputs.deterministic }}
          RETRY_FAILED: ${{ steps.prefilter.outputs.retry_failed }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const runId = parseInt(process.env.RUN_ID, 10);
            const runUrl = process.env.RUN_URL;
            const headBranch = process.env.HEAD_BRANCH;
            const prNumber = parseInt(process.env.PR_NUMBER, 10);
            const deterministic = process.env.DETERMINISTIC === 'true';
            const retryFailed = process.env.RETRY_FAILED === 'true';

            const summary = [];
            summary.push('# Claude Flaky Detect');
            summary.push('');

            // claude-ci-fix.yml no longer has its own workflow_run trigger
            // (see Fix 1 in ci/reduce-claude-workflow-cost): every non-flaky
            // path here must chain into it explicitly via workflow_dispatch.
            const dispatchCiFix = async (reason) => {
              summary.push(`→ ${reason} Dispatching claude-ci-fix.`);
              await github.rest.actions.createWorkflowDispatch({
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: 'claude-ci-fix.yml',
                ref: process.env.DEFAULT_BRANCH || 'main',
                inputs: {
                  run_id: String(runId),
                  head_branch: headBranch,
                  pr_number: String(prNumber),
                },
              });
            };

            if (retryFailed) {
              summary.push('**Retry result**: the automatic flaky retry failed again.');
              summary.push('');
              await dispatchCiFix('Repeated failure after the automatic retry.');
              await core.summary.addRaw(summary.join('\n')).write();
              return;
            }

            if (deterministic) {
              summary.push('**Pre-filter**: every failed job is a deterministic tooling check.');
              summary.push('');
              await dispatchCiFix('Classifier skipped by design (deterministic failure).');
              await core.summary.addRaw(summary.join('\n')).write();
              return;
            }

            const raw = process.env.STRUCTURED_OUTPUT;
            if (!raw || !raw.trim()) {
              summary.push('_No structured output from the classifier._');
              // Fail open: a broken classifier must not silently disable auto-fix.
              await dispatchCiFix('Fail-open (no classifier output).');
              await core.summary.addRaw(summary.join('\n')).write();
              return;
            }

            let data;
            try {
              data = JSON.parse(raw);
            } catch (err) {
              summary.push(`_Failed to parse classifier output: ${err.message}_`);
              // Fail open: a broken classifier must not silently disable auto-fix.
              await dispatchCiFix('Fail-open (unparseable classifier output).');
              await core.summary.addRaw(summary.join('\n')).write();
              return;
            }

            summary.push(`**is_flaky**: ${data.is_flaky}`);
            summary.push(`**confidence**: ${data.confidence}`);
            summary.push(`**summary**: ${data.summary}`);
            summary.push('');

            const shouldRetry = data.is_flaky === true && data.confidence >= 0.7;

            if (shouldRetry) {
              summary.push('→ Retrying the failed run.');
              try {
                await github.rest.actions.reRunWorkflowFailedJobs({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  run_id: runId,
                });
              } catch (err) {
                summary.push(`⚠️ Failed to trigger rerun: ${err.message}`);
              }
              if (prNumber) {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: prNumber,
                  body: `🔄 **Flaky CI failure detected** (confidence ${data.confidence})\n\n> ${data.summary}\n\nAuto-retrying failed jobs. [Original run](${runUrl})`,
                });
              }
            } else if (data.is_flaky === true) {
              if (prNumber) {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: prNumber,
                  body: `⚠️ **Possible flaky CI failure** (confidence ${data.confidence} — below 0.7 threshold)\n\n> ${data.summary}\n\nNot retrying automatically; handing off to claude-ci-fix. [Original run](${runUrl})`,
                });
              }
              await dispatchCiFix('Possibly flaky but confidence below the 0.7 retry threshold.');
            } else {
              await dispatchCiFix('Classified as a real bug.');
            }

            await core.summary.addRaw(summary.join('\n')).write();
