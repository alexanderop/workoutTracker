name: CI Failure Triage

on:
  workflow_run: # zizmor: ignore[dangerous-triggers]
    workflows: ['CI']
    types: [completed]

permissions: {}

jobs:
  triage:
    if: |
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.pull_requests[0] &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      !startsWith(github.event.workflow_run.head_branch, 'claude-auto-fix-')
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    concurrency:
      group: ci-failure-triage-${{ github.event.workflow_run.pull_requests[0].number }}
      cancel-in-progress: true

    permissions:
      actions: write
      pull-requests: write

    steps:
      - name: Validate failed run and retry or dispatch repair
        uses: actions/github-script@373c709c69115d41ff229c7e5df9f8788daa9553 # v9
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          EXPECTED_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          EXPECTED_REPOSITORY: ${{ github.repository }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
          RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
        with:
          script: |
            const repository = process.env.EXPECTED_REPOSITORY;
            const [owner, repo] = repository.split('/');
            const prNumber = Number.parseInt(process.env.PR_NUMBER, 10);
            const runId = Number.parseInt(process.env.RUN_ID, 10);
            const runAttempt = Number.parseInt(process.env.RUN_ATTEMPT, 10);
            const expectedSha = process.env.EXPECTED_HEAD_SHA;
            const headBranch = process.env.HEAD_BRANCH;
            const runUrl = process.env.RUN_URL;

            if (!Number.isSafeInteger(prNumber) || !Number.isSafeInteger(runId)) {
              core.setFailed('Invalid workflow_run identifiers.');
              return;
            }
            if (!/^[0-9a-f]{40}$/.test(expectedSha)) {
              core.setFailed('Invalid workflow_run head SHA.');
              return;
            }

            const [{ data: pull }, { data: run }] = await Promise.all([
              github.rest.pulls.get({ owner, repo, pull_number: prNumber }),
              github.rest.actions.getWorkflowRun({ owner, repo, run_id: runId }),
            ]);
            if (pull.state !== 'open' || pull.head.repo.full_name !== repository ||
                pull.head.sha !== expectedSha || run.head_sha !== expectedSha ||
                run.head_repository.full_name !== repository ||
                run.name !== 'CI' || run.conclusion !== 'failure') {
              core.setFailed('Failed run no longer matches the open same-repository PR head.');
              return;
            }

            const dispatchRepair = async (reason) => {
              await github.rest.actions.createWorkflowDispatch({
                owner,
                repo,
                workflow_id: 'claude-ci-fix.yml',
                ref: process.env.DEFAULT_BRANCH || 'main',
                inputs: {
                  run_id: String(runId),
                  head_branch: headBranch,
                  pr_number: String(prNumber),
                },
              });
              await core.summary
                .addHeading('CI failure triage')
                .addRaw(`${reason} Dispatched the isolated repair workflow.`)
                .write();
            };

            if (runAttempt > 1) {
              await dispatchRepair('The automatic retry failed.');
              return;
            }

            const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, {
              owner,
              repo,
              run_id: runId,
              per_page: 100,
            });
            const failedNames = jobs
              .filter(job => job.conclusion === 'failure')
              .map(job => job.name);
            if (failedNames.length === 0) {
              core.setFailed('The failed workflow contains no failed jobs.');
              return;
            }

            const rootFailedNames = failedNames.filter(name => name !== 'Required CI');
            if (rootFailedNames.length === 0) {
              core.setFailed('Only the aggregate Required CI job was reported as failed.');
              return;
            }

            const deterministic = /quality|type-check|build|osv|gitleaks|sbom|workflow-lint/;
            if (rootFailedNames.every(name => deterministic.test(name))) {
              await dispatchRepair(`Deterministic checks failed: ${rootFailedNames.join(', ')}.`);
              return;
            }

            await github.rest.actions.reRunWorkflowFailedJobs({ owner, repo, run_id: runId });
            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number: prNumber,
              body: `🔄 Retrying potentially flaky CI jobs once. [Failed run](${runUrl})`,
            });
            await core.summary
              .addHeading('CI failure triage')
              .addRaw(`Retrying failed jobs: ${rootFailedNames.join(', ')}.`)
              .write();
