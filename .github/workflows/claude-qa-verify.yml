name: Claude QA Verification

on:
  pull_request:
    types: [labeled]
  issue_comment:
    types: [created]

jobs:
  qa-verify:
    # Triggers:
    # 1. Label 'qa-verify' added to PR
    # 2. Comment contains '@claude verify' on PR
    if: |
      (github.event_name == 'pull_request' && github.event.label.name == 'qa-verify') ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request &&
       contains(github.event.comment.body, '@claude verify'))

    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write

    env:
      NODE_VERSION: 22

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Get PR details
        id: pr-details
        uses: actions/github-script@v7
        with:
          script: |
            let prNumber, prBody, prTitle;

            if (context.eventName === 'pull_request') {
              prNumber = context.payload.pull_request.number;
              prBody = context.payload.pull_request.body || '';
              prTitle = context.payload.pull_request.title;
            } else {
              // Issue comment - get PR details
              prNumber = context.payload.issue.number;
              const { data: pr } = await github.rest.pulls.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: prNumber
              });
              prBody = pr.body || '';
              prTitle = pr.title;
            }

            // Also fetch linked issues from PR body
            const issueMatches = prBody.match(/(?:closes|fixes|resolves)\s+#(\d+)/gi) || [];
            let linkedIssueContent = '';

            for (const match of issueMatches) {
              const issueNum = match.match(/\d+/)[0];
              try {
                const { data: issue } = await github.rest.issues.get({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: parseInt(issueNum)
                });
                linkedIssueContent += `\n\n## Linked Issue #${issueNum}: ${issue.title}\n${issue.body || ''}`;
              } catch (e) {
                console.log(`Could not fetch issue #${issueNum}`);
              }
            }

            core.setOutput('pr_number', prNumber);
            core.setOutput('pr_title', prTitle);
            core.setOutput('pr_body', prBody);
            core.setOutput('linked_issues', linkedIssueContent);

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Get Playwright version
        id: playwright-version
        run: echo "version=$(npx playwright --version | cut -d' ' -f2)" >> $GITHUB_OUTPUT

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium --with-deps

      - name: Install Playwright dependencies (cached)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Start development server
        run: |
          pnpm dev --host 0.0.0.0 --port 5173 &
          DEV_PID=$!
          echo "DEV_PID=$DEV_PID" >> $GITHUB_ENV

          echo "Waiting for dev server..."
          for i in {1..60}; do
            if curl -s http://localhost:5173 > /dev/null 2>&1; then
              echo "Dev server ready!"
              exit 0
            fi
            sleep 1
          done
          echo "Dev server failed to start"
          exit 1

      - name: Run Claude QA Verification
        id: claude-qa
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            You are a senior QA engineer performing acceptance testing for a pull request.
            App URL: http://localhost:5173

            ## IMPORTANT: Budget your turns!
            You have limited turns. Be efficient and reserve LAST 3 turns for writing the report.

            ## Pull Request Context
            **PR #${{ steps.pr-details.outputs.pr_number }}**: ${{ steps.pr-details.outputs.pr_title }}

            ### PR Description:
            ${{ steps.pr-details.outputs.pr_body }}

            ### Linked Issues:
            ${{ steps.pr-details.outputs.linked_issues }}

            ---

            ## Your Task

            1. **Parse Requirements** (no tools needed): Read the PR description above. Extract:
               - Acceptance criteria (checkboxes, "should", "must", numbered items)
               - Bug fixes that need verification
               - If NO clear requirements found, note this in your report

            2. **Execute Tests**: For each requirement:
               - Navigate to the relevant page
               - Perform the actions to verify it works
               - Note pass/fail

            3. **Quick Regression**: After verifying PR changes, do a quick smoke test of navigation.

            ## FINAL STEP (MANDATORY!)
            Write a file `qa-verification.md` with this EXACT format:

            ```markdown
            # QA Verification Report

            **PR**: #${{ steps.pr-details.outputs.pr_number }} - ${{ steps.pr-details.outputs.pr_title }}
            **Date**: [today] | **Tester**: Claude QA

            ## Requirements Found
            [List requirements extracted from PR description, or "No clear requirements in PR description"]

            ## Verification Results

            | # | Requirement | Status | Notes |
            |---|-------------|--------|-------|
            | 1 | [requirement] | ✅/❌/⚠️ | [notes] |

            ## Regression Check
            | Area | Status |
            |------|--------|
            | Navigation | ✅/❌ |
            | Core UI | ✅/❌ |

            ## Console Errors
            [List errors or "None"]

            ## Verdict
            **[✅ APPROVED / ❌ NEEDS FIXES / ⚠️ NEEDS CLARIFICATION]**

            [1-2 sentence summary]
            ```

            After writing the file, read it back to confirm it was saved.

          claude_args: |
            --max-turns 35
            --mcp-config '{"mcpServers":{"playwright":{"command":"npx","args":["@playwright/mcp@latest","--headless","--isolated"]}}}'
            --allowedTools "mcp__playwright__browser_navigate,mcp__playwright__browser_click,mcp__playwright__browser_type,mcp__playwright__browser_snapshot,mcp__playwright__browser_screenshot,mcp__playwright__browser_console_messages,mcp__playwright__browser_wait,mcp__playwright__browser_hover,mcp__playwright__browser_resize,Read,Write"

      - name: Post QA report to PR
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const prNumber = ${{ steps.pr-details.outputs.pr_number }};

            // Try to read Claude's verification report
            let qaReport = '';
            try {
              qaReport = fs.readFileSync('qa-verification.md', 'utf8');
            } catch (e) {
              qaReport = '⚠️ QA verification report not generated. Check workflow logs.';
            }

            const body = `## 🔍 Claude QA Verification

            **Run**: [View Logs](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})

            ---

            ${qaReport}

            ---
            *Automated verification by Claude Code*`;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              body: body
            });

      - name: Upload QA report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-verification-report
          path: qa-verification.md
          if-no-files-found: ignore

      - name: Remove label
        if: github.event_name == 'pull_request' && github.event.label.name == 'qa-verify'
        uses: actions/github-script@v7
        with:
          script: |
            try {
              await github.rest.issues.removeLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.pull_request.number,
                name: 'qa-verify'
              });
            } catch (e) {
              console.log('Label already removed or not found');
            }

      - name: Cleanup
        if: always()
        run: kill $DEV_PID 2>/dev/null || true
