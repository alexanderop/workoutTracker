name: Claude PR Review

on:
  pull_request:
    # Synchronize runs only the cheap compatibility gate below. The Claude
    # action still reviews once per PR (open or ready), while a PR that edits
    # this workflow can replace its initial unavoidable OIDC failure with a
    # successful skipped check on the next push.
    types: [opened, ready_for_review, synchronize]
    paths-ignore:
      - '*.md'
      - 'brain/reference/**'
      - '.github/workflows/release.yml'

permissions: {}

env:
  CLAUDE_MODEL: claude-sonnet-5

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    concurrency:
      group: claude-review-${{ github.event.pull_request.number }}
      cancel-in-progress: true

    permissions:
      contents: read
      pull-requests: write
      issues: write
      actions: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0

      - name: Check Claude workflow compatibility
        id: workflow-compat
        shell: bash
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$DEFAULT_BRANCH"
          if git diff --quiet "origin/${DEFAULT_BRANCH}" -- \
            .github/workflows/claude-pr-review.yml; then
            echo "compatible=true" >> "$GITHUB_OUTPUT"
          else
            echo "compatible=false" >> "$GITHUB_OUTPUT"
            echo "Claude review skipped: its workflow differs from the default branch, so OIDC validation would reject it."
          fi

      - name: Run Claude PR Review
        if: >-
          steps.workflow-compat.outputs.compatible == 'true' &&
          (github.event.action == 'ready_for_review' ||
           (github.event.action == 'opened' && github.event.pull_request.draft == false))
        uses: anthropics/claude-code-action@76c083468952ef555951bbe4d9e21a3929ae2637 # v1.0.93
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          show_full_output: true
          track_progress: true
          use_sticky_comment: true
          prompt: |
            Review this pull request for a Vue 3 + TypeScript workout tracker PWA.

            Focus on:
            1. Logic errors and potential bugs
            2. Security vulnerabilities (XSS, injection)
            3. Performance issues (unnecessary reactivity, large bundles)
            4. Missing error handling at system boundaries
            5. Vue 3 anti-patterns (wrong use of reactive, missing cleanup)
            6. TypeScript strictness (any usage, unsafe casts)

            Do NOT flag:
            - Style/formatting (ESLint handles that)
            - Missing brain/reference/comments on clear code
            - Raw coverage percentage (the test-coverage CI job enforces thresholds)

            Use inline comments for specific issues. End with a summary comment.
          claude_args: '--max-turns 50 --model ${{ env.CLAUDE_MODEL }}'
