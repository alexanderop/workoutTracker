name: Claude PR Review

on:
  pull_request:
    # No `synchronize`: CodeRabbit and Copilot already re-review every push,
    # so this standalone Claude review only needs to run once per PR (at
    # open, or when a draft comes off hold) instead of on every commit.
    types: [opened, ready_for_review]
    paths-ignore:
      - '*.md'
      - 'brain/reference/**'
      - '.github/workflows/release.yml'

permissions: {}

env:
  CLAUDE_MODEL: claude-sonnet-5

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    concurrency:
      group: claude-review-${{ github.event.pull_request.number }}
      cancel-in-progress: true

    permissions:
      contents: read
      pull-requests: write
      issues: write
      actions: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0

      - name: Run Claude PR Review
        uses: anthropics/claude-code-action@76c083468952ef555951bbe4d9e21a3929ae2637 # v1.0.93
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          show_full_output: true
          track_progress: true
          use_sticky_comment: true
          prompt: |
            Review this pull request for a Vue 3 + TypeScript workout tracker PWA.

            Focus on:
            1. Logic errors and potential bugs
            2. Security vulnerabilities (XSS, injection)
            3. Performance issues (unnecessary reactivity, large bundles)
            4. Missing error handling at system boundaries
            5. Vue 3 anti-patterns (wrong use of reactive, missing cleanup)
            6. TypeScript strictness (any usage, unsafe casts)

            Do NOT flag:
            - Style/formatting (ESLint handles that)
            - Missing brain/reference/comments on clear code
            - Raw coverage percentage (the test-coverage CI job enforces thresholds)

            Use inline comments for specific issues. End with a summary comment.
          claude_args: '--max-turns 50 --model ${{ env.CLAUDE_MODEL }}'
