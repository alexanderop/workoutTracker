name: Claude QA (Browser)

on:
  workflow_dispatch:
    inputs:
      focus:
        description: 'Test focus area'
        type: choice
        options:
          - fast
          - general
          - test
          - verify
          - navigation
          - forms
          - workout-flow
        default: 'fast'
      pr_number:
        description: 'PR number (for posting results)'
        required: false
        type: string
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled]
    paths-ignore:
      - '*.md'
      - 'docs/**'
      - '.github/workflows/release.yml'
  issue_comment:
    types: [created]

permissions: {}

jobs:
  qa-browser:
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       (github.event.action != 'labeled' || github.event.label.name == 'qa-verify')) ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request &&
       contains(fromJson('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association) &&
       (contains(github.event.comment.body, '@claude verify') || contains(github.event.comment.body, '@claude test')))

    runs-on: ubuntu-latest
    timeout-minutes: 60

    concurrency:
      group: claude-qa-browser-${{ github.event.pull_request.number || github.event.issue.number || github.ref }}
      cancel-in-progress: true

    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
      statuses: write
      actions: read

    env:
      NODE_VERSION: '22'
      CLAUDE_MODEL: claude-opus-4-6
      APP_URL: http://localhost:5173

    steps:
      - name: Get PR metadata for issue_comment
        if: github.event_name == 'issue_comment'
        id: pr-metadata
        uses: actions/github-script@373c709c69115d41ff229c7e5df9f8788daa9553 # v9
        with:
          script: |
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.issue.number
            });
            core.setOutput('ref', pr.head.sha);
            core.setOutput('number', String(pr.number));
            core.setOutput('title', pr.title || '');
            core.setOutput('body', pr.body || '');
            core.setOutput('is_fork', String(pr.head.repo.full_name !== `${context.repo.owner}/${context.repo.repo}`));

      - name: Block fork PR QA on comment trigger
        if: github.event_name == 'issue_comment' && steps.pr-metadata.outputs.is_fork == 'true'
        shell: bash
        run: |
          echo "Refusing to run browser QA against fork PR code from a comment trigger."
          exit 1

      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ steps.pr-metadata.outputs.ref || github.event.pull_request.head.sha || github.sha }}

      - name: Setup test environment
        uses: ./.github/actions/setup-test-env
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup agent-browser
        uses: ./.github/actions/setup-agent-browser

      - name: Determine QA mode
        id: qa-mode
        shell: bash
        env:
          COMMENT_BODY_INPUT: ${{ github.event.comment.body || '' }}
        run: |
          set -euo pipefail
          FOCUS="${{ github.event.inputs.focus || 'fast' }}"
          if [[ "${{ github.event_name }}" == "pull_request" && "${{ github.event.action }}" != "labeled" ]]; then
            FOCUS="fast"
          elif [[ "${{ github.event.label.name }}" == "qa-verify" ]]; then
            FOCUS="verify"
          elif [[ "${{ github.event_name }}" == "issue_comment" ]]; then
            COMMENT_BODY="${COMMENT_BODY_INPUT}"
            if [[ "$COMMENT_BODY" == *"@claude test"* ]]; then
              FOCUS="test"
            else
              FOCUS="verify"
            fi
          fi
          echo "focus=$FOCUS" >> "$GITHUB_OUTPUT"
          echo "QA focus: $FOCUS"

      - name: Get PR context
        if: steps.qa-mode.outputs.focus == 'verify' || steps.qa-mode.outputs.focus == 'fast'
        id: pr-context
        uses: actions/github-script@373c709c69115d41ff229c7e5df9f8788daa9553 # v9
        env:
          PR_NUMBER_INPUT: ${{ github.event.inputs.pr_number }}
          PR_NUMBER_COMMENT: ${{ steps.pr-metadata.outputs.number }}
          PR_TITLE_COMMENT: ${{ steps.pr-metadata.outputs.title }}
          PR_BODY_COMMENT: ${{ steps.pr-metadata.outputs.body }}
        with:
          script: |
            let prNumber, prBody, prTitle;
            const extractSection = (body, heading) => {
              if (!body) return '';
              const escapedHeading = heading.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
              const regex = new RegExp(`##\\s+${escapedHeading}\\s*\\n([\\s\\S]*?)(?=\\n##\\s+|\\n#\\s+|$)`, 'i');
              const match = body.match(regex);
              return match ? match[1].trim() : '';
            };
            const hasMeaningfulContent = (section) => {
              if (!section) return false;
              const normalized = section
                .replace(/[`*_>-]/g, ' ')
                .replace(/\s+/g, ' ')
                .trim()
                .toLowerCase();

              if (!normalized) return false;

              const placeholderPatterns = [
                'user can ...',
                'existing flow still ...',
                'affected users:',
                'behavior change:',
                'changed flow to verify:',
                'one adjacent regression path to verify:',
                'scenario:',
                'given:',
                'when:',
                'then:',
                'forms / validation',
                'navigation / routing',
                'persistence / saved state',
                'mobile layout / touch interactions',
              ];

              return !placeholderPatterns.some(pattern => normalized.includes(pattern));
            };

            if (context.eventName === 'pull_request') {
              prNumber = context.payload.pull_request.number;
              prBody = context.payload.pull_request.body || '';
              prTitle = context.payload.pull_request.title;
            } else if (context.eventName === 'issue_comment') {
              prNumber = parseInt(process.env.PR_NUMBER_COMMENT, 10);
              prBody = process.env.PR_BODY_COMMENT || '';
              prTitle = process.env.PR_TITLE_COMMENT || '';
            } else if (process.env.PR_NUMBER_INPUT) {
              prNumber = parseInt(process.env.PR_NUMBER_INPUT, 10);
              const { data: pr } = await github.rest.pulls.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: prNumber
              });
              prBody = pr.body || '';
              prTitle = pr.title;
            }

            // Fetch linked issues (closes #123, fixes #456)
            let linkedIssues = '';
            if (prBody) {
              const matches = prBody.match(/(?:closes|fixes|resolves)\s+#(\d+)/gi) || [];
              for (const match of matches) {
                const issueNum = match.match(/\d+/)[0];
                try {
                  const { data: issue } = await github.rest.issues.get({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    issue_number: parseInt(issueNum)
                  });
                  linkedIssues += `\n### Issue #${issueNum}: ${issue.title}\n${issue.body || ''}\n`;
                } catch (e) {}
              }
            }

            const summary = extractSection(prBody, 'Summary');
            const userImpact = extractSection(prBody, 'User Impact');
            const acceptanceCriteria = extractSection(prBody, 'Acceptance Criteria');
            const qaScope = extractSection(prBody, 'QA Scope');
            const riskAreas = extractSection(prBody, 'Risk Areas');
            const manualTestScenarios = extractSection(prBody, 'Manual Test Scenarios');

            const missingSections = [];
            if (!hasMeaningfulContent(acceptanceCriteria)) missingSections.push('Acceptance Criteria');
            if (!hasMeaningfulContent(qaScope)) missingSections.push('QA Scope');
            if (!hasMeaningfulContent(riskAreas)) missingSections.push('Risk Areas');

            core.setOutput('pr_number', prNumber || '');
            core.setOutput('pr_title', prTitle || '');
            core.setOutput('pr_body', prBody || '');
            core.setOutput('linked_issues', linkedIssues);
            core.setOutput('pr_summary', summary || '');
            core.setOutput('user_impact', userImpact || '');
            core.setOutput('acceptance_criteria', acceptanceCriteria || '');
            core.setOutput('qa_scope', qaScope || '');
            core.setOutput('risk_areas', riskAreas || '');
            core.setOutput('manual_test_scenarios', manualTestScenarios || '');
            core.setOutput('contract_valid', String(missingSections.length === 0));
            core.setOutput('missing_sections', missingSections.join(', ') || 'None');

      - name: Create QA fixtures
        uses: ./.github/actions/create-qa-fixtures

      - name: Start development server
        uses: ./.github/actions/start-dev-server
        with:
          url: ${{ env.APP_URL }}

      - name: Load QA system prompt
        id: load-system-prompt
        shell: bash
        run: |
          set -euo pipefail
          {
            echo 'system_prompt<<SYSTEM_EOF'
            cat .claude/prompts/qa-system-prompt.md
            echo 'SYSTEM_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Load QA prompt
        id: load-prompt
        shell: bash
        env:
          PR_BODY_RAW: ${{ steps.pr-context.outputs.pr_body }}
          LINKED_ISSUES_RAW: ${{ steps.pr-context.outputs.linked_issues }}
          APP_URL_VALUE: ${{ env.APP_URL }}
          PR_NUMBER_VALUE: ${{ steps.pr-context.outputs.pr_number }}
          PR_TITLE_VALUE: ${{ steps.pr-context.outputs.pr_title }}
          PR_SUMMARY_VALUE: ${{ steps.pr-context.outputs.pr_summary }}
          USER_IMPACT_VALUE: ${{ steps.pr-context.outputs.user_impact }}
          ACCEPTANCE_CRITERIA_VALUE: ${{ steps.pr-context.outputs.acceptance_criteria }}
          QA_SCOPE_VALUE: ${{ steps.pr-context.outputs.qa_scope }}
          RISK_AREAS_VALUE: ${{ steps.pr-context.outputs.risk_areas }}
          MANUAL_TEST_SCENARIOS_VALUE: ${{ steps.pr-context.outputs.manual_test_scenarios }}
          CONTRACT_VALID_VALUE: ${{ steps.pr-context.outputs.contract_valid }}
          MISSING_SECTIONS_VALUE: ${{ steps.pr-context.outputs.missing_sections }}
        run: |
          set -euo pipefail
          TODAY=$(date +%Y-%m-%d)
          FOCUS="${{ steps.qa-mode.outputs.focus }}"

          if [ "$FOCUS" = "fast" ]; then
            PROMPT_FILE=".claude/prompts/qa-browser-fast.md"
            echo "max_turns=200" >> "$GITHUB_OUTPUT"
          elif [ "$FOCUS" = "test" ]; then
            PROMPT_FILE=".claude/prompts/qa-browser-test.md"
            echo "max_turns=200" >> "$GITHUB_OUTPUT"
          elif [ "$FOCUS" = "verify" ]; then
            PROMPT_FILE=".claude/prompts/qa-browser-verify.md"
            echo "max_turns=200" >> "$GITHUB_OUTPUT"
          else
            PROMPT_FILE=".claude/prompts/qa-browser-explore.md"
            echo "max_turns=200" >> "$GITHUB_OUTPUT"
          fi

          {
            echo 'prompt<<PROMPT_EOF'

            TASK=$(cat "$PROMPT_FILE")
            TASK="${TASK//\{\{APP_URL\}\}/$APP_URL_VALUE}"
            TASK="${TASK//\{\{DATE\}\}/$TODAY}"

            # For PR-aware modes, inject structured PR context
            if [ "$FOCUS" = "verify" ] || [ "$FOCUS" = "fast" ]; then
              TASK="${TASK//\{\{PR_NUMBER\}\}/$PR_NUMBER_VALUE}"
              TASK="${TASK//\{\{PR_TITLE\}\}/$PR_TITLE_VALUE}"
              TASK="${TASK//\{\{PR_BODY\}\}/$PR_BODY_RAW}"
              TASK="${TASK//\{\{LINKED_ISSUES\}\}/$LINKED_ISSUES_RAW}"
              TASK="${TASK//\{\{PR_SUMMARY\}\}/$PR_SUMMARY_VALUE}"
              TASK="${TASK//\{\{USER_IMPACT\}\}/$USER_IMPACT_VALUE}"
              TASK="${TASK//\{\{ACCEPTANCE_CRITERIA\}\}/$ACCEPTANCE_CRITERIA_VALUE}"
              TASK="${TASK//\{\{QA_SCOPE\}\}/$QA_SCOPE_VALUE}"
              TASK="${TASK//\{\{RISK_AREAS\}\}/$RISK_AREAS_VALUE}"
              TASK="${TASK//\{\{MANUAL_TEST_SCENARIOS\}\}/$MANUAL_TEST_SCENARIOS_VALUE}"
              TASK="${TASK//\{\{CONTRACT_VALID\}\}/$CONTRACT_VALID_VALUE}"
              TASK="${TASK//\{\{MISSING_SECTIONS\}\}/$MISSING_SECTIONS_VALUE}"
            fi

            echo "$TASK"

            echo 'PROMPT_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Load QA schema
        id: load-schema
        shell: bash
        run: |
          set -euo pipefail
          SCHEMA=$(cat .github/schemas/qa-report-schema.json | tr -d '\n' | sed "s/'/\\\\'/g")
          echo "schema=$SCHEMA" >> "$GITHUB_OUTPUT"

      - name: Remove stale fixture outputs
        shell: bash
        run: rm -f qa-report.md qa-structured-output.json

      - name: Dev server health check
        shell: bash
        run: |
          set -euo pipefail
          echo "Verifying dev server at ${{ env.APP_URL }}..."
          if ! curl -fsS --max-time 10 "${{ env.APP_URL }}" > /dev/null; then
            echo "::error::Dev server is not reachable at ${{ env.APP_URL }}"
            echo "--- dev-server.log (last 50 lines) ---"
            tail -50 /tmp/dev-server.log 2>/dev/null || echo "(no dev-server.log)"
            exit 1
          fi
          echo "Dev server is reachable."

      - name: Warm-up smoke check (agent-browser + onboarding)
        shell: bash
        run: |
          set -euo pipefail
          echo "--- agent-browser open ---"
          agent-browser open "${{ env.APP_URL }}"
          echo "--- clearing storage to force fresh onboarding state ---"
          agent-browser storage local clear || true
          agent-browser reload || true
          echo "--- initial snapshot ---"
          SNAPSHOT=$(agent-browser snapshot -i -c)
          echo "$SNAPSHOT"
          if ! echo "$SNAPSHOT" | grep -qE 'Skip to App|button "Home"'; then
            echo "::error::App did not render — neither onboarding nor main nav visible"
            exit 1
          fi
          if echo "$SNAPSHOT" | grep -q "Skip to App"; then
            echo "Warm-up passed: onboarding carousel visible (fresh state)."
          else
            echo "Warm-up passed: main nav visible (onboarding already dismissed — localStorage clear may have failed)."
          fi

      - name: Run Claude QA (Browser mode)
        id: claude-qa
        timeout-minutes: 15
        continue-on-error: true
        uses: anthropics/claude-code-action@c7c8889b30499b4e46f4c32b892e43cd364bc2fe # v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          show_full_output: true
          display_report: true
          use_sticky_comment: true
          track_progress: ${{ github.event_name == 'pull_request' && github.event.action != 'labeled' }}
          prompt: ${{ steps.load-prompt.outputs.prompt }}
          additional_permissions: |
            actions: read
          claude_args: |
            --allowedTools "Bash,Write,Read,Glob,Grep"
            --max-turns ${{ steps.load-prompt.outputs.max_turns || '200' }}
            --model ${{ env.CLAUDE_MODEL }}
            --json-schema '${{ steps.load-schema.outputs.schema }}'
            --append-system-prompt "${{ steps.load-system-prompt.outputs.system_prompt }}"

      - name: Check report exists
        id: check-report
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ -f "qa-report.md" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Early summarize on Claude failure
        if: always() && (steps.claude-qa.outcome == 'failure' || steps.claude-qa.outcome == 'cancelled')
        uses: ./.github/actions/summarize-claude-run
        with:
          debug-dir: qa-debug

      # Retry with a quick smoke test if main run failed to generate a report
      - name: Retry if no report generated
        id: claude-qa-retry
        if: steps.check-report.outputs.exists == 'false'
        timeout-minutes: 8
        uses: anthropics/claude-code-action@c7c8889b30499b4e46f4c32b892e43cd364bc2fe # v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          show_full_output: true
          display_report: true
          use_sticky_comment: true
          track_progress: ${{ github.event_name == 'pull_request' && github.event.action != 'labeled' }}
          prompt: |
            IMPORTANT: The previous QA run did not generate a report.

            Do a quick navigation smoke test and write qa-report.md immediately:
            1. Open ${{ env.APP_URL }} with agent-browser
            2. Dismiss onboarding (click "Skip to App")
            3. Check 3-4 main pages load correctly
            4. Write the report with what you observed

            Write `qa-report.md` now with:
            - Summary of pages tested
            - Any errors found
            - Verdict: HEALTHY / MINOR_ISSUES / CRITICAL_BUGS
          claude_args: |
            --allowedTools "Bash,Write,Read,Glob,Grep"
            --max-turns 30
            --model ${{ env.CLAUDE_MODEL }}
            --json-schema '${{ steps.load-schema.outputs.schema }}'
            --append-system-prompt "${{ steps.load-system-prompt.outputs.system_prompt }}"

      - name: Verify report after retry
        id: check-report-retry
        if: steps.check-report.outputs.exists == 'false'
        shell: bash
        run: |
          set -euo pipefail
          if [ -f "qa-report.md" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Post QA report as PR comment
        if: always() && (github.event.pull_request.number || steps.pr-metadata.outputs.number || github.event.inputs.pr_number)
        uses: ./.github/actions/post-qa-report
        with:
          pr-number: ${{ github.event.pull_request.number || steps.pr-metadata.outputs.number || github.event.inputs.pr_number }}
          heading: '## Claude QA (Browser) Report'
          marker: '<!-- claude-qa-browser-report -->'
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set commit status
        id: qa-status
        if: always()
        uses: actions/github-script@373c709c69115d41ff229c7e5df9f8788daa9553 # v9
        env:
          STRUCTURED_OUTPUT: ${{ steps.claude-qa.outputs.structured_output || steps.claude-qa-retry.outputs.structured_output }}
          CONTRACT_VALID: ${{ steps.pr-context.outputs.contract_valid || 'true' }}
          MISSING_SECTIONS: ${{ steps.pr-context.outputs.missing_sections || 'None' }}
        with:
          script: |
            const fs = require('fs');
            let state = 'success';
            let description = 'QA passed';

            const structuredOutput = process.env.STRUCTURED_OUTPUT;
            if (structuredOutput && structuredOutput.trim()) {
              try {
                const data = JSON.parse(structuredOutput);

                if (data.verdict === 'CRITICAL_BUGS' || data.metrics.critical_bugs > 0) {
                  state = 'failure';
                  description = `QA found ${data.metrics.critical_bugs} critical bug(s)`;
                } else if (process.env.CONTRACT_VALID === 'false') {
                  state = 'pending';
                  description = `QA limited: missing ${process.env.MISSING_SECTIONS}`;
                } else if (data.verdict === 'MINOR_ISSUES' || data.metrics.major_bugs > 0) {
                  state = 'pending';
                  const issueCount = (data.metrics.minor_bugs || 0) + (data.metrics.major_bugs || 0);
                  description = `QA found ${issueCount} issue(s) to review`;
                } else {
                  state = 'success';
                  description = `QA passed (${data.metrics.passed}/${data.metrics.total_tests} tests)`;
                }

                core.setOutput('metrics', JSON.stringify(data.metrics));
                core.setOutput('verdict', data.verdict);
              } catch (parseErr) {
                core.warning(`Failed to parse structured output: ${parseErr.message}`);
              }
            } else {
              try {
                const report = fs.readFileSync('qa-report.md', 'utf8');
                if (/CRITICAL/i.test(report)) {
                  state = 'failure';
                  description = 'QA found critical issues';
                } else if (process.env.CONTRACT_VALID === 'false') {
                  state = 'pending';
                  description = `QA limited: missing ${process.env.MISSING_SECTIONS}`;
                } else if (/MINOR/i.test(report) || report.includes('WARNING')) {
                  state = 'pending';
                  description = 'QA found minor issues';
                }
              } catch (e) {
                state = 'error';
                description = 'QA report not generated';
              }
            }

            // Use PR head sha for issue_comment, otherwise use context.sha
            const sha = '${{ steps.pr-metadata.outputs.ref }}' || context.sha;

            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: sha,
              state: state,
              context: 'Claude QA (Browser)',
              description: description,
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            });

            core.setOutput('qa_state', state);

      - name: Write structured output to file
        if: always()
        shell: bash
        env:
          STRUCTURED_OUTPUT: ${{ steps.claude-qa.outputs.structured_output || steps.claude-qa-retry.outputs.structured_output }}
        run: |
          set -euo pipefail
          if [ -n "${STRUCTURED_OUTPUT:-}" ]; then
            printf '%s' "$STRUCTURED_OUTPUT" > qa-structured-output.json
          fi

      - name: Render QA summary to step summary
        if: always()
        uses: actions/github-script@373c709c69115d41ff229c7e5df9f8788daa9553 # v9
        env:
          STRUCTURED_OUTPUT: ${{ steps.claude-qa.outputs.structured_output || steps.claude-qa-retry.outputs.structured_output }}
          QA_FOCUS: ${{ steps.qa-mode.outputs.focus }}
          PR_NUMBER: ${{ steps.pr-context.outputs.pr_number }}
          CONTRACT_VALID: ${{ steps.pr-context.outputs.contract_valid || 'true' }}
          MISSING_SECTIONS: ${{ steps.pr-context.outputs.missing_sections || 'None' }}
        with:
          script: |
            const fs = require('fs');
            const raw = process.env.STRUCTURED_OUTPUT;
            const focus = process.env.QA_FOCUS || 'unknown';
            const prNumber = process.env.PR_NUMBER || '';
            const contractValid = process.env.CONTRACT_VALID === 'true';
            const missingSections = process.env.MISSING_SECTIONS || 'None';

            const lines = [];
            lines.push(`# Claude QA (Browser) — \`${focus}\``);
            if (prNumber) lines.push(`**PR**: #${prNumber}`);
            if (!contractValid) lines.push(`> ⚠️ PR contract incomplete — missing: ${missingSections}`);
            lines.push('');

            if (!raw || !raw.trim()) {
              lines.push('_No structured output captured._ Check the sticky PR comment or `qa-report.md` artifact.');
              await core.summary.addRaw(lines.join('\n')).write();
              return;
            }

            let data;
            try {
              data = JSON.parse(raw);
            } catch (err) {
              lines.push(`_Could not parse structured_output as JSON: ${err.message}_`);
              lines.push('```');
              lines.push(raw.slice(0, 2000));
              lines.push('```');
              await core.summary.addRaw(lines.join('\n')).write();
              return;
            }

            const verdictBadge = {
              HEALTHY: '✅ HEALTHY',
              MINOR_ISSUES: '⚠️ MINOR ISSUES',
              CRITICAL_BUGS: '❌ CRITICAL BUGS',
            }[data.verdict] || data.verdict || 'UNKNOWN';
            lines.push(`## Verdict: ${verdictBadge}`);
            if (data.summary) {
              lines.push('');
              lines.push(data.summary);
            }
            lines.push('');

            const m = data.metrics || {};
            lines.push('## Metrics');
            lines.push('');
            lines.push('| Total | Passed | Failed | Critical | Major | Minor |');
            lines.push('|------:|-------:|-------:|---------:|------:|------:|');
            lines.push(`| ${m.total_tests ?? 0} | ${m.passed ?? 0} | ${m.failed ?? 0} | ${m.critical_bugs ?? 0} | ${m.major_bugs ?? 0} | ${m.minor_bugs ?? 0} |`);
            lines.push('');

            const bugs = Array.isArray(data.bugs) ? data.bugs : [];
            if (bugs.length) {
              const sevOrder = { critical: 0, major: 1, minor: 2, suggestion: 3 };
              const sevIcon = { critical: '🔴', major: '🟠', minor: '🟡', suggestion: '💡' };
              const sorted = [...bugs].sort((a, b) => (sevOrder[a.severity] ?? 9) - (sevOrder[b.severity] ?? 9));
              lines.push('## Bugs');
              lines.push('');
              lines.push('| # | Severity | Title | What happened |');
              lines.push('|---|----------|-------|---------------|');
              for (const bug of sorted) {
                const icon = sevIcon[bug.severity] || '•';
                const title = (bug.title || '').replace(/\|/g, '\\|');
                const desc = (bug.description || '').replace(/\|/g, '\\|').replace(/\r?\n/g, ' ').slice(0, 200);
                lines.push(`| ${bug.id ?? ''} | ${icon} ${bug.severity || ''} | ${title} | ${desc} |`);
              }
              lines.push('');
            }

            const tests = Array.isArray(data.tests) ? data.tests : [];
            if (tests.length) {
              const resultIcon = { pass: '✅', fail: '❌', skip: '⏭️' };
              lines.push('<details><summary>Tests performed</summary>');
              lines.push('');
              lines.push('| # | Area | Result | Name | Details |');
              lines.push('|---|------|--------|------|---------|');
              tests.forEach((t, i) => {
                const icon = resultIcon[t.result] || '•';
                const name = (t.name || '').replace(/\|/g, '\\|');
                const details = (t.details || '').replace(/\|/g, '\\|').replace(/\r?\n/g, ' ').slice(0, 160);
                lines.push(`| ${i + 1} | ${t.area || ''} | ${icon} | ${name} | ${details} |`);
              });
              lines.push('');
              lines.push('</details>');
              lines.push('');
            }

            const consoleErrors = Array.isArray(data.console_errors) ? data.console_errors : [];
            if (consoleErrors.length) {
              lines.push(`<details><summary>Console errors (${consoleErrors.length})</summary>`);
              lines.push('');
              lines.push('```');
              for (const err of consoleErrors.slice(0, 50)) lines.push(String(err));
              lines.push('```');
              lines.push('');
              lines.push('</details>');
              lines.push('');
            }

            lines.push('---');
            lines.push('Full report: see `qa-report.md` in run artifacts.');

            await core.summary.addRaw(lines.join('\n')).write();

      - name: Summarize Claude run
        if: always()
        uses: ./.github/actions/summarize-claude-run
        with:
          debug-dir: qa-debug

      - name: Collect claude debug artifacts
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p qa-debug
          cp /home/runner/work/_temp/claude-execution-output.json qa-debug/claude-execution-output.json 2>/dev/null || echo "no claude-execution-output.json"
          cp /tmp/dev-server.log qa-debug/dev-server.log 2>/dev/null || echo "no dev-server.log"
          ls -la qa-debug/ || true

      - name: Upload QA artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: qa-browser-artifacts-${{ github.run_id }}
          path: |
            qa-report.md
            qa-structured-output.json
            qa-debug/
          if-no-files-found: ignore

      - name: Remove trigger label
        if: |
          github.event_name == 'pull_request' &&
          github.event.label.name == 'qa-verify'
        uses: actions/github-script@373c709c69115d41ff229c7e5df9f8788daa9553 # v9
        env:
          LABEL_NAME: ${{ github.event.label.name }}
        with:
          script: |
            try {
              await github.rest.issues.removeLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.pull_request.number,
                name: process.env.LABEL_NAME
              });
            } catch (e) {
              if (e.status !== 404) core.warning(`Failed to remove label: ${e.message}`);
            }

      - name: Cleanup
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          kill "${DEV_PID:-}" 2>/dev/null || true
          agent-browser close 2>/dev/null || true

      - name: Fail job if QA found issues
        if: steps.qa-status.outputs.qa_state == 'failure'
        shell: bash
        run: |
          set -euo pipefail
          echo "❌ QA found critical issues - failing the pipeline"
          exit 1
