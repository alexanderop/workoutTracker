# Claude QA with agent-browser
# Uses agent-browser (vercel-labs/agent-browser) for browser-based QA testing

name: Claude QA (Browser)

on:
  workflow_dispatch:
    inputs:
      focus:
        description: 'Test focus area'
        type: choice
        options:
          - general
          - test
          - verify
          - navigation
          - forms
          - workout-flow
        default: 'general'
      pr_number:
        description: 'PR number (for posting results)'
        required: false
        type: string
  pull_request:
    types: [labeled]
  issue_comment:
    types: [created]

jobs:
  qa-browser:
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
       github.event.label.name == 'qa-verify' &&
       github.event.pull_request.head.repo.full_name == github.repository) ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request &&
       contains(fromJson('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association) &&
       (contains(github.event.comment.body, '@claude verify') || contains(github.event.comment.body, '@claude test')))

    runs-on: ubuntu-latest
    timeout-minutes: 60

    concurrency:
      group: claude-qa-browser-${{ github.event.pull_request.number || github.event.issue.number || github.ref }}
      cancel-in-progress: true

    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
      statuses: write
      actions: read

    env:
      NODE_VERSION: '22'

    steps:
      - name: Get PR metadata for issue_comment
        if: github.event_name == 'issue_comment'
        id: pr-metadata
        uses: actions/github-script@v9
        with:
          script: |
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.issue.number
            });
            core.setOutput('ref', pr.head.sha);
            core.setOutput('number', String(pr.number));
            core.setOutput('title', pr.title || '');
            core.setOutput('body', pr.body || '');
            core.setOutput('is_fork', String(pr.head.repo.full_name !== `${context.repo.owner}/${context.repo.repo}`));

      - name: Block fork PR QA on comment trigger
        if: github.event_name == 'issue_comment' && steps.pr-metadata.outputs.is_fork == 'true'
        shell: bash
        run: |
          echo "Refusing to run browser QA against fork PR code from a comment trigger."
          exit 1

      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.pr-metadata.outputs.ref || github.event.pull_request.head.sha || github.sha }}

      - name: Setup test environment
        uses: ./.github/actions/setup-test-env
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install agent-browser
        shell: bash
        run: |
          npm install -g agent-browser
          agent-browser install

      - name: Determine QA mode
        id: qa-mode
        shell: bash
        run: |
          FOCUS="${{ github.event.inputs.focus || 'general' }}"
          if [[ "${{ github.event.label.name }}" == "qa-verify" ]]; then
            FOCUS="verify"
          elif [[ "${{ github.event_name }}" == "issue_comment" ]]; then
            COMMENT_BODY="${{ github.event.comment.body }}"
            if [[ "$COMMENT_BODY" == *"@claude test"* ]]; then
              FOCUS="test"
            else
              FOCUS="verify"
            fi
          fi
          echo "focus=$FOCUS" >> $GITHUB_OUTPUT
          echo "QA focus: $FOCUS"

      - name: Get PR context
        if: steps.qa-mode.outputs.focus == 'verify'
        id: pr-context
        uses: actions/github-script@v9
        env:
          PR_NUMBER_INPUT: ${{ github.event.inputs.pr_number }}
          PR_NUMBER_COMMENT: ${{ steps.pr-metadata.outputs.number }}
          PR_TITLE_COMMENT: ${{ steps.pr-metadata.outputs.title }}
          PR_BODY_COMMENT: ${{ steps.pr-metadata.outputs.body }}
        with:
          script: |
            let prNumber, prBody, prTitle;

            if (context.eventName === 'pull_request') {
              prNumber = context.payload.pull_request.number;
              prBody = context.payload.pull_request.body || '';
              prTitle = context.payload.pull_request.title;
            } else if (context.eventName === 'issue_comment') {
              prNumber = parseInt(process.env.PR_NUMBER_COMMENT, 10);
              prBody = process.env.PR_BODY_COMMENT || '';
              prTitle = process.env.PR_TITLE_COMMENT || '';
            } else if (process.env.PR_NUMBER_INPUT) {
              prNumber = parseInt(process.env.PR_NUMBER_INPUT, 10);
              const { data: pr } = await github.rest.pulls.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: prNumber
              });
              prBody = pr.body || '';
              prTitle = pr.title;
            }

            // Fetch linked issues (closes #123, fixes #456)
            let linkedIssues = '';
            if (prBody) {
              const matches = prBody.match(/(?:closes|fixes|resolves)\s+#(\d+)/gi) || [];
              for (const match of matches) {
                const issueNum = match.match(/\d+/)[0];
                try {
                  const { data: issue } = await github.rest.issues.get({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    issue_number: parseInt(issueNum)
                  });
                  linkedIssues += `\n### Issue #${issueNum}: ${issue.title}\n${issue.body || ''}\n`;
                } catch (e) {}
              }
            }

            core.setOutput('pr_number', prNumber || '');
            core.setOutput('pr_title', prTitle || '');
            core.setOutput('pr_body', prBody || '');
            core.setOutput('linked_issues', linkedIssues);

      - name: Create QA test fixtures
        shell: bash
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq imagemagick

          mkdir -p .qa-sandbox

          convert -size 100x100 gradient:blue-cyan .qa-sandbox/valid-small.png
          convert -size 500x500 plasma:fractal .qa-sandbox/valid-medium.png
          convert -size 1000x1000 plasma:fractal .qa-sandbox/valid-large.png

          # Size boundaries as valid PNG files.
          convert -size 512x512 plasma:fractal \
            -define png:compression-level=0 \
            PNG32:.qa-sandbox/exactly-1mb.png
          convert -size 530x530 plasma:fractal \
            -define png:compression-level=0 \
            PNG32:.qa-sandbox/over-limit-1.1mb.png
          convert -size 1200x1200 plasma:fractal \
            -define png:compression-level=0 \
            PNG32:.qa-sandbox/way-over-5mb.png

          # Content-validation edge cases.
          touch .qa-sandbox/empty-0bytes.png
          head -c 1024 /dev/urandom > .qa-sandbox/corrupted.png
          convert -size 50x50 gradient:yellow-orange PNG:.qa-sandbox/wrong-extension.jpg
          convert -size 200x200 plasma:fractal .qa-sandbox/valid.jpg
          echo '<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100"><circle cx="50" cy="50" r="40" fill="blue"/></svg>' > .qa-sandbox/test.svg
          echo "This is not an image" > .qa-sandbox/fake-image.png

          echo "Created QA test fixtures:"
          ls -lah .qa-sandbox/
          file .qa-sandbox/exactly-1mb.png .qa-sandbox/over-limit-1.1mb.png .qa-sandbox/way-over-5mb.png .qa-sandbox/wrong-extension.jpg

      - name: Start development server
        shell: bash
        run: |
          pnpm dev --host 0.0.0.0 --port 5173 &
          DEV_PID=$!
          echo "DEV_PID=$DEV_PID" >> $GITHUB_ENV

          sleep 2
          if ! kill -0 "$DEV_PID" 2>/dev/null; then
            echo "Dev server failed to start"
            exit 1
          fi

          for i in {1..90}; do
            if curl -sf http://localhost:5173 | grep -qE '(id="app"|<title>)'; then
              echo "Dev server ready!"
              exit 0
            fi
            if ! kill -0 "$DEV_PID" 2>/dev/null; then
              echo "Dev server process died"
              exit 1
            fi
            sleep 1
          done
          echo "Dev server failed to start properly"
          exit 1

      - name: Load QA system prompt
        id: load-system-prompt
        shell: bash
        run: |
          {
            echo 'system_prompt<<SYSTEM_EOF'
            cat .claude/prompts/qa-system-prompt.md
            echo 'SYSTEM_EOF'
          } >> $GITHUB_OUTPUT

      - name: Load QA prompt
        id: load-prompt
        shell: bash
        env:
          PR_BODY_RAW: ${{ steps.pr-context.outputs.pr_body }}
          LINKED_ISSUES_RAW: ${{ steps.pr-context.outputs.linked_issues }}
        run: |
          TODAY=$(date +%Y-%m-%d)
          FOCUS="${{ steps.qa-mode.outputs.focus }}"

          if [ "$FOCUS" = "test" ]; then
            PROMPT_FILE=".claude/prompts/qa-browser-test.md"
          elif [ "$FOCUS" = "verify" ]; then
            PROMPT_FILE=".claude/prompts/qa-browser-verify.md"
            echo "max_turns=100" >> $GITHUB_OUTPUT
          else
            PROMPT_FILE=".claude/prompts/qa-browser-explore.md"
          fi

          {
            echo 'prompt<<PROMPT_EOF'

            TASK=$(cat "$PROMPT_FILE")
            TASK="${TASK//\{\{APP_URL\}\}/http://localhost:5173}"
            TASK="${TASK//\{\{DATE\}\}/$TODAY}"

            # For verify mode, inject PR context
            if [ "$FOCUS" = "verify" ]; then
              TASK="${TASK//\{\{PR_NUMBER\}\}/${{ steps.pr-context.outputs.pr_number }}}"
              TASK="${TASK//\{\{PR_TITLE\}\}/${{ steps.pr-context.outputs.pr_title }}}"
              TASK="${TASK//\{\{PR_BODY\}\}/$PR_BODY_RAW}"
              TASK="${TASK//\{\{LINKED_ISSUES\}\}/$LINKED_ISSUES_RAW}"
            fi

            echo "$TASK"

            echo 'PROMPT_EOF'
          } >> $GITHUB_OUTPUT

      - name: Load QA schema
        id: load-schema
        shell: bash
        run: |
          SCHEMA=$(cat .github/schemas/qa-report-schema.json | tr -d '\n' | sed "s/'/\\\\'/g")
          echo "schema=$SCHEMA" >> $GITHUB_OUTPUT

      - name: Run Claude QA (Browser mode)
        id: claude-qa
        continue-on-error: true
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          show_full_output: true
          display_report: true
          use_sticky_comment: true
          track_progress: ${{ github.event_name != 'workflow_dispatch' }}
          prompt: ${{ steps.load-prompt.outputs.prompt }}
          additional_permissions: |
            actions: read
          settings: |
            {
              "permissions": {
                "allow": [
                  "Bash(agent-browser *)",
                  "Bash(curl *)",
                  "Write(qa-report.md)",
                  "Read",
                  "Glob",
                  "Grep"
                ]
              }
            }
          claude_args: |
            --allowedTools "Bash(agent-browser *),Bash(curl *),Write(qa-report.md),Read,Glob,Grep"
            --max-turns ${{ steps.load-prompt.outputs.max_turns || '15' }}
            --json-schema '${{ steps.load-schema.outputs.schema }}'
            --append-system-prompt "${{ steps.load-system-prompt.outputs.system_prompt }}"

      - name: Check report exists
        id: check-report
        if: always()
        shell: bash
        run: |
          if [ -f "qa-report.md" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      # Retry with a quick smoke test if main run failed to generate a report
      - name: Retry if no report generated
        id: claude-qa-retry
        if: steps.check-report.outputs.exists == 'false'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          show_full_output: true
          display_report: true
          use_sticky_comment: true
          track_progress: ${{ github.event_name != 'workflow_dispatch' }}
          prompt: |
            IMPORTANT: The previous QA run did not generate a report.

            Do a quick navigation smoke test and write qa-report.md immediately:
            1. Open http://localhost:5173 with agent-browser
            2. Dismiss onboarding (click "Skip to App")
            3. Check 3-4 main pages load correctly
            4. Write the report with what you observed

            Write `qa-report.md` now with:
            - Summary of pages tested
            - Any errors found
            - Verdict: HEALTHY / MINOR_ISSUES / CRITICAL_BUGS
          settings: |
            {
              "permissions": {
                "allow": [
                  "Bash(agent-browser *)",
                  "Bash(curl *)",
                  "Write(qa-report.md)",
                  "Read",
                  "Glob",
                  "Grep"
                ]
              }
            }
          claude_args: |
            --allowedTools "Bash(agent-browser *),Bash(curl *),Write(qa-report.md),Read,Glob,Grep"
            --max-turns 15
            --json-schema '${{ steps.load-schema.outputs.schema }}'
            --append-system-prompt "${{ steps.load-system-prompt.outputs.system_prompt }}"

      - name: Verify report after retry
        id: check-report-retry
        if: steps.check-report.outputs.exists == 'false'
        shell: bash
        run: |
          if [ -f "qa-report.md" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Set commit status
        id: qa-status
        if: always()
        uses: actions/github-script@v9
        env:
          STRUCTURED_OUTPUT: ${{ steps.claude-qa.outputs.structured_output || steps.claude-qa-retry.outputs.structured_output }}
        with:
          script: |
            const fs = require('fs');
            let state = 'success';
            let description = 'QA passed';

            const structuredOutput = process.env.STRUCTURED_OUTPUT;
            if (structuredOutput && structuredOutput.trim()) {
              try {
                const data = JSON.parse(structuredOutput);

                if (data.verdict === 'CRITICAL_BUGS' || data.metrics.critical_bugs > 0) {
                  state = 'failure';
                  description = `QA found ${data.metrics.critical_bugs} critical bug(s)`;
                } else if (data.verdict === 'MINOR_ISSUES' || data.metrics.major_bugs > 0) {
                  state = 'pending';
                  const issueCount = (data.metrics.minor_bugs || 0) + (data.metrics.major_bugs || 0);
                  description = `QA found ${issueCount} issue(s) to review`;
                } else {
                  state = 'success';
                  description = `QA passed (${data.metrics.passed}/${data.metrics.total_tests} tests)`;
                }

                core.setOutput('metrics', JSON.stringify(data.metrics));
                core.setOutput('verdict', data.verdict);
              } catch (parseErr) {
                core.warning(`Failed to parse structured output: ${parseErr.message}`);
              }
            } else {
              try {
                const report = fs.readFileSync('qa-report.md', 'utf8');
                if (/CRITICAL/i.test(report)) {
                  state = 'failure';
                  description = 'QA found critical issues';
                } else if (/MINOR/i.test(report) || report.includes('WARNING')) {
                  state = 'pending';
                  description = 'QA found minor issues';
                }
              } catch (e) {
                state = 'error';
                description = 'QA report not generated';
              }
            }

            // Use PR head sha for issue_comment, otherwise use context.sha
            const sha = '${{ steps.pr-metadata.outputs.ref }}' || context.sha;

            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: sha,
              state: state,
              context: 'Claude QA (Browser)',
              description: description,
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            });

            core.setOutput('qa_state', state);

      - name: Upload QA artifacts
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: qa-browser-artifacts-${{ github.run_id }}
          path: |
            qa-report.md
          if-no-files-found: ignore

      - name: Remove trigger label
        if: |
          github.event_name == 'pull_request' &&
          github.event.label.name == 'qa-verify'
        uses: actions/github-script@v9
        env:
          LABEL_NAME: ${{ github.event.label.name }}
        with:
          script: |
            try {
              await github.rest.issues.removeLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.pull_request.number,
                name: process.env.LABEL_NAME
              });
            } catch (e) {
              if (e.status !== 404) core.warning(`Failed to remove label: ${e.message}`);
            }

      - name: Cleanup
        if: always()
        shell: bash
        run: |
          kill $DEV_PID 2>/dev/null || true
          agent-browser close 2>/dev/null || true

      - name: Fail job if QA found issues
        if: steps.qa-status.outputs.qa_state == 'failure'
        shell: bash
        run: |
          echo "❌ QA found critical issues - failing the pipeline"
          exit 1
