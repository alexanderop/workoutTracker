# Trigger chain: the expensive path (green CI) -> browser QA -> QA follow-up
# used to be two independently-triggered workflows racing each other (this
# one ran straight off `pull_request`, so it could -- and often did -- spend
# 20 minutes QAing a branch whose CI hadn't even passed yet). Now:
#   - `workflow_run` on CI success is the normal path for every PR push;
#     `pull_request` only remains for the `qa-verify` label escalation lever.
#   - `issue_comment` (@claude verify/test) and `workflow_dispatch` are
#     unchanged manual escape hatches.
# CI deliberately runs for every PR so its required check is always present.
# The "Check for UI-relevant changes" step below adds a cheaper admission filter
# before any of the expensive steps (fixtures, dev server, agent-browser,
# Claude) run.
name: Claude QA (Browser)

on:
  workflow_dispatch:
    inputs:
      focus:
        description: 'Test focus area'
        type: choice
        options:
          - fast
          - general
          - test
          - verify
          - navigation
          - forms
          - workout-flow
        default: 'fast'
      pr_number:
        description: 'PR number (for posting results)'
        required: false
        type: string
  pull_request:
    # Only the `qa-verify` label escalation remains here; the normal PR path
    # moved to `workflow_run` below so QA only runs once CI is green.
    types: [labeled]
    paths-ignore:
      - '*.md'
      - 'brain/reference/**'
      - '.github/workflows/release.yml'
  # Both the associated PR and its head repository are checked below. This is
  # a privileged workflow_run path, so never check out fork-controlled code.
  # NOTE: workflow_run only fires once this file is on the default branch,
  # same caveat as claude-qa-followup.yml.
  workflow_run: # zizmor: ignore[dangerous-triggers]
    workflows: ['CI']
    types: [completed]
    # Main-branch CI completions can never carry a PR, so they were always
    # rejected by the admission job — filtering them here removes the
    # skipped-run noise from the Actions list without changing behavior.
    branches-ignore:
      - main
  issue_comment:
    types: [created]

permissions: {}

jobs:
  qa-admission:
    name: Decide whether browser QA is worth running
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       github.event.label.name == 'qa-verify') ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.pull_requests[0] &&
       github.event.workflow_run.head_repository.full_name == github.repository &&
       !startsWith(github.event.workflow_run.head_branch, 'claude-auto-fix-')) ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request &&
       contains(fromJson('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association) &&
       (contains(github.event.comment.body, '@claude verify') || contains(github.event.comment.body, '@claude test')))
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions:
      contents: read
      pull-requests: read
    outputs:
      decision: ${{ steps.admission.outputs.decision }}
      should-run: ${{ steps.admission.outputs.should_run }}
    steps:
      - name: Score browser QA value
        id: admission
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          INPUT_PR_NUMBER: ${{ inputs.pr_number }}
        with:
          script: |
            const eventName = context.eventName;
            const manual = eventName === 'workflow_dispatch' ||
              eventName === 'issue_comment' || eventName === 'pull_request';
            const prNumber = context.payload.pull_request?.number ||
              context.payload.workflow_run?.pull_requests?.[0]?.number ||
              context.payload.issue?.number ||
              Number.parseInt(process.env.INPUT_PR_NUMBER || '', 10) || null;
            const finish = (decision, reason) => {
              core.setOutput('decision', decision);
              core.setOutput('should_run', String(decision !== 'skip'));
              core.notice(`Browser QA admission: ${decision} — ${reason}`);
            };
            if (!prNumber) {
              finish(manual ? 'required' : 'skip', 'No PR diff is available');
              return;
            }
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner, repo: context.repo.repo,
              pull_number: prNumber,
            });
            if (pr.head.repo?.full_name !== `${context.repo.owner}/${context.repo.repo}`) {
              finish('skip', 'Fork PRs cannot run privileged browser QA');
              return;
            }
            if (eventName === 'workflow_run' &&
                pr.head.sha !== context.payload.workflow_run.head_sha) {
              finish('skip', 'PR advanced after this CI run');
              return;
            }
            if (manual) {
              finish('required', 'Manual trigger overrides automatic admission');
              return;
            }
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner, repo: context.repo.repo,
              pull_number: prNumber, per_page: 100,
            });
            const paths = files.map(file => file.filename);
            const runtime = paths.filter(path =>
              !/(^|\/)(__tests__|test|tests|fixtures|__snapshots__)(\/|$)/.test(path) &&
              !/\.(spec|test)\.[cm]?[jt]sx?$/.test(path) &&
              !/(^|\/)brain\//.test(path) && !/\.md$/.test(path) &&
              !/^(scripts\/|\.github\/|\.husky\/)/.test(path) &&
              !/^src\/types\//.test(path) && !/\.d\.ts$/.test(path),
            );
            if (runtime.length === 0) {
              finish('skip', 'Only tests, docs, tooling, or type-only files changed');
              return;
            }
            // Mirror prepare-app's served-app filter: runtime files that can't
            // reach the built bundle (e.g. root-level lint/config files) would
            // otherwise spin up all three QA jobs just to emit QA_SKIPPED.
            const uiRelevant = runtime.some(path =>
              /^(src\/|public\/|index\.html|vite\.config|package\.json|pnpm-lock\.yaml|pnpm-workspace\.yaml)/.test(path),
            );
            if (!uiRelevant) {
              finish('skip', 'Runtime-adjacent files changed, but none reach the served app bundle');
              return;
            }
            const highRisk = runtime.some(path =>
              /^src\/(db|stores|views)\//.test(path) ||
              /^src\/features\/(workout|timers|onboarding)\//.test(path) ||
              /(schema|migration|repository|router|route|wake-?lock|rest-?timer)/i.test(path) ||
              /^(package\.json|pnpm-lock\.yaml|pnpm-workspace\.yaml)/.test(path),
            );
            const visible = runtime.some(path => /\.vue$/.test(path) || /\.(css|scss)$/.test(path));
            finish(highRisk ? 'full' : visible ? 'verify' : 'fast',
              highRisk ? 'Critical flow or dependency changed' :
                visible ? 'User-visible UI changed' : 'Runtime code changed');

  prepare-app:
    name: Build untrusted PR app without secrets
    needs: qa-admission
    if: needs.qa-admission.outputs.should-run == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
    outputs:
      head-sha: ${{ steps.context.outputs.head_sha }}
      pr-number: ${{ steps.context.outputs.pr_number }}
      ui-changed: ${{ steps.context.outputs.ui_changed }}
    steps:
      - name: Resolve exact PR revision
        id: context
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number || github.event.workflow_run.pull_requests[0].number }}
          EVENT_SHA: ${{ github.event.pull_request.head.sha || github.event.workflow_run.head_sha || github.sha }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_PR_NUMBER: ${{ inputs.pr_number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          PR_NUMBER="${EVENT_PR_NUMBER:-$INPUT_PR_NUMBER}"
          HEAD_SHA="$EVENT_SHA"
          UI_CHANGED=true
          if [ -n "$PR_NUMBER" ]; then
            [[ "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]]
            PR_JSON=$(gh api "repos/${REPO}/pulls/${PR_NUMBER}")
            test "$(jq -r '.state' <<<"$PR_JSON")" = open
            test "$(jq -r '.head.repo.full_name' <<<"$PR_JSON")" = "$REPO"
            LIVE_HEAD_SHA=$(jq -r '.head.sha' <<<"$PR_JSON")
            if [ "$EVENT_NAME" = workflow_run ]; then
              test "$LIVE_HEAD_SHA" = "$HEAD_SHA"
            else
              HEAD_SHA="$LIVE_HEAD_SHA"
            fi
            CHANGED=$(gh api --paginate "repos/${REPO}/pulls/${PR_NUMBER}/files?per_page=100" --jq '.[].filename')
            # Keep this pattern in sync with the `uiRelevant` filter in the
            # qa-admission job above.
            if ! grep -qE '^(src/|public/|index\.html|vite\.config|package\.json|pnpm-lock\.yaml|pnpm-workspace\.yaml)' <<<"$CHANGED"; then
              UI_CHANGED=false
            fi
          fi
          [[ "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]
          {
            echo "head_sha=$HEAD_SHA"
            echo "pr_number=$PR_NUMBER"
            echo "ui_changed=$UI_CHANGED"
          } >> "$GITHUB_OUTPUT"
      - name: Checkout exact PR revision without credentials
        if: steps.context.outputs.ui_changed == 'true'
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6
        with:
          ref: ${{ steps.context.outputs.head_sha }}
          persist-credentials: false
      - name: Setup pnpm
        if: steps.context.outputs.ui_changed == 'true'
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
      - name: Setup Node
        if: steps.context.outputs.ui_changed == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: pnpm
      - name: Install without lifecycle scripts and build
        if: steps.context.outputs.ui_changed == 'true'
        run: |
          pnpm install --frozen-lockfile --prefer-offline --ignore-scripts
          pnpm build-only
      - name: Upload static app
        if: steps.context.outputs.ui_changed == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: qa-static-app-${{ github.run_id }}
          path: dist
          if-no-files-found: error

  qa-browser:
    needs: [qa-admission, prepare-app]
    outputs:
      pr-number: ${{ steps.pr-context.outputs.pr_number || steps.pr-metadata.outputs.number || github.event.pull_request.number || github.event.inputs.pr_number || github.event.workflow_run.pull_requests[0].number }}
      report-ready: ${{ steps.final-report.outputs.ready }}
      tested-head-sha: ${{ needs.prepare-app.outputs.head-sha }}
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       github.event.label.name == 'qa-verify') ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.pull_requests[0] &&
       github.event.workflow_run.head_repository.full_name == github.repository &&
       !startsWith(github.event.workflow_run.head_branch, 'claude-auto-fix-')) ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request &&
       contains(fromJson('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association) &&
       (contains(github.event.comment.body, '@claude verify') || contains(github.event.comment.body, '@claude test')))

    runs-on: ubuntu-24.04
    timeout-minutes: 60

    concurrency:
      group: claude-qa-browser-${{ github.event.pull_request.number || github.event.issue.number || github.event.workflow_run.pull_requests[0].number || github.ref }}
      cancel-in-progress: true

    permissions:
      contents: read
      id-token: write
      actions: read
      pull-requests: read

    env:
      NODE_VERSION: '22'
      CLAUDE_MODEL: claude-sonnet-5
      APP_URL: http://localhost:5173
      AGENT_BROWSER_INIT_SCRIPTS: .claude/scripts/qa-mobile-emulation.js

    steps:
      - name: Get PR metadata for comment or dispatch
        if: github.event_name == 'issue_comment' || (github.event_name == 'workflow_dispatch' && github.event.inputs.pr_number != '')
        id: pr-metadata
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          INPUT_PR_NUMBER: ${{ github.event.inputs.pr_number }}
        with:
          script: |
            const requestedNumber = context.eventName === 'workflow_dispatch'
              ? Number.parseInt(process.env.INPUT_PR_NUMBER, 10)
              : context.payload.issue.number;
            if (!Number.isSafeInteger(requestedNumber) || requestedNumber <= 0) {
              core.setFailed('A valid positive PR number is required.');
              return;
            }
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: requestedNumber
            });
            if (pr.state !== 'open') {
              core.setFailed(`PR #${requestedNumber} is not open.`);
              return;
            }
            core.setOutput('ref', pr.head.sha);
            core.setOutput('number', String(pr.number));
            core.setOutput('title', pr.title || '');
            core.setOutput('body', pr.body || '');
            core.setOutput('is_fork', String(pr.head.repo.full_name !== `${context.repo.owner}/${context.repo.repo}`));

      - name: Block fork PR QA on comment or dispatch trigger
        if: (github.event_name == 'issue_comment' || github.event_name == 'workflow_dispatch') && steps.pr-metadata.outputs.is_fork == 'true'
        shell: bash
        run: |
          echo "Refusing to run browser QA against fork PR code from a comment trigger."
          exit 1

      - name: Checkout trusted default-branch orchestration
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Setup test environment
        uses: ./.github/actions/setup-test-env
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Determine QA mode
        id: qa-mode
        shell: bash
        env:
          ADMISSION_DECISION: ${{ needs.qa-admission.outputs.decision }}
          COMMENT_BODY_INPUT: ${{ github.event.comment.body || '' }}
          FOCUS_INPUT: ${{ github.event.inputs.focus || 'fast' }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_ACTION: ${{ github.event.action }}
          LABEL_NAME: ${{ github.event.label.name }}
        run: |
          set -euo pipefail
          FOCUS="$FOCUS_INPUT"
          if [[ "$EVENT_NAME" == "workflow_run" ]]; then
            FOCUS="$ADMISSION_DECISION"
          elif [[ "$LABEL_NAME" == "qa-verify" ]]; then
            FOCUS="verify"
          elif [[ "$EVENT_NAME" == "issue_comment" ]]; then
            COMMENT_BODY="${COMMENT_BODY_INPUT}"
            if [[ "$COMMENT_BODY" == *"@claude test"* ]]; then
              FOCUS="test"
            else
              FOCUS="verify"
            fi
          fi
          echo "focus=$FOCUS" >> "$GITHUB_OUTPUT"
          echo "QA focus: $FOCUS"

      - name: Get PR context
        if: steps.qa-mode.outputs.focus == 'verify' || steps.qa-mode.outputs.focus == 'fast' || steps.qa-mode.outputs.focus == 'full'
        id: pr-context
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          PR_NUMBER_INPUT: ${{ github.event.inputs.pr_number }}
          PR_NUMBER_COMMENT: ${{ steps.pr-metadata.outputs.number }}
          PR_TITLE_COMMENT: ${{ steps.pr-metadata.outputs.title }}
          PR_BODY_COMMENT: ${{ steps.pr-metadata.outputs.body }}
          PR_NUMBER_WORKFLOW_RUN: ${{ github.event.workflow_run.pull_requests[0].number }}
        with:
          script: |
            const path = require('node:path');
            const { pathToFileURL } = require('node:url');
            const policyUrl = pathToFileURL(path.join(
              process.env.GITHUB_WORKSPACE,
              'scripts/qa-workflow-policy.mjs',
            )).href;
            const {
              extractMarkdownSection,
              hasMeaningfulTemplateContent,
            } = await import(policyUrl);
            let prNumber, prBody, prTitle;

            if (context.eventName === 'pull_request') {
              prNumber = context.payload.pull_request.number;
              prBody = context.payload.pull_request.body || '';
              prTitle = context.payload.pull_request.title;
            } else if (context.eventName === 'issue_comment') {
              prNumber = parseInt(process.env.PR_NUMBER_COMMENT, 10);
              prBody = process.env.PR_BODY_COMMENT || '';
              prTitle = process.env.PR_TITLE_COMMENT || '';
            } else if (context.eventName === 'workflow_run') {
              prNumber = parseInt(process.env.PR_NUMBER_WORKFLOW_RUN, 10);
              const { data: pr } = await github.rest.pulls.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: prNumber
              });
              prBody = pr.body || '';
              prTitle = pr.title;
            } else if (process.env.PR_NUMBER_INPUT) {
              prNumber = parseInt(process.env.PR_NUMBER_INPUT, 10);
              const { data: pr } = await github.rest.pulls.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: prNumber
              });
              prBody = pr.body || '';
              prTitle = pr.title;
            }

            // Fetch linked issues (closes #123, fixes #456)
            let linkedIssues = '';
            if (prBody) {
              const matches = prBody.match(/(?:closes|fixes|resolves)\s+#(\d+)/gi) || [];
              for (const match of matches) {
                const issueNum = match.match(/\d+/)[0];
                try {
                  const { data: issue } = await github.rest.issues.get({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    issue_number: parseInt(issueNum)
                  });
                  linkedIssues += `\n### Issue #${issueNum}: ${issue.title}\n${issue.body || ''}\n`;
                } catch (e) {}
              }
            }

            const summary = extractMarkdownSection(prBody, 'Summary');
            const userImpact = extractMarkdownSection(prBody, 'User Impact');
            const acceptanceCriteria = extractMarkdownSection(prBody, 'Acceptance Criteria');
            const qaScope = extractMarkdownSection(prBody, 'QA Scope');
            const riskAreas = extractMarkdownSection(prBody, 'Risk Areas');
            const manualTestScenarios = extractMarkdownSection(prBody, 'Manual Test Scenarios');

            const missingSections = [];
            if (!hasMeaningfulTemplateContent(acceptanceCriteria)) missingSections.push('Acceptance Criteria');
            if (!hasMeaningfulTemplateContent(qaScope)) missingSections.push('QA Scope');
            if (!hasMeaningfulTemplateContent(riskAreas)) missingSections.push('Risk Areas');

            core.setOutput('pr_number', prNumber || '');
            core.setOutput('pr_title', prTitle || '');
            core.setOutput('pr_body', prBody || '');
            core.setOutput('linked_issues', linkedIssues);
            core.setOutput('pr_summary', summary || '');
            core.setOutput('user_impact', userImpact || '');
            core.setOutput('acceptance_criteria', acceptanceCriteria || '');
            core.setOutput('qa_scope', qaScope || '');
            core.setOutput('risk_areas', riskAreas || '');
            core.setOutput('manual_test_scenarios', manualTestScenarios || '');
            core.setOutput('contract_valid', String(missingSections.length === 0));
            core.setOutput('missing_sections', missingSections.join(', ') || 'None');

      - name: Check for UI-relevant changes
        # Only meaningful once we have a PR number (verify/fast focus); the
        # explore-mode dispatch inputs (general/test/navigation/forms/
        # workout-flow) intentionally have no PR to diff against, so this
        # step is skipped and downstream steps treat the unset output as
        # "not false" -- i.e. proceed. CI runs for every PR so its required
        # check is stable; this is the admission filter that keeps docs-only,
        # scripts-only, and workflow-only changes out of expensive browser QA.
        id: ui-changed
        if: steps.pr-context.outputs.pr_number != ''
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.pr-context.outputs.pr_number }}
        run: |
          set -euo pipefail
          echo "ui_changed=${{ needs.prepare-app.outputs.ui-changed }}" >> "$GITHUB_OUTPUT"

      - name: Setup agent-browser
        if: steps.ui-changed.outputs.ui_changed != 'false'
        uses: ./.github/actions/setup-agent-browser

      - name: Download isolated static PR app
        if: steps.ui-changed.outputs.ui_changed != 'false'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: qa-static-app-${{ github.run_id }}
          path: dist

      - name: Start static server
        if: steps.ui-changed.outputs.ui_changed != 'false'
        shell: bash
        # The router uses HTML5 history mode, so a plain static server 404s on
        # any reload of a non-root route (/workouts, /settings, ...) — and the
        # QA prompts explicitly tell the agent to reload mid-flow. Serve
        # index.html for unknown paths like a real SPA host would.
        run: |
          cat > /tmp/spa-server.py <<'PY'
          import functools
          import http.server
          import os

          class SpaHandler(http.server.SimpleHTTPRequestHandler):
              def send_head(self):
                  path = self.translate_path(self.path)
                  if not os.path.exists(path):
                      self.path = '/index.html'
                  return super().send_head()

          http.server.ThreadingHTTPServer(
              ('127.0.0.1', 5173),
              functools.partial(SpaHandler, directory='dist'),
          ).serve_forever()
          PY
          python3 /tmp/spa-server.py > /tmp/dev-server.log 2>&1 &
          echo "DEV_PID=$!" >> "$GITHUB_ENV"

      # NOTE: the QA system prompt is injected into the file-based `prompt`
      # input instead of `--append-system-prompt` in claude_args. The file
      # contains double quotes and backticks, which break claude_args
      # tokenization and hang the CLI at startup with no output.
      - name: Load QA prompt
        id: load-prompt
        shell: bash
        env:
          PR_BODY_RAW: ${{ steps.pr-context.outputs.pr_body }}
          LINKED_ISSUES_RAW: ${{ steps.pr-context.outputs.linked_issues }}
          APP_URL_VALUE: ${{ env.APP_URL }}
          PR_NUMBER_VALUE: ${{ steps.pr-context.outputs.pr_number }}
          PR_TITLE_VALUE: ${{ steps.pr-context.outputs.pr_title }}
          PR_SUMMARY_VALUE: ${{ steps.pr-context.outputs.pr_summary }}
          USER_IMPACT_VALUE: ${{ steps.pr-context.outputs.user_impact }}
          ACCEPTANCE_CRITERIA_VALUE: ${{ steps.pr-context.outputs.acceptance_criteria }}
          QA_SCOPE_VALUE: ${{ steps.pr-context.outputs.qa_scope }}
          RISK_AREAS_VALUE: ${{ steps.pr-context.outputs.risk_areas }}
          MANUAL_TEST_SCENARIOS_VALUE: ${{ steps.pr-context.outputs.manual_test_scenarios }}
          CONTRACT_VALID_VALUE: ${{ steps.pr-context.outputs.contract_valid }}
          MISSING_SECTIONS_VALUE: ${{ steps.pr-context.outputs.missing_sections }}
        run: |
          set -euo pipefail
          TODAY=$(date +%Y-%m-%d)
          FOCUS="${{ steps.qa-mode.outputs.focus }}"

          if [ "$FOCUS" = "fast" ]; then
            PROMPT_FILE=".claude/prompts/qa-browser-fast.md"
            echo "max_turns=100" >> "$GITHUB_OUTPUT"
          elif [ "$FOCUS" = "test" ]; then
            PROMPT_FILE=".claude/prompts/qa-browser-test.md"
            echo "max_turns=80" >> "$GITHUB_OUTPUT"
          elif [ "$FOCUS" = "verify" ] || [ "$FOCUS" = "full" ]; then
            # `full` is the highest-risk admission decision (db/stores/workout/
            # deps changed); it deliberately shares the deep PR-aware verify
            # prompt — previously it fell through to the generic smoke-test
            # prompt with no PR context at all. The verify prompt's own phase
            # plan budgets 100 turns, so the CLI cap must match.
            PROMPT_FILE=".claude/prompts/qa-browser-verify.md"
            echo "max_turns=100" >> "$GITHUB_OUTPUT"
          else
            PROMPT_FILE=".claude/prompts/qa-browser-explore.md"
            echo "max_turns=80" >> "$GITHUB_OUTPUT"
          fi

          # A static heredoc delimiter would let attacker-influenced prompt
          # content (PR bodies, linked-issue bodies) terminate the heredoc
          # early and inject arbitrary step outputs (e.g. a fake max_turns
          # spliced into claude_args). A per-run random delimiter makes the
          # terminator unguessable.
          DELIM="PROMPT_EOF_$(openssl rand -hex 16)"
          {
            echo "prompt<<${DELIM}"

            cat .claude/prompts/qa-system-prompt.md
            echo ''
            echo '---'
            echo ''

            TASK=$(cat "$PROMPT_FILE")
            TASK="${TASK//\{\{APP_URL\}\}/$APP_URL_VALUE}"
            TASK="${TASK//\{\{DATE\}\}/$TODAY}"

            # For PR-aware modes, inject structured PR context
            if [ "$FOCUS" = "verify" ] || [ "$FOCUS" = "fast" ] || [ "$FOCUS" = "full" ]; then
              TASK="${TASK//\{\{PR_NUMBER\}\}/$PR_NUMBER_VALUE}"
              TASK="${TASK//\{\{PR_TITLE\}\}/$PR_TITLE_VALUE}"
              TASK="${TASK//\{\{PR_BODY\}\}/$PR_BODY_RAW}"
              TASK="${TASK//\{\{LINKED_ISSUES\}\}/$LINKED_ISSUES_RAW}"
              TASK="${TASK//\{\{PR_SUMMARY\}\}/$PR_SUMMARY_VALUE}"
              TASK="${TASK//\{\{USER_IMPACT\}\}/$USER_IMPACT_VALUE}"
              TASK="${TASK//\{\{ACCEPTANCE_CRITERIA\}\}/$ACCEPTANCE_CRITERIA_VALUE}"
              TASK="${TASK//\{\{QA_SCOPE\}\}/$QA_SCOPE_VALUE}"
              TASK="${TASK//\{\{RISK_AREAS\}\}/$RISK_AREAS_VALUE}"
              TASK="${TASK//\{\{MANUAL_TEST_SCENARIOS\}\}/$MANUAL_TEST_SCENARIOS_VALUE}"
              TASK="${TASK//\{\{CONTRACT_VALID\}\}/$CONTRACT_VALID_VALUE}"
              TASK="${TASK//\{\{MISSING_SECTIONS\}\}/$MISSING_SECTIONS_VALUE}"
            fi

            echo "$TASK"

            echo "$DELIM"
          } >> "$GITHUB_OUTPUT"

      - name: Validate prompt-derived outputs
        shell: bash
        env:
          MAX_TURNS: ${{ steps.load-prompt.outputs.max_turns }}
        run: |
          set -euo pipefail
          # Defense in depth for the claude_args splice below: max_turns must
          # be a plain integer no matter what ended up in step outputs.
          [[ "$MAX_TURNS" =~ ^[0-9]{1,3}$ ]] || {
            echo "::error::max_turns is not a plain integer: $MAX_TURNS"
            exit 1
          }

      - name: Load QA schema
        id: load-schema
        shell: bash
        run: |
          set -euo pipefail
          # The schema is embedded single-quoted in claude_args; a single quote
          # in the file breaks tokenization and hangs the CLI at startup
          # (escaping as \' does NOT survive claude_args parsing).
          if grep -q "'" .github/schemas/qa-report-schema.json; then
            echo "::error::qa-report-schema.json must not contain single quotes"
            exit 1
          fi
          SCHEMA=$(jq -c . .github/schemas/qa-report-schema.json)
          echo "schema=$SCHEMA" >> "$GITHUB_OUTPUT"

      - name: Remove stale fixture outputs
        shell: bash
        run: |
          rm -f qa-report.md qa-structured-output.json
          rm -rf qa-screenshots
          mkdir -p qa-screenshots

      - name: Dev server health check
        if: steps.ui-changed.outputs.ui_changed != 'false'
        shell: bash
        run: |
          set -euo pipefail
          echo "Verifying dev server at ${{ env.APP_URL }}..."
          if ! curl -fsS --max-time 10 "${{ env.APP_URL }}" > /dev/null; then
            echo "::error::Dev server is not reachable at ${{ env.APP_URL }}"
            echo "--- dev-server.log (last 50 lines) ---"
            tail -50 /tmp/dev-server.log 2>/dev/null || echo "(no dev-server.log)"
            exit 1
          fi
          echo "Dev server is reachable."

      - name: Warm-up smoke check (agent-browser + onboarding)
        if: steps.ui-changed.outputs.ui_changed != 'false'
        shell: bash
        run: |
          set -euo pipefail
          echo "--- agent-browser open ---"
          agent-browser open "${{ env.APP_URL }}"
          echo "--- enabling mobile-first QA device (iPhone 14) ---"
          agent-browser set device "iPhone 14"
          echo "--- clearing storage to force fresh onboarding state ---"
          agent-browser storage local clear || true
          agent-browser reload || true
          echo "--- verifying mobile touch profile ---"
          MOBILE_READY=$(agent-browser eval "matchMedia('(pointer: coarse)').matches && navigator.maxTouchPoints > 0 && 'ontouchstart' in window" | tr -d '[:space:]')
          if [ "$MOBILE_READY" != "true" ]; then
            echo "::error::Mobile touch profile was not established before browser QA"
            exit 1
          fi
          echo "--- initial snapshot ---"
          SNAPSHOT=$(agent-browser snapshot -i -c)
          echo "$SNAPSHOT"
          if ! echo "$SNAPSHOT" | grep -qE 'Skip to App|button "Home"'; then
            echo "::error::App did not render — neither onboarding nor main nav visible"
            exit 1
          fi
          if echo "$SNAPSHOT" | grep -q "Skip to App"; then
            echo "Warm-up passed: onboarding carousel visible (fresh state)."
          else
            echo "Warm-up passed: main nav visible (onboarding already dismissed — localStorage clear may have failed)."
          fi

      - name: Check Claude action compatibility
        id: claude-action-guard
        shell: bash
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          UI_CHANGED: ${{ steps.ui-changed.outputs.ui_changed }}
        run: |
          set -euo pipefail
          # Reuse the same can_run/reason gate the workflow-file-mismatch
          # check below relies on, so the "Check report exists" step below
          # produces its normal QA_SKIPPED report without extra plumbing.
          cp scripts/qa-workflow-policy.mjs /tmp/qa-workflow-policy.mjs

          if [ "$UI_CHANGED" = "false" ]; then
            {
              echo "can_run=false"
              echo "reason=No changed file under src/, index.html, vite.config, package.json, or pnpm-lock.yaml — skipping browser QA."
            } >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping Claude action because the PR has no UI-relevant changes."
            exit 0
          fi

          echo "can_run=true" >> "$GITHUB_OUTPUT"
          echo "reason=" >> "$GITHUB_OUTPUT"

      - name: Smoke-test claude-code-action (trivial prompt)
        if: steps.claude-action-guard.outputs.can_run == 'true'
        id: claude-smoke
        timeout-minutes: 3
        uses: anthropics/claude-code-action@b47fd721da662d48c5680e154ad16a73ed74d2e0 # v1.0.93
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # workflow_run QA is triggered by whoever pushed the PR branch;
          # without this, dependabot PRs burn the full setup (~11 min) and then
          # hard-fail with "Workflow initiated by non-human actor".
          allowed_bots: dependabot,github-actions
          track_progress: false
          prompt: |
            Write the exact text `claude-smoke-ok` to a file named `claude-smoke.txt` using the Write tool, then stop. Do nothing else.
          claude_args: |
            --allowedTools "Write"
            --max-turns 3
            --model ${{ env.CLAUDE_MODEL }}

      - name: Verify claude-code-action smoke output
        if: steps.claude-action-guard.outputs.can_run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f claude-smoke.txt ]; then
            echo "::error::claude-code-action smoke test failed: claude-smoke.txt was not created"
            exit 1
          fi
          if ! grep -q "claude-smoke-ok" claude-smoke.txt; then
            echo "::error::claude-code-action smoke test failed: claude-smoke.txt has unexpected content"
            cat claude-smoke.txt
            exit 1
          fi
          echo "claude-code-action smoke test passed."
          rm -f claude-smoke.txt

      - name: Start claude tool-call tailer
        if: steps.claude-action-guard.outputs.can_run == 'true'
        shell: bash
        # TAILER_OUT/TAILER_PID are a fixed /tmp path and this shell's own
        # background-job PID -- neither is attacker-controlled, and both are
        # only ever read back via plain shell ($TAILER_OUT/$TAILER_PID), never
        # spliced into a `${{ }}` expression, so the write can't be abused for
        # code injection. This only became reachable by the github-env audit
        # once claude-qa-browser.yml gained a workflow_run trigger (see the
        # `on:` block above).
        run: | # zizmor: ignore[github-env]
          OUT=/tmp/claude-tailer.log
          : > "$OUT"
          echo "TAILER_OUT=$OUT" >> "$GITHUB_ENV"
          # Delete leftover execution log from smoke test so we don't re-read it
          rm -f /home/runner/work/_temp/claude-execution-output.json /tmp/claude-execution-output.json
          (
            LAST=0
            while :; do
              # Try both known paths - whichever the action writes to
              for LOG in /home/runner/work/_temp/claude-execution-output.json /tmp/claude-execution-output.json; do
                if [ -f "$LOG" ]; then
                  TOTAL=$(jq -r 'if type=="array" then length else 1 end' "$LOG" 2>/dev/null || echo 0)
                  if [ "$TOTAL" -gt "$LAST" ]; then
                    jq -r --argjson start "$LAST" '
                      (if type=="array" then . else [.] end)[$start:]
                      | map(select(.type == "assistant") | .message.content[]? | select(.type == "tool_use"))
                      | map("[\(now | strftime("%H:%M:%S"))] \(.name): " + ((.input.command // .input.description // (.input | tostring))[:200] | gsub("\n"; " ")))
                      | .[]
                    ' "$LOG" 2>/dev/null >> "$OUT" || true
                    LAST=$TOTAL
                  fi
                  break
                fi
              done
              sleep 10
            done
          ) &
          echo "TAILER_PID=$!" >> "$GITHUB_ENV"
          disown

      - name: Run Claude QA (Browser mode)
        if: steps.claude-action-guard.outputs.can_run == 'true'
        id: claude-qa
        timeout-minutes: 20
        continue-on-error: true
        uses: anthropics/claude-code-action@b47fd721da662d48c5680e154ad16a73ed74d2e0 # v1.0.93
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          allowed_bots: dependabot,github-actions
          show_full_output: true
          display_report: true
          use_sticky_comment: true
          track_progress: ${{ github.event_name == 'pull_request' && github.event.action != 'labeled' }}
          prompt: ${{ steps.load-prompt.outputs.prompt }}
          additional_permissions: |
            actions: read
          claude_args: |
            --allowedTools "Bash(agent-browser:*),Edit(qa-report.md),Write(qa-report.md)"
            --disallowedTools "Skill,Read,Glob,Grep"
            --max-turns ${{ steps.load-prompt.outputs.max_turns || '60' }}
            --model ${{ env.CLAUDE_MODEL }}
            --json-schema '${{ steps.load-schema.outputs.schema }}'

      - name: Stop tailer and render timeline
        if: always()
        shell: bash
        run: |
          if [ -n "${TAILER_PID:-}" ]; then
            kill "$TAILER_PID" 2>/dev/null || true
          fi
          if [ -n "${TAILER_OUT:-}" ] && [ -f "$TAILER_OUT" ] && [ -s "$TAILER_OUT" ]; then
            {
              echo "## Claude tool-call timeline"
              echo ''
              echo '```'
              cat "$TAILER_OUT"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            echo "===== CLAUDE TOOL-CALL TIMELINE ====="
            cat "$TAILER_OUT"
            echo "===== END TIMELINE ====="
          else
            echo "No tool-call events captured by tailer."
          fi

      - name: Check report exists
        id: check-report
        if: always()
        shell: bash
        env:
          STRUCTURED_OUTPUT: ${{ steps.claude-qa.outputs.structured_output }}
          CAN_RUN_CLAUDE: ${{ steps.claude-action-guard.outputs.can_run }}
          SKIP_REASON: ${{ steps.claude-action-guard.outputs.reason }}
        run: |
          set -euo pipefail
          if [ "${CAN_RUN_CLAUDE:-true}" != "true" ]; then
            {
              echo "# Claude QA (Browser) Report"
              echo ""
              echo "## Verdict: QA_SKIPPED"
              echo ""
              echo "WARNING: Claude browser QA was skipped."
              echo ""
              echo "${SKIP_REASON:-Claude action compatibility guard prevented this run.}"
              echo ""
              echo "The browser warm-up completed before this guard, so the app rendered, but the Claude exploratory QA step did not run."
            } > qa-report.md
            echo "exists=true" >> "$GITHUB_OUTPUT"
          elif [ -f "qa-report.md" ]; then
            if node /tmp/qa-workflow-policy.mjs qa-report.md; then
              echo "exists=true" >> "$GITHUB_OUTPUT"
            else
              echo "exists=false" >> "$GITHUB_OUTPUT"
            fi
          elif [ -n "${STRUCTURED_OUTPUT:-}" ]; then
          node <<'NODE'
          const fs = require('fs');
          const raw = process.env.STRUCTURED_OUTPUT || '';
          const report = ['# Claude QA (Browser) Report', ''];

          try {
            const data = JSON.parse(raw);
            // Emit every section scripts/qa-workflow-policy.mjs requires, so a
            // fallback-generated report passes the same validation as an
            // agent-written one (the publish job re-validates this file).
            report.push(`## Verdict: ${data.verdict || 'UNKNOWN'}`);
            report.push('');
            report.push(data.summary || 'Claude returned structured QA output but did not write qa-report.md.');

            const tests = Array.isArray(data.tests) ? data.tests : [];
            report.push('');
            report.push('## Acceptance Criteria');
            report.push('');
            if (tests.length > 0) {
              for (const test of tests) {
                report.push(`- ${test.result === 'pass' ? '✅' : test.result === 'fail' ? '❌' : '⏭️'} ${test.name || 'unnamed test'}`);
              }
            } else {
              report.push('No individual test results were captured in the structured output.');
            }

            report.push('');
            report.push('## Evidence');
            report.push('');
            // Track whether any evidence line was emitted so the section is
            // never left empty (an empty section fails policy validation),
            // regardless of which optional fields the payload happens to carry.
            const evidenceStart = report.length;
            if (tests.length > 0) {
              for (const test of tests) {
                if (test.details) report.push(`- **${test.name || 'unnamed test'}**: ${test.details}`);
              }
            }
            if (data.metrics) {
              report.push(`- Metrics: ${data.metrics.total_tests ?? 0} tests, ${data.metrics.passed ?? 0} passed, ${data.metrics.failed ?? 0} failed, ${data.metrics.critical_bugs ?? 0} critical / ${data.metrics.major_bugs ?? 0} major / ${data.metrics.minor_bugs ?? 0} minor bugs.`);
            }
            if (report.length === evidenceStart) {
              report.push('No evidence details were captured in the structured output.');
            }

            const bugs = Array.isArray(data.bugs) ? data.bugs : [];
            report.push('');
            report.push('## Bugs / Observations');
            report.push('');
            if (bugs.length > 0) {
              for (const bug of bugs) {
                report.push(`### ${bug.title || bug.id || 'Bug'}`);
                report.push(`- Severity: ${bug.severity || 'unknown'}`);
                if (bug.description) report.push(`- Description: ${bug.description}`);
                // Schema fields (additionalProperties: false): steps_to_reproduce
                // is an array; expected/actual are strings. There is no
                // `reproduction` field.
                if (Array.isArray(bug.steps_to_reproduce) && bug.steps_to_reproduce.length > 0) {
                  report.push(`- Steps to reproduce: ${bug.steps_to_reproduce.join('; ')}`);
                }
                if (bug.expected) report.push(`- Expected: ${bug.expected}`);
                if (bug.actual) report.push(`- Actual: ${bug.actual}`);
                report.push('');
              }
            } else {
              report.push('None reported in the structured output.');
            }

            report.push('');
            report.push('## Accessibility Findings');
            report.push('');
            report.push('Not separately assessed - this report was auto-generated from structured output.');

            const consoleErrors = Array.isArray(data.console_errors) ? data.console_errors : [];
            report.push('');
            report.push('## Console');
            report.push('');
            if (consoleErrors.length > 0) {
              for (const err of consoleErrors.slice(0, 20)) report.push(`- ${String(err)}`);
            } else {
              report.push('No console errors reported in the structured output.');
            }

            report.push('');
            report.push('## Confidence');
            report.push('');
            report.push('Reduced - qa-report.md was reconstructed from structured output rather than written during testing.');
          } catch (error) {
            report.push('## Verdict: UNKNOWN');
            report.push('');
            report.push('Claude returned structured output but qa-report.md was missing and the JSON could not be parsed.');
            report.push('');
            report.push('```');
            report.push(raw.slice(0, 4000));
            report.push('```');
          }

          report.push('');
          report.push('_Generated from Claude structured_output because qa-report.md was missing._');
          fs.writeFileSync('qa-report.md', `${report.join('\n')}\n`);
          NODE
            if node /tmp/qa-workflow-policy.mjs qa-report.md; then
              echo "exists=true" >> "$GITHUB_OUTPUT"
            else
              echo "exists=false" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Early summarize on Claude failure
        if: always() && (steps.claude-qa.outcome == 'failure' || steps.claude-qa.outcome == 'cancelled')
        uses: ./.github/actions/summarize-claude-run
        with:
          debug-dir: qa-debug

      # Retry with a quick smoke test if main run failed to generate a report
      - name: Load retry prompt
        id: load-retry-prompt
        if: steps.claude-action-guard.outputs.can_run == 'true' && steps.check-report.outputs.exists == 'false'
        shell: bash
        run: |
          set -euo pipefail
          {
            echo 'prompt<<RETRY_PROMPT_EOF'
            cat .claude/prompts/qa-system-prompt.md
            echo ''
            echo '---'
            echo ''
            echo 'IMPORTANT: The previous QA run did not generate a report.'
            echo ''
            echo 'Do a quick navigation smoke test with qa-report.md written FIRST:'
            echo '1. FIRST ACTION: Write qa-report.md as a skeleton (verdict UNKNOWN, empty sections) so a report exists even if this run dies'
            echo "2. Open ${APP_URL} with agent-browser"
            echo '3. Run agent-browser set device "iPhone 14", reload, and verify matchMedia("(pointer: coarse)").matches before the first snapshot'
            echo '4. Dismiss onboarding if a "Skip to App" button is in the snapshot'
            echo '5. Check 3-4 main pages load correctly, updating qa-report.md after each page'
            echo '6. Finalize qa-report.md no later than 30 turns spent (hard limit is 40)'
            echo ''
            echo 'The report is machine-validated: it is REJECTED unless it has a final'
            echo '"## Verdict: HEALTHY|MINOR_ISSUES|CRITICAL_BUGS" line AND all six of these'
            echo 'exact "## " sections, each with real content (never empty, "TBD", or "N/A"):'
            echo ''
            echo '## Acceptance Criteria'
            echo '## Evidence'
            echo '## Bugs / Observations'
            echo '## Accessibility Findings'
            echo '## Console'
            echo '## Confidence'
            echo ''
            echo 'Keep each section brief for this smoke test - one or two sentences is fine'
            echo '(e.g. Bugs / Observations: "None found."), but every section must be present'
            echo 'and non-empty in the final report.'
            echo 'RETRY_PROMPT_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Retry if no report generated
        id: claude-qa-retry
        if: steps.claude-action-guard.outputs.can_run == 'true' && steps.check-report.outputs.exists == 'false'
        timeout-minutes: 8
        uses: anthropics/claude-code-action@b47fd721da662d48c5680e154ad16a73ed74d2e0 # v1.0.93
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          allowed_bots: dependabot,github-actions
          show_full_output: true
          display_report: true
          use_sticky_comment: true
          track_progress: ${{ github.event_name == 'pull_request' && github.event.action != 'labeled' }}
          prompt: ${{ steps.load-retry-prompt.outputs.prompt }}
          claude_args: |
            --allowedTools "Bash(agent-browser:*),Edit(qa-report.md),Write(qa-report.md)"
            --disallowedTools "Skill,Read,Glob,Grep"
            --max-turns 40
            --model ${{ env.CLAUDE_MODEL }}
            --json-schema '${{ steps.load-schema.outputs.schema }}'

      - name: Verify report after retry
        id: check-report-retry
        if: steps.check-report.outputs.exists == 'false'
        shell: bash
        env:
          STRUCTURED_OUTPUT: ${{ steps.claude-qa-retry.outputs.structured_output }}
        run: |
          set -euo pipefail
          node /tmp/qa-workflow-policy.mjs qa-report.md

      - name: Validate final QA report
        id: final-report
        if: always()
        env:
          STRUCTURED_OUTPUT: ${{ steps.claude-qa-retry.outputs.structured_output || steps.claude-qa.outputs.structured_output }}
        run: |
          set -euo pipefail
          node /tmp/qa-workflow-policy.mjs qa-report.md || true

      - name: Write structured output to file
        if: always()
        shell: bash
        env:
          STRUCTURED_OUTPUT: ${{ steps.claude-qa.outputs.structured_output || steps.claude-qa-retry.outputs.structured_output }}
        run: |
          set -euo pipefail
          if [ -n "${STRUCTURED_OUTPUT:-}" ]; then
            printf '%s' "$STRUCTURED_OUTPUT" > qa-structured-output.json
          fi

      - name: Render QA summary to step summary
        if: always()
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          STRUCTURED_OUTPUT: ${{ steps.claude-qa.outputs.structured_output || steps.claude-qa-retry.outputs.structured_output }}
          QA_FOCUS: ${{ steps.qa-mode.outputs.focus }}
          PR_NUMBER: ${{ steps.pr-context.outputs.pr_number }}
          CONTRACT_VALID: ${{ steps.pr-context.outputs.contract_valid || 'true' }}
          MISSING_SECTIONS: ${{ steps.pr-context.outputs.missing_sections || 'None' }}
        with:
          script: |
            const fs = require('fs');
            const raw = process.env.STRUCTURED_OUTPUT;
            const focus = process.env.QA_FOCUS || 'unknown';
            const prNumber = process.env.PR_NUMBER || '';
            const contractValid = process.env.CONTRACT_VALID === 'true';
            const missingSections = process.env.MISSING_SECTIONS || 'None';

            const lines = [];
            lines.push(`# Claude QA (Browser) — \`${focus}\``);
            if (prNumber) lines.push(`**PR**: #${prNumber}`);
            if (!contractValid) lines.push(`> ⚠️ PR contract incomplete — missing: ${missingSections}`);
            lines.push('');

            if (!raw || !raw.trim()) {
              lines.push('_No structured output captured._ Check the sticky PR comment or `qa-report.md` artifact.');
              await core.summary.addRaw(lines.join('\n')).write();
              return;
            }

            let data;
            try {
              data = JSON.parse(raw);
            } catch (err) {
              lines.push(`_Could not parse structured_output as JSON: ${err.message}_`);
              lines.push('```');
              lines.push(raw.slice(0, 2000));
              lines.push('```');
              await core.summary.addRaw(lines.join('\n')).write();
              return;
            }

            const verdictBadge = {
              HEALTHY: '✅ HEALTHY',
              MINOR_ISSUES: '⚠️ MINOR ISSUES',
              CRITICAL_BUGS: '❌ CRITICAL BUGS',
            }[data.verdict] || data.verdict || 'UNKNOWN';
            lines.push(`## Verdict: ${verdictBadge}`);
            if (data.summary) {
              lines.push('');
              lines.push(data.summary);
            }
            lines.push('');

            const m = data.metrics || {};
            lines.push('## Metrics');
            lines.push('');
            lines.push('| Total | Passed | Failed | Critical | Major | Minor |');
            lines.push('|------:|-------:|-------:|---------:|------:|------:|');
            lines.push(`| ${m.total_tests ?? 0} | ${m.passed ?? 0} | ${m.failed ?? 0} | ${m.critical_bugs ?? 0} | ${m.major_bugs ?? 0} | ${m.minor_bugs ?? 0} |`);
            lines.push('');

            const bugs = Array.isArray(data.bugs) ? data.bugs : [];
            if (bugs.length) {
              const sevOrder = { critical: 0, major: 1, minor: 2, suggestion: 3 };
              const sevIcon = { critical: '🔴', major: '🟠', minor: '🟡', suggestion: '💡' };
              const sorted = [...bugs].sort((a, b) => (sevOrder[a.severity] ?? 9) - (sevOrder[b.severity] ?? 9));
              lines.push('## Bugs');
              lines.push('');
              lines.push('| # | Severity | Title | What happened |');
              lines.push('|---|----------|-------|---------------|');
              for (const bug of sorted) {
                const icon = sevIcon[bug.severity] || '•';
                const title = (bug.title || '').replace(/\|/g, '\\|');
                const shot = bug.screenshot ? ` 📸 \`${bug.screenshot}\`` : '';
                const desc = (bug.description || '').replace(/\|/g, '\\|').replace(/\r?\n/g, ' ').slice(0, 200) + shot;
                lines.push(`| ${bug.id ?? ''} | ${icon} ${bug.severity || ''} | ${title} | ${desc} |`);
              }
              lines.push('');
            }

            const tests = Array.isArray(data.tests) ? data.tests : [];
            if (tests.length) {
              const resultIcon = { pass: '✅', fail: '❌', skip: '⏭️' };
              lines.push('<details><summary>Tests performed</summary>');
              lines.push('');
              lines.push('| # | Area | Result | Name | Details |');
              lines.push('|---|------|--------|------|---------|');
              tests.forEach((t, i) => {
                const icon = resultIcon[t.result] || '•';
                const name = (t.name || '').replace(/\|/g, '\\|');
                const shot = t.screenshot ? ` 📸 \`${t.screenshot}\`` : '';
                const details = (t.details || '').replace(/\|/g, '\\|').replace(/\r?\n/g, ' ').slice(0, 160) + shot;
                lines.push(`| ${i + 1} | ${t.area || ''} | ${icon} | ${name} | ${details} |`);
              });
              lines.push('');
              lines.push('</details>');
              lines.push('');
            }

            const consoleErrors = Array.isArray(data.console_errors) ? data.console_errors : [];
            if (consoleErrors.length) {
              lines.push(`<details><summary>Console errors (${consoleErrors.length})</summary>`);
              lines.push('');
              lines.push('```');
              for (const err of consoleErrors.slice(0, 50)) lines.push(String(err));
              lines.push('```');
              lines.push('');
              lines.push('</details>');
              lines.push('');
            }

            lines.push('---');
            lines.push('Full report: see `qa-report.md` in run artifacts.');

            await core.summary.addRaw(lines.join('\n')).write();

      - name: Summarize Claude run
        if: always()
        uses: ./.github/actions/summarize-claude-run
        with:
          debug-dir: qa-debug

      - name: Collect claude debug artifacts
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p qa-debug
          # Try both paths - base-action docs say /tmp/, summarize action uses $RUNNER_TEMP
          cp /home/runner/work/_temp/claude-execution-output.json qa-debug/claude-execution-output.json 2>/dev/null \
            || cp /tmp/claude-execution-output.json qa-debug/claude-execution-output.json 2>/dev/null \
            || echo "no claude-execution-output.json at either path"
          cp /tmp/dev-server.log qa-debug/dev-server.log 2>/dev/null || echo "no dev-server.log"
          cp /tmp/claude-tailer.log qa-debug/claude-tailer.log 2>/dev/null || echo "no claude-tailer.log"
          # Dump any other claude-related files in /tmp so we can see where it writes
          find /tmp /home/runner/work/_temp -maxdepth 2 -name "claude*" 2>/dev/null | tee qa-debug/claude-file-locations.txt || true
          ls -la qa-debug/ || true

      # Screenshots are written by the unprivileged Claude run via
      # `agent-browser screenshot qa-screenshots/<name>.png`. Before they enter
      # the provenance chain, enforce the contract: flat directory, kebab-case
      # .png names, real PNG bytes, bounded size and count. Everything else is
      # dropped with a log line so a misbehaving run degrades to "no image",
      # never to publishing an arbitrary file.
      - name: Sanitize QA screenshots
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p qa-screenshots
          # Flatten one accidental nesting level (e.g. a screenshot-dir joined
          # with an already-prefixed relative path), then drop directories.
          find qa-screenshots -mindepth 2 -type f -name '*.png' -exec mv -n {} qa-screenshots/ \;
          find qa-screenshots -mindepth 1 -type d -exec rm -rf {} +
          node --input-type=module - <<'NODE'
          import { readdir, readFile, stat, unlink } from 'node:fs/promises'
          import path from 'node:path'
          import { pathToFileURL } from 'node:url'
          // The trusted default-branch checkout provides the policy module; the
          // inline fallback keeps the bootstrap PR (policy not yet on the
          // default branch) working with identical rules.
          let policy = {}
          try {
            policy = await import(pathToFileURL(path.join(
              process.env.GITHUB_WORKSPACE, 'scripts/qa-workflow-policy.mjs',
            )).href)
          } catch {}
          const isValid = policy.isValidScreenshotFilename ?? ((name) =>
            typeof name === 'string' && name.length <= 100 && /^[a-z0-9][a-z0-9_-]*\.png$/.test(name))
          const MAX_FILES = 25
          const MAX_BYTES = 3 * 1024 * 1024
          const PNG_MAGIC = Buffer.from([0x89, 0x50, 0x4e, 0x47, 0x0d, 0x0a, 0x1a, 0x0a])
          const kept = []
          for (const name of (await readdir('qa-screenshots')).sort()) {
            const file = path.join('qa-screenshots', name)
            const drop = async (reason) => {
              console.warn(`Dropping ${name}: ${reason}`)
              await unlink(file)
            }
            if (!isValid(name)) { await drop('invalid filename'); continue }
            const { size } = await stat(file)
            if (size > MAX_BYTES) { await drop(`too large (${size} bytes)`); continue }
            const head = (await readFile(file)).subarray(0, PNG_MAGIC.length)
            if (!head.equals(PNG_MAGIC)) { await drop('not a PNG'); continue }
            if (kept.length >= MAX_FILES) { await drop('over file limit'); continue }
            kept.push(name)
          }
          console.info(`Kept ${kept.length} screenshot(s): ${kept.join(', ') || '(none)'}`)
          NODE

      - name: Write immutable QA provenance
        if: always()
        env:
          PR_NUMBER: ${{ steps.pr-context.outputs.pr_number || steps.pr-metadata.outputs.number || github.event.pull_request.number || github.event.inputs.pr_number || github.event.workflow_run.pull_requests[0].number }}
          TESTED_HEAD_SHA: ${{ needs.prepare-app.outputs.head-sha }}
        run: |
          REPORT_SHA256=$(sha256sum qa-report.md | cut -d' ' -f1)
          SCREENSHOTS=$( { sha256sum qa-screenshots/*.png 2>/dev/null || true; } | jq -Rn \
            '[inputs | select(length > 0)
              | capture("^(?<sha256>[0-9a-f]{64}) [ *](?<file>qa-screenshots/.+)$")
              | {file: (.file | sub("^qa-screenshots/"; "")), sha256}]' )
          jq -n --arg pr "$PR_NUMBER" --arg sha "$TESTED_HEAD_SHA" \
            --arg report_sha256 "$REPORT_SHA256" \
            --argjson screenshots "$SCREENSHOTS" \
            '{pr_number: $pr, tested_head_sha: $sha, report_sha256: $report_sha256, screenshots: $screenshots}' \
            > qa-provenance.json

      - name: Upload QA artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: qa-browser-artifacts-${{ github.run_id }}
          path: |
            qa-report.md
            qa-structured-output.json
            qa-provenance.json
            qa-screenshots/
            qa-debug/
          if-no-files-found: ignore

      - name: Cleanup
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          kill "${DEV_PID:-}" 2>/dev/null || true
          agent-browser close 2>/dev/null || true

  publish-report:
    name: Publish immutable QA report
    needs: [prepare-app, qa-browser]
    # `cancelled` is excluded so a superseding push (concurrency cancel) does
    # not leave a red-X publish job that posts an `error` status on the stale
    # SHA it can no longer validate.
    if: always() && needs.qa-browser.result != 'skipped' && needs.qa-browser.result != 'cancelled' && needs.prepare-app.outputs.pr-number
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
      # contents: write is only used to append validated screenshot PNGs to the
      # orphan `qa-screenshots` branch so they can render inline in the report
      # comment; the job never touches code branches.
      contents: write
      issues: write
      pull-requests: write
      statuses: write
    outputs:
      comment-id: ${{ steps.post-report.outputs.comment-id }}
      report-ready: ${{ steps.validate.outputs.ready }}
    steps:
      - name: Checkout trusted default-branch publisher
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Download immutable QA artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: qa-browser-artifacts-${{ github.run_id }}
          path: /tmp/qa-report
      - name: Revalidate report, digest, and current PR head
        id: validate
        env:
          EXPECTED_PR: ${{ needs.prepare-app.outputs.pr-number }}
          EXPECTED_SHA: ${{ needs.prepare-app.outputs.head-sha }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          echo 'ready=false' >> "$GITHUB_OUTPUT"
          test "$(gh api "repos/${REPO}/pulls/${EXPECTED_PR}" --jq '.head.sha')" = "$EXPECTED_SHA"
          jq -e --arg pr "$EXPECTED_PR" --arg sha "$EXPECTED_SHA" \
            '.pr_number == $pr and .tested_head_sha == $sha and
             (.report_sha256 | test("^[0-9a-f]{64}$"))' \
            /tmp/qa-report/qa-provenance.json >/dev/null
          test "$(sha256sum /tmp/qa-report/qa-report.md | cut -d' ' -f1)" = \
            "$(jq -r '.report_sha256' /tmp/qa-report/qa-provenance.json)"
          # Screenshots ride the same immutable provenance chain as the report:
          # any file that is missing, renamed, or altered since the QA job
          # hashed it fails the whole validation.
          while IFS= read -r entry; do
            FILE=$(jq -r '.file' <<<"$entry")
            SHA=$(jq -r '.sha256' <<<"$entry")
            [[ "$FILE" =~ ^[a-z0-9][a-z0-9_-]*\.png$ ]]
            [[ "$SHA" =~ ^[0-9a-f]{64}$ ]]
            test "$(sha256sum "/tmp/qa-report/qa-screenshots/$FILE" | cut -d' ' -f1)" = "$SHA"
          done < <(jq -c '.screenshots[]?' /tmp/qa-report/qa-provenance.json)
          node scripts/qa-workflow-policy.mjs /tmp/qa-report/qa-report.md
          echo 'ready=true' >> "$GITHUB_OUTPUT"
      # PR comments cannot embed images from artifacts or local paths, so the
      # hash-validated screenshots are committed to an orphan `qa-screenshots`
      # branch and referenced by commit-SHA raw URLs (immutable even if the
      # branch is later rewritten). continue-on-error: a screenshot-hosting
      # failure must never block the report itself.
      - name: Publish screenshots to qa-screenshots branch
        id: publish-screenshots
        if: steps.validate.outputs.ready == 'true'
        continue-on-error: true
        uses: actions/github-script@373c709c69115d41ff229c7e5df9f8788daa9553 # v9
        env:
          PR_NUMBER: ${{ needs.prepare-app.outputs.pr-number }}
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const MAP_PATH = '/tmp/qa-report/screenshot-urls.json';
            fs.writeFileSync(MAP_PATH, '{}');
            const provenance = JSON.parse(fs.readFileSync('/tmp/qa-report/qa-provenance.json', 'utf8'));
            const shots = Array.isArray(provenance.screenshots) ? provenance.screenshots : [];
            if (shots.length === 0) {
              core.info('No screenshots to publish.');
              return;
            }
            const { owner, repo } = context.repo;
            const BRANCH = 'qa-screenshots';
            if (!/^[1-9][0-9]*$/.test(process.env.PR_NUMBER || '')) {
              core.warning('No valid PR number — skipping screenshot publish.');
              return;
            }
            const prefix = `pr-${process.env.PR_NUMBER}/${context.runId}`;
            const tree = [];
            for (const { file } of shots) {
              // Names were validated against provenance hashes already; this is
              // a last-line guard before they become git paths.
              if (!/^[a-z0-9][a-z0-9_-]*\.png$/.test(file)) continue;
              const content = fs.readFileSync(path.join('/tmp/qa-report/qa-screenshots', file));
              const { data: blob } = await github.rest.git.createBlob({
                owner, repo, content: content.toString('base64'), encoding: 'base64',
              });
              tree.push({ path: `${prefix}/${file}`, mode: '100644', type: 'blob', sha: blob.sha });
            }
            if (tree.length === 0) {
              core.info('No publishable screenshots after validation.');
              return;
            }
            // Append a commit to the orphan branch; create it (parentless) on
            // first use. One refetch-retry absorbs a concurrent QA run racing
            // the ref update.
            let commit;
            for (let attempt = 0; attempt < 2; attempt++) {
              let parentSha = null;
              let baseTree;
              try {
                const { data: ref } = await github.rest.git.getRef({ owner, repo, ref: `heads/${BRANCH}` });
                parentSha = ref.object.sha;
                const { data: parentCommit } = await github.rest.git.getCommit({ owner, repo, commit_sha: parentSha });
                baseTree = parentCommit.tree.sha;
              } catch (error) {
                if (error.status !== 404) throw error;
              }
              const { data: newTree } = await github.rest.git.createTree({
                owner, repo, tree, ...(baseTree ? { base_tree: baseTree } : {}),
              });
              const { data: newCommit } = await github.rest.git.createCommit({
                owner, repo,
                message: `qa: screenshots for PR #${process.env.PR_NUMBER} (run ${context.runId})`,
                tree: newTree.sha,
                parents: parentSha ? [parentSha] : [],
              });
              try {
                if (parentSha) {
                  await github.rest.git.updateRef({ owner, repo, ref: `heads/${BRANCH}`, sha: newCommit.sha });
                } else {
                  await github.rest.git.createRef({ owner, repo, ref: `refs/heads/${BRANCH}`, sha: newCommit.sha });
                }
                commit = newCommit;
                break;
              } catch (error) {
                if (attempt === 1) throw error;
                core.warning(`Ref update conflict, retrying: ${error.message}`);
              }
            }
            const urls = {};
            for (const entry of tree) {
              const file = entry.path.split('/').pop();
              urls[file] = `https://raw.githubusercontent.com/${owner}/${repo}/${commit.sha}/${entry.path}`;
            }
            fs.writeFileSync(MAP_PATH, JSON.stringify(urls, null, 2));
            core.info(`Published ${tree.length} screenshot(s) to ${BRANCH} @ ${commit.sha}.`);

      - name: Inline hosted screenshot links into report
        if: steps.validate.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module - <<'NODE'
          import { readFile, writeFile } from 'node:fs/promises'
          import path from 'node:path'
          import { pathToFileURL } from 'node:url'
          let policy = {}
          try {
            policy = await import(pathToFileURL(path.join(
              process.env.GITHUB_WORKSPACE, 'scripts/qa-workflow-policy.mjs',
            )).href)
          } catch {}
          const rewrite = policy.rewriteScreenshotLinks ?? ((report, urlMap) =>
            report.replaceAll(/qa-screenshots\/([a-z0-9][a-z0-9_-]*\.png)/g,
              (match, file) => urlMap[file] ?? match))
          const report = await readFile('/tmp/qa-report/qa-report.md', 'utf8')
          const urls = JSON.parse(
            await readFile('/tmp/qa-report/screenshot-urls.json', 'utf8').catch(() => '{}'),
          )
          await writeFile('/tmp/qa-report/qa-report-published.md', rewrite(report, urls))
          NODE

      - name: Post QA report as PR comment
        id: post-report
        if: steps.validate.outputs.ready == 'true'
        uses: ./.github/actions/post-qa-report
        with:
          pr-number: ${{ needs.prepare-app.outputs.pr-number }}
          heading: '## Claude QA (Browser) Report'
          marker: '<!-- claude-qa-browser-report -->'
          report-path: /tmp/qa-report/qa-report-published.md
          github-token: ${{ secrets.GITHUB_TOKEN }}
          head-sha: ${{ needs.prepare-app.outputs.head-sha }}
      - name: Set commit status
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_SHA: ${{ needs.prepare-app.outputs.head-sha }}
          READY: ${{ steps.validate.outputs.ready }}
          REPO: ${{ github.repository }}
        run: |
          if [ "$READY" != true ]; then STATE=error; DESCRIPTION='QA report missing, stale, or incomplete';
          elif grep -Eqi 'Verdict:(\*\*)?[[:space:]]*CRITICAL_BUGS' /tmp/qa-report/qa-report.md; then
            STATE=failure; DESCRIPTION='QA found critical issues';
          elif grep -Eqi 'Verdict:(\*\*)?[[:space:]]*MINOR_ISSUES' /tmp/qa-report/qa-report.md; then
            # `pending` means "still running" to GitHub and never resolves — it
            # would leave a permanent yellow status (and block merge if this
            # context ever becomes required). Minor issues are advisory.
            STATE=success; DESCRIPTION='QA passed with minor issues — see report';
          else STATE=success; DESCRIPTION='QA passed'; fi
          gh api -X POST "repos/${REPO}/statuses/${HEAD_SHA}" -f state="$STATE" \
            -f context='Claude QA (Browser)' -f description="$DESCRIPTION" \
            -f target_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
      - name: Remove trigger label
        if: github.event_name == 'pull_request' && github.event.label.name == 'qa-verify'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ needs.prepare-app.outputs.pr-number }}
          REPO: ${{ github.repository }}
        run: gh api -X DELETE "repos/${REPO}/issues/${PR_NUMBER}/labels/qa-verify" || true

  dispatch-followup:
    name: Dispatch trusted QA follow-up
    needs: [prepare-app, qa-browser, publish-report]
    if: always() && needs.publish-report.outputs.comment-id && needs.publish-report.outputs.report-ready == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions:
      actions: write
      contents: read

    steps:
      - name: Check follow-up workflow compatibility
        id: compatibility
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          REPORT_HEAD_SHA: ${{ needs.prepare-app.outputs.head-sha }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          WORKFLOW_PATH='.github/workflows/claude-qa-followup.yml'
          DEFAULT_BLOB=$(gh api "repos/${REPO}/contents/${WORKFLOW_PATH}?ref=${DEFAULT_BRANCH:-main}" --jq '.sha')
          HEAD_BLOB=$(gh api "repos/${REPO}/contents/${WORKFLOW_PATH}?ref=${REPORT_HEAD_SHA}" --jq '.sha')
          if [ "$DEFAULT_BLOB" = "$HEAD_BLOB" ]; then
            echo "compatible=true" >> "$GITHUB_OUTPUT"
          else
            echo "compatible=false" >> "$GITHUB_OUTPUT"
            echo "QA follow-up dispatch skipped until its input schema reaches the default branch."
          fi

      - name: Dispatch QA follow-up for this PR
        if: steps.compatibility.outputs.compatible == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ needs.prepare-app.outputs.pr-number }}
          REPORT_COMMENT_ID: ${{ needs.publish-report.outputs.comment-id }}
          REPORT_RUN_ID: ${{ github.run_id }}
          REPORT_HEAD_SHA: ${{ needs.prepare-app.outputs.head-sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh workflow run claude-qa-followup.yml \
            --repo "$REPO" \
            --ref "${DEFAULT_BRANCH:-main}" \
            -f pr_number="$PR_NUMBER" \
            -f report_comment_id="$REPORT_COMMENT_ID" \
            -f report_run_id="$REPORT_RUN_ID" \
            -f report_head_sha="$REPORT_HEAD_SHA"
