# Consolidated Claude QA Workflow
# Replaces both claude-playwright-explore.yml and claude-qa-verify.yml

name: Claude QA

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'QA mode'
        type: choice
        options:
          - explore
          - verify
        default: 'explore'
      pr_number:
        description: 'PR number (for posting results)'
        required: false
        type: string
      focus:
        description: 'Test focus area'
        type: choice
        options:
          - general
          - navigation
          - forms
          - workout-flow
          - security
          - accessibility
        default: 'general'
  pull_request:
    types: [labeled]
  issue_comment:
    types: [created]

jobs:
  qa:
    # Run on: manual trigger, specific labels, or @claude verify comment
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
       contains(fromJson('["claude-explore", "qa-verify"]'), github.event.label.name)) ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request &&
       contains(github.event.comment.body, '@claude verify'))

    runs-on: ubuntu-latest
    timeout-minutes: 20

    # Prevent duplicate runs on same PR (use ref for workflow_dispatch branch deduplication)
    concurrency:
      group: claude-qa-${{ github.event.pull_request.number || github.event.issue.number || github.ref }}
      cancel-in-progress: true

    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
      statuses: write

    env:
      NODE_VERSION: '22'
      QA_FOCUS: ${{ github.event.inputs.focus || 'general' }}

    steps:
      - name: Determine QA mode
        id: qa-mode
        shell: bash
        run: |
          MODE="explore"
          if [[ "${{ github.event.label.name }}" == "qa-verify" ]]; then
            MODE="verify"
          elif [[ "${{ github.event.label.name }}" == "claude-explore" ]]; then
            MODE="explore"
          elif [[ "${{ github.event_name }}" == "issue_comment" ]]; then
            MODE="verify"
          elif [[ -n "${{ github.event.inputs.mode }}" ]]; then
            MODE="${{ github.event.inputs.mode }}"
          fi
          echo "mode=$MODE" >> $GITHUB_OUTPUT
          echo "QA_MODE=$MODE" >> $GITHUB_ENV
          echo "Determined QA mode: $MODE"

      - name: Get PR ref for issue_comment
        if: github.event_name == 'issue_comment'
        id: pr-ref
        uses: actions/github-script@v7
        with:
          script: |
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.issue.number
            });
            core.setOutput('ref', pr.head.sha);

      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.pr-ref.outputs.ref || github.event.pull_request.head.sha || github.sha }}

      # Reuse existing composite action instead of duplicating setup
      - name: Setup test environment
        uses: ./.github/actions/setup-test-env
        with:
          node-version: ${{ env.NODE_VERSION }}

      # Create test fixtures for QA agent to use during file upload testing
      - name: Create QA test fixtures
        shell: bash
        run: |
          # Ensure ImageMagick is available
          sudo apt-get update -qq && sudo apt-get install -y -qq imagemagick

          mkdir -p .qa-sandbox

          # Valid images at different sizes
          convert -size 100x100 xc:blue .qa-sandbox/valid-small.png
          convert -size 500x500 xc:green .qa-sandbox/valid-medium.png
          convert -size 1000x1000 xc:red .qa-sandbox/valid-large.png

          # Edge case: exactly at 1MB limit (assuming 1MB = 1048576 bytes)
          convert -size 100x100 xc:gray .qa-sandbox/temp.png
          truncate -s 1048576 .qa-sandbox/exactly-1mb.png

          # Edge case: just over limit (1.1MB)
          truncate -s 1153434 .qa-sandbox/over-limit-1.1mb.png

          # Edge case: way over limit (5MB)
          truncate -s 5242880 .qa-sandbox/way-over-5mb.png

          # Edge case: empty/zero-byte file
          touch .qa-sandbox/empty-0bytes.png

          # Edge case: corrupted file (random bytes with .png extension)
          head -c 1024 /dev/urandom > .qa-sandbox/corrupted.png

          # Edge case: wrong extension (valid PNG but .jpg extension)
          convert -size 50x50 xc:yellow .qa-sandbox/wrong-extension.jpg

          # Edge case: valid JPEG
          convert -size 200x200 xc:purple .qa-sandbox/valid.jpg

          # Edge case: SVG file (if not supported)
          echo '<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100"><circle cx="50" cy="50" r="40" fill="blue"/></svg>' > .qa-sandbox/test.svg

          # Edge case: text file with image extension
          echo "This is not an image" > .qa-sandbox/fake-image.png

          # List created files for visibility
          echo "Created QA test fixtures:"
          ls -lah .qa-sandbox/

      - name: Get PR context
        if: env.QA_MODE == 'verify'
        id: pr-context
        uses: actions/github-script@v7
        env:
          PR_NUMBER_INPUT: ${{ github.event.inputs.pr_number }}
        with:
          script: |
            let prNumber, prBody, prTitle;

            if (context.eventName === 'pull_request') {
              prNumber = context.payload.pull_request.number;
              prBody = context.payload.pull_request.body || '';
              prTitle = context.payload.pull_request.title;
            } else if (context.eventName === 'issue_comment') {
              // @claude verify comment on PR
              prNumber = context.payload.issue.number;
              const { data: pr } = await github.rest.pulls.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: prNumber
              });
              prBody = pr.body || '';
              prTitle = pr.title;
            } else if (process.env.PR_NUMBER_INPUT) {
              prNumber = parseInt(process.env.PR_NUMBER_INPUT, 10);
              const { data: pr } = await github.rest.pulls.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: prNumber
              });
              prBody = pr.body || '';
              prTitle = pr.title;
            }

            // Fetch linked issues
            let linkedIssues = '';
            if (prBody) {
              const matches = prBody.match(/(?:closes|fixes|resolves)\s+#(\d+)/gi) || [];
              for (const match of matches) {
                const issueNum = match.match(/\d+/)[0];
                try {
                  const { data: issue } = await github.rest.issues.get({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    issue_number: parseInt(issueNum)
                  });
                  linkedIssues += `\n### Issue #${issueNum}: ${issue.title}\n${issue.body || ''}\n`;
                } catch (e) {}
              }
            }

            core.setOutput('pr_number', prNumber || '');
            core.setOutput('pr_title', prTitle || '');
            core.setOutput('pr_body', prBody || '');
            core.setOutput('linked_issues', linkedIssues);

      - name: Start development server
        shell: bash
        run: |
          pnpm dev --host 0.0.0.0 --port 5173 &
          DEV_PID=$!
          echo "DEV_PID=$DEV_PID" >> $GITHUB_ENV

          # Early failure detection - check process is still alive after startup
          sleep 2
          if ! kill -0 "$DEV_PID" 2>/dev/null; then
            echo "Dev server failed to start immediately"
            exit 1
          fi

          echo "Waiting for dev server with app mounted..."
          for i in {1..90}; do
            # Check for HTTP 200 AND expected content (more robust pattern)
            if curl -sf http://localhost:5173 | grep -qE '(id="app"|<title>)'; then
              echo "Dev server ready!"
              exit 0
            fi
            # Also check process is still running during wait
            if ! kill -0 "$DEV_PID" 2>/dev/null; then
              echo "Dev server process died during startup"
              exit 1
            fi
            sleep 1
          done
          echo "Dev server failed to start properly"
          curl -v http://localhost:5173 || true
          exit 1

      - name: Load QA prompts
        id: load-prompts
        shell: bash
        env:
          PR_BODY_RAW: ${{ steps.pr-context.outputs.pr_body }}
          LINKED_ISSUES_RAW: ${{ steps.pr-context.outputs.linked_issues }}
        run: |
          # Get today's date
          TODAY=$(date +%Y-%m-%d)

          # Start building combined prompt with system prompt
          {
            echo 'prompt<<PROMPT_EOF'

            # Add system prompt (personality & rules)
            cat .claude/prompts/qa-system-prompt.md
            echo ""
            echo "---"
            echo ""

            # Add task prompt based on mode and focus
            if [[ "${{ env.QA_MODE }}" == "verify" ]]; then
              TASK_CONTENT=$(cat .claude/prompts/qa-verify.md)
            elif [[ "${{ env.QA_FOCUS }}" == "security" ]]; then
              TASK_CONTENT=$(cat .claude/prompts/qa-focus-security.md)
            elif [[ "${{ env.QA_FOCUS }}" == "accessibility" ]]; then
              TASK_CONTENT=$(cat .claude/prompts/qa-focus-a11y.md)
            else
              TASK_CONTENT=$(cat .claude/prompts/qa-explore.md)
            fi

            # Replace simple placeholders
            TASK_CONTENT="${TASK_CONTENT//\{\{APP_URL\}\}/http://localhost:5173}"
            TASK_CONTENT="${TASK_CONTENT//\{\{QA_FOCUS\}\}/${{ env.QA_FOCUS }}}"
            TASK_CONTENT="${TASK_CONTENT//\{\{DATE\}\}/$TODAY}"

            # For verify mode, add PR context
            if [[ "${{ env.QA_MODE }}" == "verify" ]]; then
              TASK_CONTENT="${TASK_CONTENT//\{\{PR_NUMBER\}\}/${{ steps.pr-context.outputs.pr_number }}}"
              TASK_CONTENT="${TASK_CONTENT//\{\{PR_TITLE\}\}/${{ steps.pr-context.outputs.pr_title }}}"

              # Use bash parameter expansion for multiline replacements (sed breaks on newlines)
              TASK_CONTENT="${TASK_CONTENT//\{\{PR_BODY\}\}/$PR_BODY_RAW}"
              TASK_CONTENT="${TASK_CONTENT//\{\{LINKED_ISSUES\}\}/$LINKED_ISSUES_RAW}"
            fi

            echo "$TASK_CONTENT"
            echo 'PROMPT_EOF'
          } >> $GITHUB_OUTPUT

      - name: Load QA schema
        id: load-schema
        shell: bash
        run: |
          # Load JSON schema for structured output validation
          SCHEMA=$(cat .github/schemas/qa-report-schema.json | tr -d '\n' | sed "s/'/\\\\'/g")
          echo "schema=$SCHEMA" >> $GITHUB_OUTPUT

      - name: Run Claude QA - Explore Mode
        if: env.QA_MODE == 'explore'
        id: claude-explore
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: ${{ steps.load-prompts.outputs.prompt }}
          # QA tester tools only - no source code access, no low-level JS execution
          # A real QA tester only interacts through the UI
          claude_args: |
            --max-turns 60
            --mcp-config '{"mcpServers":{"playwright":{"command":"npx","args":["@playwright/mcp@latest","--headless","--isolated","--caps=vision,testing"]}}}'
            --allowedTools "mcp__playwright__browser_navigate,mcp__playwright__browser_navigate_back,mcp__playwright__browser_click,mcp__playwright__browser_type,mcp__playwright__browser_snapshot,mcp__playwright__browser_take_screenshot,mcp__playwright__browser_console_messages,mcp__playwright__browser_network_requests,mcp__playwright__browser_wait_for,mcp__playwright__browser_hover,mcp__playwright__browser_resize,mcp__playwright__browser_drag,mcp__playwright__browser_select_option,mcp__playwright__browser_press_key,mcp__playwright__browser_tabs,mcp__playwright__browser_file_upload,mcp__playwright__browser_fill_form,mcp__playwright__browser_handle_dialog,mcp__playwright__browser_close,mcp__playwright__browser_verify_element_visible,mcp__playwright__browser_verify_text_visible,mcp__playwright__browser_verify_value,mcp__playwright__browser_evaluate,Write"
            --json-schema '${{ steps.load-schema.outputs.schema }}'

      - name: Run Claude QA - Verify Mode
        if: env.QA_MODE == 'verify'
        id: claude-verify
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: ${{ steps.load-prompts.outputs.prompt }}
          # QA tester tools only - no source code access, no low-level JS execution
          # A real QA tester only interacts through the UI
          claude_args: |
            --max-turns 200
            --mcp-config '{"mcpServers":{"playwright":{"command":"npx","args":["@playwright/mcp@latest","--headless","--isolated","--caps=vision,testing"]}}}'
            --allowedTools "mcp__playwright__browser_navigate,mcp__playwright__browser_navigate_back,mcp__playwright__browser_click,mcp__playwright__browser_type,mcp__playwright__browser_snapshot,mcp__playwright__browser_take_screenshot,mcp__playwright__browser_console_messages,mcp__playwright__browser_network_requests,mcp__playwright__browser_wait_for,mcp__playwright__browser_hover,mcp__playwright__browser_resize,mcp__playwright__browser_drag,mcp__playwright__browser_select_option,mcp__playwright__browser_press_key,mcp__playwright__browser_tabs,mcp__playwright__browser_file_upload,mcp__playwright__browser_fill_form,mcp__playwright__browser_handle_dialog,mcp__playwright__browser_close,mcp__playwright__browser_verify_element_visible,mcp__playwright__browser_verify_text_visible,mcp__playwright__browser_verify_value,mcp__playwright__browser_evaluate,Write"
            --json-schema '${{ steps.load-schema.outputs.schema }}'

      - name: Check report exists
        id: check-report
        if: always()
        shell: bash
        run: |
          if [ -f "qa-report.md" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "Report generated successfully"
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "Warning: No report generated"
          fi

      # Retry with full tools if main run failed to generate a report
      - name: Retry if no report generated
        if: steps.check-report.outputs.exists == 'false'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            IMPORTANT: The previous QA run did not generate a report.

            Do a quick navigation smoke test and write qa-report.md immediately:
            1. Navigate to http://localhost:5173
            2. Check 3-4 main pages load correctly
            3. Write the report with what you observed

            Write `qa-report.md` now with:
            - Summary of pages tested
            - Any errors found
            - Verdict: ✅ HEALTHY / ⚠️ MINOR ISSUES / ❌ CRITICAL BUGS
          claude_args: |
            --max-turns 15
            --mcp-config '{"mcpServers":{"playwright":{"command":"npx","args":["@playwright/mcp@latest","--headless","--isolated","--caps=vision,testing"]}}}'
            --allowedTools "mcp__playwright__browser_navigate,mcp__playwright__browser_click,mcp__playwright__browser_type,mcp__playwright__browser_snapshot,mcp__playwright__browser_take_screenshot,mcp__playwright__browser_console_messages,mcp__playwright__browser_evaluate,Write"

      - name: Verify report after retry
        id: check-report-retry
        if: steps.check-report.outputs.exists == 'false'
        shell: bash
        run: |
          if [ -f "qa-report.md" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Set commit status
        id: qa-status
        if: always()
        uses: actions/github-script@v7
        env:
          STRUCTURED_OUTPUT: ${{ steps.claude-explore.outputs.structured_output || steps.claude-verify.outputs.structured_output }}
        with:
          script: |
            const fs = require('fs');
            let state = 'success';
            let description = 'QA passed';
            let metrics = null;

            // Try structured output first (preferred)
            const structuredOutput = process.env.STRUCTURED_OUTPUT;
            if (structuredOutput && structuredOutput.trim()) {
              try {
                const data = JSON.parse(structuredOutput);
                metrics = data.metrics;

                if (data.verdict === 'CRITICAL_BUGS' || data.metrics.critical_bugs > 0) {
                  state = 'failure';
                  description = `QA found ${data.metrics.critical_bugs} critical bug(s)`;
                } else if (data.verdict === 'MINOR_ISSUES' || data.metrics.major_bugs > 0) {
                  state = 'pending';
                  const issueCount = (data.metrics.minor_bugs || 0) + (data.metrics.major_bugs || 0);
                  description = `QA found ${issueCount} issue(s) to review`;
                } else {
                  state = 'success';
                  description = `QA passed (${data.metrics.passed}/${data.metrics.total_tests} tests)`;
                }

                // Store metrics for job summary
                core.setOutput('metrics', JSON.stringify(data.metrics));
                core.setOutput('verdict', data.verdict);
              } catch (parseErr) {
                core.warning(`Failed to parse structured output: ${parseErr.message}`);
              }
            }

            // Fallback to markdown parsing if structured output unavailable
            if (!metrics) {
              try {
                const report = fs.readFileSync('qa-report.md', 'utf8');
                // Use regex for robust matching (handles emoji/no-emoji, case variations)
                if (/NEEDS FIXES|CRITICAL/i.test(report) && !/APPROVED/i.test(report)) {
                  state = 'failure';
                  description = 'QA found critical issues';
                } else if (/NEEDS CLARIFICATION/i.test(report) || report.includes('⚠️')) {
                  state = 'pending';
                  description = 'QA found minor issues';
                } else if (/APPROVED|HEALTHY/i.test(report)) {
                  state = 'success';
                  description = 'QA passed';
                }
              } catch (e) {
                state = 'error';
                description = 'QA report not generated';
              }
            }

            // Use PR head sha for issue_comment, otherwise use context.sha
            const sha = '${{ steps.pr-ref.outputs.ref }}' || context.sha;

            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: sha,
              state: state,
              context: 'Claude QA',
              description: description,
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            });

            // Set output for job failure
            core.setOutput('qa_state', state);

      - name: Post results to PR
        if: |
          always() &&
          (github.event.pull_request.number || github.event.issue.number || github.event.inputs.pr_number || steps.pr-context.outputs.pr_number)
        uses: actions/github-script@v7
        env:
          # Avoid script injection by passing inputs via environment variables
          PR_NUMBER_INPUT: ${{ github.event.inputs.pr_number }}
          PR_NUMBER_CONTEXT: ${{ steps.pr-context.outputs.pr_number }}
          QA_MODE: ${{ env.QA_MODE }}
          STRUCTURED_OUTPUT: ${{ steps.claude-explore.outputs.structured_output || steps.claude-verify.outputs.structured_output }}
        with:
          script: |
            const fs = require('fs');
            const prNumber = context.payload.pull_request?.number ||
                            context.payload.issue?.number ||
                            process.env.PR_NUMBER_INPUT ||
                            process.env.PR_NUMBER_CONTEXT;

            if (!prNumber) return;

            const mode = process.env.QA_MODE === 'verify' ? 'Verification' : 'Exploration';
            const focus = process.env.QA_FOCUS || 'general';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

            let qaReport = '';

            // Try to generate report from structured output first
            const structuredOutput = process.env.STRUCTURED_OUTPUT;
            if (structuredOutput && structuredOutput.trim()) {
              try {
                const data = JSON.parse(structuredOutput);
                const verdictEmoji = data.verdict === 'HEALTHY' ? '✅' : data.verdict === 'MINOR_ISSUES' ? '⚠️' : '❌';

                // Generate coverage table
                const coverageRows = ['navigation', 'forms', 'core_features', 'mobile']
                  .map(area => {
                    const c = data.coverage[area];
                    const label = area.replace('_', ' ').replace(/\b\w/g, l => l.toUpperCase());
                    return `| ${label} | ${c.passed} | ${c.failed} | ${c.total} |`;
                  })
                  .join('\n');

                // Generate bugs table
                let bugsSection = '';
                if (data.bugs.length > 0) {
                  const bugRows = data.bugs.map(b => {
                    const severityEmoji = b.severity === 'critical' ? '🔴' : b.severity === 'major' ? '🟠' : b.severity === 'minor' ? '🟡' : '💡';
                    const screenshot = b.screenshot ? `[View](${b.screenshot})` : '-';
                    return `| ${b.id} | ${severityEmoji} ${b.severity} | ${b.title} | ${screenshot} |`;
                  }).join('\n');
                  bugsSection = [
                    `### Bugs Found (${data.bugs.length})`,
                    '',
                    '| # | Severity | Description | Screenshot |',
                    '|---|----------|-------------|------------|',
                    bugRows
                  ].join('\n');
                } else {
                  bugsSection = '### Bugs Found\n\n✅ No bugs found';
                }

                // Generate console errors section
                let errorsSection = '';
                if (data.console_errors.length > 0) {
                  errorsSection = [
                    `### Console Errors (${data.console_errors.length})`,
                    '',
                    '```',
                    data.console_errors.join('\n'),
                    '```'
                  ].join('\n');
                }

                qaReport = [
                  `**Verdict**: ${verdictEmoji} **${data.verdict}**`,
                  '',
                  `**Summary**: ${data.summary}`,
                  '',
                  '### Test Coverage',
                  '',
                  '| Area | Passed | Failed | Total |',
                  '|------|--------|--------|-------|',
                  coverageRows,
                  '',
                  `**Overall**: ${data.metrics.passed}/${data.metrics.total_tests} tests passed`,
                  '',
                  bugsSection,
                  errorsSection
                ].join('\n');

              } catch (parseErr) {
                core.warning(`Failed to parse structured output for PR comment: ${parseErr.message}`);
              }
            }

            // Fallback to markdown report if structured output not available
            if (!qaReport) {
              try {
                qaReport = fs.readFileSync('qa-report.md', 'utf8');
              } catch (e) {
                qaReport = '⚠️ QA report not generated. Check [workflow logs](' +
                  `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`;
              }
            }

            const body = [
              `## 🔍 Claude QA ${mode} Report`,
              '',
              `**Mode**: ${mode} | **Focus**: ${focus}`,
              `**Run**: [View Logs](${runUrl})`,
              '',
              '---',
              '',
              qaReport,
              '',
              '---',
              '_Automated QA by Claude Code_'
            ].join('\n');

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: parseInt(prNumber),
              body: body
            });

      - name: Upload QA artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-artifacts-${{ github.run_id }}
          path: |
            qa-report.md
            bug-*.png
          if-no-files-found: ignore

      - name: Remove trigger label
        if: |
          github.event_name == 'pull_request' &&
          contains(fromJson('["claude-explore", "qa-verify"]'), github.event.label.name)
        uses: actions/github-script@v7
        env:
          LABEL_NAME: ${{ github.event.label.name }}
        with:
          script: |
            try {
              await github.rest.issues.removeLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.pull_request.number,
                name: process.env.LABEL_NAME
              });
            } catch (e) {
              // Only suppress 404 (label not found), warn on other errors
              if (e.status !== 404) {
                core.warning(`Failed to remove label: ${e.message}`);
              }
            }

      - name: Cleanup
        if: always()
        shell: bash
        run: kill $DEV_PID 2>/dev/null || true

      - name: Job summary
        if: always()
        uses: actions/github-script@v7
        env:
          QA_MODE: ${{ env.QA_MODE }}
          QA_FOCUS: ${{ env.QA_FOCUS }}
          REPORT_EXISTS: ${{ steps.check-report.outputs.exists }}
          QA_STATE: ${{ steps.qa-status.outputs.qa_state }}
          QA_VERDICT: ${{ steps.qa-status.outputs.verdict }}
          QA_METRICS: ${{ steps.qa-status.outputs.metrics }}
        with:
          script: |
            let summary = `## Claude QA Summary\n\n`;
            summary += `- **Mode**: ${process.env.QA_MODE}\n`;
            summary += `- **Focus**: ${process.env.QA_FOCUS}\n`;
            summary += `- **Report generated**: ${process.env.REPORT_EXISTS}\n`;
            summary += `- **QA Result**: ${process.env.QA_STATE}\n`;

            // Add structured output metrics if available
            if (process.env.QA_VERDICT && process.env.QA_METRICS) {
              try {
                const metrics = JSON.parse(process.env.QA_METRICS);
                const verdictEmoji = process.env.QA_VERDICT === 'HEALTHY' ? '✅' : process.env.QA_VERDICT === 'MINOR_ISSUES' ? '⚠️' : '❌';
                summary += `- **Verdict**: ${verdictEmoji} ${process.env.QA_VERDICT}\n`;
                summary += `\n### Test Metrics\n\n`;
                summary += `| Metric | Count |\n`;
                summary += `|--------|-------|\n`;
                summary += `| Total Tests | ${metrics.total_tests} |\n`;
                summary += `| Passed | ${metrics.passed} |\n`;
                summary += `| Failed | ${metrics.failed} |\n`;
                summary += `| Critical Bugs | ${metrics.critical_bugs} |\n`;
                summary += `| Major Bugs | ${metrics.major_bugs} |\n`;
                summary += `| Minor Bugs | ${metrics.minor_bugs} |\n`;
              } catch (e) {
                // Ignore parse errors, just skip metrics table
              }
            }

            summary += `\n### Estimated Cost\n`;
            summary += `- Claude API: ~$0.20-0.40\n`;
            summary += `- GitHub Actions: ~$0.05\n`;

            await core.summary.addRaw(summary).write();

      - name: Fail job if QA found issues
        if: steps.qa-status.outputs.qa_state == 'failure'
        shell: bash
        run: |
          echo "❌ QA found critical issues - failing the pipeline"
          exit 1
