# Auto-diagnose and fix CI failures using Claude Code
name: Claude Auto-Fix CI

on:
  workflow_run:
    workflows: ['CI']
    types: [completed]

permissions: {}

env:
  CLAUDE_MODEL: claude-sonnet-4-6

jobs:
  auto-fix:
    if: |
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.pull_requests[0] &&
      !startsWith(github.event.workflow_run.head_branch, 'claude-auto-fix-')
    runs-on: ubuntu-latest
    timeout-minutes: 15

    concurrency:
      group: claude-ci-fix-${{ github.event.workflow_run.head_branch }}
      cancel-in-progress: true

    permissions:
      contents: write
      pull-requests: write
      actions: read
      issues: write
      id-token: write

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ github.event.workflow_run.head_branch }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup git identity
        shell: bash
        run: |
          set -euo pipefail
          git config user.email "41898282+claude[bot]@users.noreply.github.com"
          git config user.name "claude[bot]"

      - name: Setup dependencies
        uses: ./.github/actions/setup-node-deps
        with:
          node-version: '22'

      - name: Run Claude Auto-Fix
        uses: anthropics/claude-code-action@c7c8889b30499b4e46f4c32b892e43cd364bc2fe # v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          show_full_output: true
          track_progress: true
          prompt: |
            The CI pipeline failed on this branch. Diagnose and fix the root cause.

            Failed workflow run: ${{ github.event.workflow_run.html_url }}

            Steps:
            1. Check the CI failure logs using gh CLI
            2. Identify the failing job(s): lint, type-check, test, build, knip, audit
            3. Reproduce the failure locally (run the failing command)
            4. Fix the root cause in the source code
            5. Verify the fix by re-running the failing command

            Important:
            - Fix the actual bug, don't suppress errors or weaken checks
            - Keep changes minimal; only fix what's broken
            - Run `pnpm type-check`, `pnpm lint`, and `pnpm test` to verify
            - Commit with conventional commit format: fix(scope): description
          claude_args: |
            --max-turns 15
            --model ${{ env.CLAUDE_MODEL }}
            --allowedTools "Edit,Write,Read,Glob,Grep,Bash(git:*),Bash(pnpm:*),Bash(gh:*),Bash(cat:*),Bash(ls:*)"
