name: Claude Playwright Exploration (PoC)

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to test (optional)'
        required: false
        type: string
      exploration_focus:
        description: 'What to explore'
        required: false
        default: 'general'
        type: choice
        options:
          - general
          - navigation
          - forms
          - workout-flow
  pull_request:
    types: [labeled]

jobs:
  explore:
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' && github.event.label.name == 'claude-explore')

    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write

    env:
      NODE_VERSION: 22

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Get Playwright version
        id: playwright-version
        run: echo "version=$(npx playwright --version | cut -d' ' -f2)" >> $GITHUB_OUTPUT

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium --with-deps

      - name: Install Playwright dependencies (cached)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Start development server
        run: |
          pnpm dev --host 0.0.0.0 --port 5173 &
          DEV_PID=$!
          echo "DEV_PID=$DEV_PID" >> $GITHUB_ENV

          echo "Waiting for dev server..."
          for i in {1..60}; do
            if curl -s http://localhost:5173 > /dev/null 2>&1; then
              echo "Dev server ready!"
              exit 0
            fi
            sleep 1
          done
          echo "Dev server failed to start"
          exit 1

      - name: Run Claude with Playwright MCP
        id: claude-explore
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            You are a senior QA engineer performing exploratory testing.
            App URL: http://localhost:5173

            ## IMPORTANT: Budget your turns wisely!
            You have limited turns. Be efficient:
            - Navigate directly, don't repeat actions
            - Test 2-3 key flows, not everything
            - Reserve your LAST 3 turns for writing the report

            ## Quick Test Plan (pick based on focus: ${{ github.event.inputs.exploration_focus || 'general' }})

            **If general**: Navigation (4 pages) → Exercise search → Start workout → Settings toggle
            **If navigation**: Test all nav buttons, back buttons, deep links
            **If forms**: Exercise creation, workout setup, settings forms
            **If workout-flow**: Full workout: add exercises → log sets → complete

            ## Track Issues As You Go
            Keep a mental note of: Console errors, broken UI, unexpected behavior

            ## FINAL STEP (MANDATORY - use your last turns for this!)
            Write a file `qa-report.md` with this EXACT format:

            ```markdown
            # QA Report - ${{ github.event.inputs.exploration_focus || 'General' }}

            **Date**: [today] | **Tester**: Claude QA

            ## Summary
            [1 sentence: pass/fail verdict]

            ## Test Results
            | Test | Status | Notes |
            |------|--------|-------|
            | [test name] | ✅/❌ | [brief note] |

            ## Bugs Found
            [List any bugs with steps to reproduce, or "None found"]

            ## Console Errors
            [Any JS errors, or "None"]
            ```

            After writing the file, read it back to confirm it was saved correctly.

          claude_args: |
            --max-turns 40
            --mcp-config '{"mcpServers":{"playwright":{"command":"npx","args":["@playwright/mcp@latest","--headless","--isolated"]}}}'
            --allowedTools "mcp__playwright__browser_navigate,mcp__playwright__browser_click,mcp__playwright__browser_type,mcp__playwright__browser_snapshot,mcp__playwright__browser_screenshot,mcp__playwright__browser_console_messages,mcp__playwright__browser_wait,mcp__playwright__browser_hover,Read,Write"

      - name: Post results to PR
        if: github.event.pull_request.number || github.event.inputs.pr_number
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const prNumber = context.payload.pull_request?.number ||
                            '${{ github.event.inputs.pr_number }}';

            if (!prNumber) return;

            // Try to read Claude's QA report
            let qaReport = '';
            try {
              qaReport = fs.readFileSync('qa-report.md', 'utf8');
            } catch (e) {
              qaReport = '⚠️ QA report file not generated. Check workflow logs for details.';
            }

            const body = `## 🔍 Claude QA Exploration Report

            **Focus**: ${{ github.event.inputs.exploration_focus || 'general' }}
            **Run**: [View Full Logs](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})

            ---

            ${qaReport}

            ---
            *Automated QA by Claude Code*`;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: parseInt(prNumber),
              body: body
            });

      - name: Upload QA report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-report
          path: qa-report.md
          if-no-files-found: ignore

      - name: Remove label
        if: github.event_name == 'pull_request' && github.event.label.name == 'claude-explore'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.removeLabel({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              name: 'claude-explore'
            });

      - name: Cleanup
        if: always()
        run: kill $DEV_PID 2>/dev/null || true
