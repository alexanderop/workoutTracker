name: Claude Playwright Exploration (PoC)

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to test (optional)'
        required: false
        type: string
      exploration_focus:
        description: 'What to explore'
        required: false
        default: 'general'
        type: choice
        options:
          - general
          - navigation
          - forms
          - workout-flow
  pull_request:
    types: [labeled]

jobs:
  explore:
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' && github.event.label.name == 'claude-explore')

    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write

    env:
      NODE_VERSION: 22

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Get Playwright version
        id: playwright-version
        run: echo "version=$(npx playwright --version | cut -d' ' -f2)" >> $GITHUB_OUTPUT

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium --with-deps

      - name: Install Playwright dependencies (cached)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Start development server
        run: |
          pnpm dev --host 0.0.0.0 --port 5173 &
          DEV_PID=$!
          echo "DEV_PID=$DEV_PID" >> $GITHUB_ENV

          echo "Waiting for dev server..."
          for i in {1..60}; do
            if curl -s http://localhost:5173 > /dev/null 2>&1; then
              echo "Dev server ready!"
              exit 0
            fi
            sleep 1
          done
          echo "Dev server failed to start"
          exit 1

      - name: Run Claude with Playwright MCP
        id: claude-explore
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            You are a senior QA engineer performing manual exploratory testing.
            The application is running at: http://localhost:5173

            ## Testing Approach
            Think like a real user. Try to break things. Test edge cases.

            ## Test Scenarios (execute all)
            1. **Navigation Flow**: Visit Home → Exercises → Workouts → Settings. Verify each page loads correctly.
            2. **Exercise Search**: Search for "bench", verify filtering works. Try empty search, special characters.
            3. **Create Workout Flow**: Start new workout → Add exercise → Add sets/reps → Verify data persists.
            4. **Timer Functionality**: Test AMRAP/EMOM/Tabata timers. Start, pause, reset. Check time displays correctly.
            5. **Settings**: Toggle dark mode, change units, verify changes apply immediately.
            6. **Form Validation**: Try submitting empty forms, invalid inputs. Check error messages.
            7. **Responsive Behavior**: Note any layout issues, overlapping elements, or broken UI.

            ## For Each Issue Found, Record:
            - **Severity**: Critical (blocks usage) / Major (significant problem) / Minor (cosmetic/UX)
            - **Steps to Reproduce**: Exact clicks/actions
            - **Expected vs Actual**: What should happen vs what happened
            - **Screenshot**: Take one if visual issue

            ## Final Report Format
            After testing, output ONLY this structured report (no other commentary):

            ```markdown
            # QA Exploratory Test Report

            **App Version**: [from footer/settings if visible]
            **Test Date**: [today]
            **Tester**: Claude QA Bot

            ## Executive Summary
            [1-2 sentences: overall app health, critical issues count]

            ## Test Coverage
            | Area | Status | Notes |
            |------|--------|-------|
            | Navigation | ✅/⚠️/❌ | ... |
            | Exercise Management | ✅/⚠️/❌ | ... |
            | Workout Creation | ✅/⚠️/❌ | ... |
            | Timers | ✅/⚠️/❌ | ... |
            | Settings | ✅/⚠️/❌ | ... |
            | Forms/Validation | ✅/⚠️/❌ | ... |

            ## Bugs Found

            ### [BUG-001] Title
            - **Severity**: Critical/Major/Minor
            - **Steps**: 1. Go to... 2. Click... 3. ...
            - **Expected**: ...
            - **Actual**: ...

            ### [BUG-002] Title
            ...

            ## Console Errors
            [List any JavaScript errors with context]

            ## Recommendations
            [Prioritized list of fixes needed]
            ```

          claude_args: |
            --max-turns 25
            --mcp-config '{"mcpServers":{"playwright":{"command":"npx","args":["@playwright/mcp@latest","--headless","--isolated"]}}}'
            --allowedTools "mcp__playwright__browser_navigate,mcp__playwright__browser_click,mcp__playwright__browser_type,mcp__playwright__browser_snapshot,mcp__playwright__browser_screenshot,mcp__playwright__browser_console_messages,mcp__playwright__browser_wait,mcp__playwright__browser_hover,Read"

      - name: Post results to PR
        if: github.event.pull_request.number || github.event.inputs.pr_number
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = context.payload.pull_request?.number ||
                            '${{ github.event.inputs.pr_number }}';

            if (!prNumber) return;

            const body = `## Claude Exploratory Testing (PoC)

            **Status:** Completed
            **Run:** [View Logs](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})

            See workflow logs for full exploration report.

            ---
            *Experimental PoC - results may vary*`;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: parseInt(prNumber),
              body: body
            });

      - name: Remove label
        if: github.event_name == 'pull_request' && github.event.label.name == 'claude-explore'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.removeLabel({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              name: 'claude-explore'
            });

      - name: Cleanup
        if: always()
        run: kill $DEV_PID 2>/dev/null || true
