name: CI

on:
  # Dispatched by claude-ci-fix.yml / claude-fix-review.yml /
  # claude-qa-followup.yml after they push a bot commit: those pushes use
  # GITHUB_TOKEN, which never re-triggers `push`/`pull_request`, so CI would
  # otherwise never re-run against the fix. No inputs needed -- it just runs
  # against whatever ref it's dispatched with.
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: '22'

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  quality:
    uses: ./.github/workflows/reusable-node-command.yml
    with:
      profile: quality

  workflow-lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6
        with:
          persist-credentials: false

      - name: Install verified actionlint
        shell: bash
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          set -euo pipefail
          ACTIONLINT_DIR=$(mktemp -d)
          ARCHIVE="$ACTIONLINT_DIR/actionlint.tar.gz"
          curl -fsSL \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" \
            -o "$ARCHIVE"
          echo "${ACTIONLINT_SHA256}  ${ARCHIVE}" | sha256sum --check
          tar -xzf "$ARCHIVE" -C "$ACTIONLINT_DIR" actionlint
          echo "ACTIONLINT_BIN=$ACTIONLINT_DIR/actionlint" >> "$GITHUB_ENV"

      - name: Lint GitHub Actions and embedded shell
        shell: bash
        run: |
          set -euo pipefail
          command -v shellcheck >/dev/null
          "$ACTIONLINT_BIN" -no-color

      - name: Lint YAML
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/yamllint"
          "$RUNNER_TEMP/yamllint/bin/pip" install --quiet yamllint==1.37.1
          "$RUNNER_TEMP/yamllint/bin/yamllint" .coderabbit.yaml .github

      - name: Audit GitHub Actions security
        uses: zizmorcore/zizmor-action@6599ee8b7a49aef6a770f63d261d214911a7ce02 # v0.6.0
        with:
          advanced-security: false
          annotations: true
          min-confidence: high
          min-severity: high
          online-audits: true
          version: 1.25.2

  osv:
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6
        with:
          persist-credentials: false

      - name: Run OSV Scanner
        uses: google/osv-scanner-action/osv-scanner-action@9a498708959aeaef5ef730655706c5a1df1edbc2 # v2.3.8
        with:
          scan-args: |-
            --lockfile=pnpm-lock.yaml

  gitleaks:
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: 'false'

  type-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6
        with:
          persist-credentials: false

      - name: Setup dependencies
        uses: ./.github/actions/setup-node-deps
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Run type check
        shell: bash
        run: |
          set -euo pipefail
          pnpm type-check

  node-20-compat:
    uses: ./.github/workflows/reusable-node-command.yml
    with:
      profile: node-20-compat

  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6
        with:
          persist-credentials: false

      - name: Setup dependencies
        uses: ./.github/actions/setup-node-deps
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Build
        shell: bash
        run: |
          set -euo pipefail
          pnpm build-only

      - name: Enforce bundle size
        shell: bash
        run: |
          set -euo pipefail
          pnpm size-limit

      - name: Upload build artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
          retention-days: 7

  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]

    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6
        with:
          persist-credentials: false

      - name: Setup test environment
        uses: ./.github/actions/setup-test-env
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Run tests with coverage (shard ${{ matrix.shard }}/4)
        shell: bash
        env:
          VITEST_COVERAGE_SHARD: ${{ matrix.shard }}
        run: |
          set -euo pipefail
          pnpm vitest run \
            --project=default \
            --shard=${{ matrix.shard }}/4 \
            --coverage
          mv coverage/coverage-final.json \
            coverage/coverage-shard-${{ matrix.shard }}.json

      - name: Upload Vitest debug artifacts
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vitest-debug-shard-${{ matrix.shard }}
          path: |
            .vitest/traces/
            .vitest-attachments/
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload coverage shard
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-${{ matrix.shard }}
          path: coverage/coverage-shard-${{ matrix.shard }}.json
          if-no-files-found: error
          retention-days: 1

  test-coverage:
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6
        with:
          persist-credentials: false

      - name: Setup dependencies
        uses: ./.github/actions/setup-node-deps
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Download coverage shards
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: coverage-*
          path: .coverage
          merge-multiple: true

      - name: Merge coverage and enforce thresholds
        shell: bash
        run: |
          set -euo pipefail
          pnpm test:coverage:merge

  test-order:
    name: Test order (seed 731946)
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - name: Setup test environment
        uses: ./.github/actions/setup-test-env
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Run tests in deterministic shuffled order
        shell: bash
        run: |
          set -euo pipefail
          pnpm vitest run \
            --project=default \
            --sequence.shuffle \
            --sequence.seed=731946

  test-a11y:
    uses: ./.github/workflows/reusable-node-command.yml
    with:
      profile: test-a11y

  test-visual:
    uses: ./.github/workflows/reusable-node-command.yml
    with:
      profile: test-visual

  test-e2e:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6
        with:
          persist-credentials: false

      - name: Setup test environment
        uses: ./.github/actions/setup-test-env
        with:
          node-version: ${{ env.NODE_VERSION }}
          playwright-browsers: 'chromium webkit'

      - name: Download production build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist

      - name: Run Playwright E2E tests
        run: pnpm test:e2e:prebuilt

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  performance-budget:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6
        with:
          persist-credentials: false

      - name: Setup dependencies
        uses: ./.github/actions/setup-node-deps
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Download build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist

      - name: Run Lighthouse CI
        shell: bash
        run: |
          set -euo pipefail
          pnpm lhci autorun

  sbom:
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6
        with:
          persist-credentials: false

      - name: Generate CycloneDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          path: .
          format: cyclonedx-json
          artifact-name: sbom.cdx.json
          upload-artifact-retention: 14
          upload-release-assets: false

  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language:
          - actions
          - javascript-typescript
    steps:
      - name: Checkout repository without credentials
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6
        with:
          persist-credentials: false
      - name: Initialize CodeQL
        uses: github/codeql-action/init@7188fc363630916deb702c7fdcf4e481b751f97a # v4.37.1
        with:
          languages: ${{ matrix.language }}
          build-mode: none
      - name: Analyze repository
        uses: github/codeql-action/analyze@7188fc363630916deb702c7fdcf4e481b751f97a # v4.37.1
        with:
          category: /language:${{ matrix.language }}

  required:
    name: Required CI
    if: ${{ always() }}
    needs:
      - quality
      - workflow-lint
      - osv
      - gitleaks
      - type-check
      - node-20-compat
      - build
      - test
      - test-coverage
      - test-order
      - test-a11y
      - test-visual
      - test-e2e
      - performance-budget
      - sbom
      - codeql
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: Require every CI job to pass
        env:
          RESULTS_JSON: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          jq -e 'all(.[]; .result == "success")' <<<"$RESULTS_JSON"

  release:
    name: Release verified main commit
    if: |
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      needs.required.result == 'success'
    needs: required
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: release-main
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - name: Checkout verified main commit
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Ensure releases remain in commit order
        id: order
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          LATEST_TAG=$(git tag --list 'v*' --sort=-version:refname | head -n 1)
          if [ -n "$LATEST_TAG" ] && ! git merge-base --is-ancestor "$LATEST_TAG" "$EXPECTED_SHA"; then
            echo 'release=false' >> "$GITHUB_OUTPUT"
            echo "Skipping $EXPECTED_SHA because $LATEST_TAG is not its ancestor."
          else
            echo 'release=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Create conventional release
        id: changelog
        if: steps.order.outputs.release == 'true'
        uses: TriPSs/conventional-changelog-action@ee43def3241429afddab215ba89090cbf64fb45c # v6
        with:
          create-summary: 'true'
          git-push: 'false'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          output-file: 'false'
          skip-commit: 'true'
          skip-git-pull: 'true'
          skip-version-file: 'true'
          tag-prefix: 'v'
      - name: Publish tag for the verified commit
        if: |
          steps.order.outputs.release == 'true' &&
          steps.changelog.outputs.skipped == 'false'
        env:
          EXPECTED_SHA: ${{ github.sha }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.changelog.outputs.tag }}
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            echo "Refusing invalid release tag: $RELEASE_TAG" >&2
            exit 1
          fi
          TAG_SHA=$(git rev-list -n 1 "$RELEASE_TAG")
          if [ "$TAG_SHA" != "$EXPECTED_SHA" ]; then
            echo "Tag $RELEASE_TAG points to $TAG_SHA, expected $EXPECTED_SHA." >&2
            exit 1
          fi
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin "refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}"
