name: CI

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'scripts/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'vite.config.*'
      - 'vitest.config.ts'
      - 'tsconfig*.json'
      - 'eslint.config.*'
      - 'lighthouserc.json'
      - '.github/actions/**'
      - '.github/workflows/**'
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'scripts/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'vite.config.*'
      - 'vitest.config.ts'
      - 'tsconfig*.json'
      - 'eslint.config.*'
      - 'lighthouserc.json'
      - '.github/actions/**'
      - '.github/workflows/**'

env:
  NODE_VERSION: '22'

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    uses: ./.github/workflows/reusable-node-command.yml
    with:
      command: pnpm lint
      node-version: '22'

  audit:
    uses: ./.github/workflows/reusable-node-command.yml
    with:
      command: pnpm audit --prod --audit-level=critical
      node-version: '22'

  osv:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Run OSV Scanner
        uses: google/osv-scanner-action/osv-scanner-action@9a498708959aeaef5ef730655706c5a1df1edbc2 # v2.3.8
        with:
          scan-args: |-
            --lockfile=pnpm-lock.yaml

  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: 'false'

  knip:
    uses: ./.github/workflows/reusable-node-command.yml
    with:
      command: pnpm knip
      node-version: '22'

  i18n:
    uses: ./.github/workflows/reusable-node-command.yml
    with:
      command: pnpm i18n:check
      node-version: '22'

  composable-usage:
    uses: ./.github/workflows/reusable-node-command.yml
    with:
      command: pnpm check:composables
      node-version: '22'

  type-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Setup dependencies
        uses: ./.github/actions/setup-node-deps
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Restore TypeScript cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        continue-on-error: true
        with:
          path: |
            node_modules/.cache
            tsconfig.tsbuildinfo
          key: ts-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml', '**/tsconfig*.json') }}
          restore-keys: |
            ts-${{ runner.os }}-

      - name: Run type check
        shell: bash
        run: |
          set -euo pipefail
          pnpm type-check

  build:
    needs: type-check
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Setup dependencies
        uses: ./.github/actions/setup-node-deps
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Restore Vite cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        continue-on-error: true
        with:
          path: |
            node_modules/.vite
            node_modules/.cache
          key: vite-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml', 'vite.config.*') }}
          restore-keys: |
            vite-${{ runner.os }}-

      - name: Build
        shell: bash
        run: |
          set -euo pipefail
          pnpm build-only

      - name: Upload build artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
          retention-days: 7

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Setup test environment
        uses: ./.github/actions/setup-test-env
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Run tests (shard ${{ matrix.shard }}/4)
        shell: bash
        run: |
          set -euo pipefail
          pnpm vitest --project=default --shard=${{ matrix.shard }}/4

  test-arch:
    uses: ./.github/workflows/reusable-node-command.yml
    with:
      command: pnpm test:arch
      node-version: '22'

  test-a11y:
    uses: ./.github/workflows/reusable-node-command.yml
    with:
      command: pnpm test:a11y
      node-version: '22'
      timeout-minutes: 10
      setup-profile: test

  test-visual:
    uses: ./.github/workflows/reusable-node-command.yml
    with:
      command: pnpm test:visual
      node-version: '22'
      runner: macos-latest
      timeout-minutes: 10
      setup-profile: test

  performance-budget:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Setup dependencies
        uses: ./.github/actions/setup-node-deps
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Download build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist

      - name: Run Lighthouse CI
        shell: bash
        run: |
          set -euo pipefail
          pnpm lhci autorun

  bundle-size:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Setup dependencies
        uses: ./.github/actions/setup-node-deps
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Download build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist

      - name: Run Size Limit
        shell: bash
        run: |
          set -euo pipefail
          pnpm size-limit

  sbom:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Generate CycloneDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          path: .
          format: cyclonedx-json
          artifact-name: sbom.cdx.json
          upload-artifact-retention: 14
          upload-release-assets: false
