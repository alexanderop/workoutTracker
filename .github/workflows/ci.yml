name: CI

on:
  # Dispatched by claude-ci-fix.yml / claude-fix-review.yml /
  # claude-qa-followup.yml after they push a bot commit: those pushes use
  # GITHUB_TOKEN, which never re-triggers `push`/`pull_request`, so CI would
  # otherwise never re-run against the fix. No inputs needed -- it just runs
  # against whatever ref it's dispatched with.
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'scripts/**'
      - 'test/e2e/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'vite.config.*'
      - 'vitest.config.ts'
      - 'playwright.config.ts'
      - 'coverage-thresholds.json'
      - 'tsconfig*.json'
      - 'eslint.config.*'
      - '.oxlintrc.json'
      - '.markdownlint*.json*'
      - '.yamllint.yml'
      - 'knip.json'
      - 'lighthouserc.json'
      - '.coderabbit.yaml'
      - '.gitleaksignore'
      - '.husky/**'
      - '.github/actions/**'
      - '.github/workflows/**'
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'scripts/**'
      - 'test/e2e/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'vite.config.*'
      - 'vitest.config.ts'
      - 'playwright.config.ts'
      - 'coverage-thresholds.json'
      - 'tsconfig*.json'
      - 'eslint.config.*'
      - '.oxlintrc.json'
      - '.markdownlint*.json*'
      - '.yamllint.yml'
      - 'knip.json'
      - 'lighthouserc.json'
      - '.coderabbit.yaml'
      - '.gitleaksignore'
      - '.husky/**'
      - '.github/actions/**'
      - '.github/workflows/**'

env:
  NODE_VERSION: '22'

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    uses: ./.github/workflows/reusable-node-command.yml
    with:
      command: pnpm exec run-p lint:check audit:prod knip i18n:check check:composables test:arch test:workflows
      node-version: '22'

  workflow-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Install verified actionlint
        shell: bash
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          set -euo pipefail
          ACTIONLINT_DIR=$(mktemp -d)
          ARCHIVE="$ACTIONLINT_DIR/actionlint.tar.gz"
          curl -fsSL \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" \
            -o "$ARCHIVE"
          echo "${ACTIONLINT_SHA256}  ${ARCHIVE}" | sha256sum --check
          tar -xzf "$ARCHIVE" -C "$ACTIONLINT_DIR" actionlint
          echo "ACTIONLINT_BIN=$ACTIONLINT_DIR/actionlint" >> "$GITHUB_ENV"

      - name: Lint GitHub Actions and embedded shell
        shell: bash
        run: |
          set -euo pipefail
          command -v shellcheck >/dev/null
          "$ACTIONLINT_BIN" -no-color

      - name: Lint YAML
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/yamllint"
          "$RUNNER_TEMP/yamllint/bin/pip" install --quiet yamllint==1.37.1
          "$RUNNER_TEMP/yamllint/bin/yamllint" .coderabbit.yaml .github

  osv:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Run OSV Scanner
        uses: google/osv-scanner-action/osv-scanner-action@9a498708959aeaef5ef730655706c5a1df1edbc2 # v2.3.8
        with:
          scan-args: |-
            --lockfile=pnpm-lock.yaml

  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: 'false'

  type-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Setup dependencies
        uses: ./.github/actions/setup-node-deps
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Run type check
        shell: bash
        run: |
          set -euo pipefail
          pnpm type-check

  node-20-compat:
    uses: ./.github/workflows/reusable-node-command.yml
    with:
      command: pnpm type-check && pnpm build-only
      node-version: '20.19.0'
      timeout-minutes: 10

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Setup dependencies
        uses: ./.github/actions/setup-node-deps
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Build
        shell: bash
        run: |
          set -euo pipefail
          pnpm build-only

      - name: Enforce bundle size
        shell: bash
        run: |
          set -euo pipefail
          pnpm size-limit

      - name: Upload build artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
          retention-days: 7

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - name: Setup test environment
        uses: ./.github/actions/setup-test-env
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Run tests with coverage (shard ${{ matrix.shard }}/4)
        shell: bash
        env:
          VITEST_COVERAGE_SHARD: ${{ matrix.shard }}
        run: |
          set -euo pipefail
          pnpm vitest run \
            --project=default \
            --shard=${{ matrix.shard }}/4 \
            --coverage
          mv coverage/coverage-final.json \
            coverage/coverage-shard-${{ matrix.shard }}.json

      - name: Upload coverage shard
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-${{ matrix.shard }}
          path: coverage/coverage-shard-${{ matrix.shard }}.json
          if-no-files-found: error
          retention-days: 1

  test-coverage:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Setup dependencies
        uses: ./.github/actions/setup-node-deps
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Download coverage shards
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: coverage-*
          path: .coverage
          merge-multiple: true

      - name: Merge coverage and enforce thresholds
        shell: bash
        run: |
          set -euo pipefail
          pnpm test:coverage:merge

  test-a11y:
    uses: ./.github/workflows/reusable-node-command.yml
    with:
      command: pnpm test:a11y
      node-version: '22'
      timeout-minutes: 10
      setup-profile: test

  test-visual:
    uses: ./.github/workflows/reusable-node-command.yml
    with:
      command: pnpm test:visual
      node-version: '22'
      runner: macos-latest
      timeout-minutes: 10
      setup-profile: test

  test-e2e:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - name: Setup test environment
        uses: ./.github/actions/setup-test-env
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Download production build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist

      - name: Run Playwright E2E tests
        run: pnpm test:e2e:prebuilt

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  performance-budget:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Setup dependencies
        uses: ./.github/actions/setup-node-deps
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Download build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist

      - name: Run Lighthouse CI
        shell: bash
        run: |
          set -euo pipefail
          pnpm lhci autorun

  sbom:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Generate CycloneDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          path: .
          format: cyclonedx-json
          artifact-name: sbom.cdx.json
          upload-artifact-retention: 14
          upload-release-assets: false
