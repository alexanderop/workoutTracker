name: Reusable Node Command

on:
  workflow_call:
    inputs:
      profile:
        description: Allowlisted project command profile
        required: true
        type: string

permissions:
  contents: read

jobs:
  run:
    runs-on: ${{ inputs.profile == 'test-visual' && 'macos-15' || 'ubuntu-24.04' }}
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false

      - name: Setup dependencies
        if: inputs.profile != 'test-a11y' && inputs.profile != 'test-visual'
        uses: ./.github/actions/setup-node-deps
        with:
          node-version: ${{ inputs.profile == 'node-20-compat' && '20.19.0' || '22' }}

      - name: Setup test environment
        if: inputs.profile == 'test-a11y' || inputs.profile == 'test-visual'
        uses: ./.github/actions/setup-test-env
        with:
          node-version: '22'

      - name: Run allowlisted command
        shell: bash
        env:
          PROFILE: ${{ inputs.profile }}
        run: |
          set -euo pipefail
          case "$PROFILE" in
            quality)
              # `test:unit` (the Node tier) rides along here rather than in its
              # own job: it is ~2s of browserless tests, and this job already has
              # deps installed. It runs without --coverage on purpose — the unit
              # run's v8 map covers the whole `src/**` include at ~2% (it never
              # loads the Vue components) and instruments the same files to
              # different statement totals than the browser pipeline, so folding
              # it into the merged gate drops statements from 86.14% to 70.36%
              # and fails a threshold the browser shards clear on their own.
              pnpm exec run-p lint:check audit:prod knip i18n:check \
                check:composables test:arch test:workflows test:unit
              ;;
            node-20-compat)
              pnpm type-check
              pnpm build-only
              ;;
            test-a11y)
              pnpm test:a11y
              ;;
            test-visual)
              pnpm test:visual
              ;;
            *)
              echo "Unknown command profile: $PROFILE" >&2
              exit 2
              ;;
          esac
