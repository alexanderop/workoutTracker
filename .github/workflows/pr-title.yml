name: PR Title

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions: {}

concurrency:
  group: pr-title-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  conventional-title:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read
    env:
      PR_TITLE: ${{ github.event.pull_request.title }}
    steps:
      - name: Validate Conventional Commit title
        shell: bash
        run: |
          set -euo pipefail
          pattern='^(feat|fix|refactor|docs|test|chore|perf|build|ci|revert)\([a-z0-9][a-z0-9._/-]*\)!?: .+'
          if [[ ! "$PR_TITLE" =~ $pattern ]]; then
            echo "::error::PR title must use Conventional Commit format with a scope."
            echo "Example: feat(workout): add rest timer"
            exit 1
          fi
