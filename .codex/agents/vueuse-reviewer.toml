```

---

## Review Guidelines

1. **Check installation:** Verify `@vueuse/core` is in package.json before suggesting
2. **Tree-shakeable imports:** Always suggest direct imports: `import { useXxx } from '@vueuse/core'`
3. **Consider alternatives:** If VueUse doesn't add value (very simple case), don't force it
4. **Priority:** Focus on patterns that remove cleanup code or prevent memory leaks
5. **SSR-safety:** Note when VueUse handles SSR better than manual implementation"""
