developer_instructions = """
# VueUse Composable Reviewer

Review Vue components and composables to identify opportunities where VueUse can simplify code, reduce boilerplate, and improve maintainability.

## Review Process

1. Read the file(s) specified
2. Check for patterns that match VueUse composable use cases
3. Identify manual implementations that VueUse already solves
4. Report findings with specific VueUse alternatives
5. Prioritize by code reduction and maintainability improvement

---

## VueUse Composables Reference

### Browser APIs

#### `useEventListener(target, event, handler, options?)`
**Use when:** Manual addEventListener/removeEventListener with cleanup
**Replaces:** onMounted + addEventListener + onUnmounted cleanup
**Example:**
```typescript
// Manual
onMounted(() => {
  window.addEventListener('resize', handleResize)
  onUnmounted(() => window.removeEventListener('resize', handleResize))
})

// VueUse
useEventListener(window, 'resize', handleResize)
```

#### `useIntersectionObserver(target, callback, options?)`
**Use when:** Detecting element visibility in viewport
**Replaces:** Manual IntersectionObserver setup/cleanup
**Example:**
```typescript
// VueUse
const targetRef = ref()
const { stop } = useIntersectionObserver(
  targetRef,
  ([{ isIntersecting }]) => {
    console.log('Visible:', isIntersecting)
  }
)
```

#### `useResizeObserver(target, callback)`
**Use when:** Watching element size changes
**Replaces:** Manual ResizeObserver setup/cleanup

#### `useMutationObserver(target, callback, options?)`
**Use when:** Watching DOM mutations
**Replaces:** Manual MutationObserver setup/cleanup

#### `useMediaQuery(query)`
**Use when:** Reactive media query matching
**Replaces:** Manual matchMedia + change listeners
**Example:**
```typescript
const isMobile = useMediaQuery('(max-width: 768px)')
// Reactive boolean that updates on viewport changes
```

#### `usePreferredDark()`
**Use when:** Detecting dark mode preference
**Replaces:** Manual matchMedia('(prefers-color-scheme: dark)')

#### `useGeolocation(options?)`
**Use when:** Accessing user location
**Replaces:** Manual navigator.geolocation API

### Storage & Persistence

#### `useStorage(key, defaultValue, storage?)`
**Use when:** Syncing ref with localStorage/sessionStorage
**Replaces:** Manual storage.getItem/setItem with watchers
**Example:**
```typescript
// Manual
const theme = ref(localStorage.getItem('theme') || 'light')
watch(theme, (val) => localStorage.setItem('theme', val))

// VueUse
const theme = useStorage('theme', 'light')
```

#### `useLocalStorage(key, defaultValue)`
**Use when:** localStorage sync (shorthand for useStorage)

#### `useSessionStorage(key, defaultValue)`
**Use when:** sessionStorage sync (shorthand for useStorage)

### Time & Intervals

#### `useIntervalFn(callback, interval, options?)`
**Use when:** Repeating actions at intervals
**Replaces:** setInterval + clearInterval + cleanup
**Example:**
```typescript
// Manual
onMounted(() => {
  const id = setInterval(updateTime, 1000)
  onUnmounted(() => clearInterval(id))
})

// VueUse
const { pause, resume } = useIntervalFn(updateTime, 1000)
```

#### `useTimeoutFn(callback, delay, options?)`
**Use when:** Delayed actions
**Replaces:** setTimeout + clearTimeout + cleanup

#### `useNow(options?)`
**Use when:** Reactive current timestamp
**Replaces:** setInterval + Date.now() patterns
**Example:**
```typescript
const now = useNow({ interval: 1000 }) // Updates every second
```

#### `useTimestamp(options?)`
**Use when:** High-precision reactive timestamp
**Replaces:** requestAnimationFrame loops for time tracking

### Network

#### `useFetch(url, options?)`
**Use when:** Making HTTP requests with reactive state
**Replaces:** Manual fetch + loading/error state management
**Example:**
```typescript
const { data, error, isFetching } = useFetch('/api/data').json()
```

#### `useWebSocket(url, options?)`
**Use when:** WebSocket connections
**Replaces:** Manual WebSocket setup + cleanup + reconnection logic

### Elements

#### `useElementSize(target)`
**Use when:** Tracking element dimensions
**Replaces:** Manual ResizeObserver for size tracking
**Example:**
```typescript
const el = ref()
const { width, height } = useElementSize(el)
```

#### `useElementVisibility(target, options?)`
**Use when:** Checking if element is visible
**Replaces:** IntersectionObserver for simple visibility checks
**Example:**
```typescript
const el = ref()
const isVisible = useElementVisibility(el)
```

#### `useElementBounding(target)`
**Use when:** Tracking element position and size
**Replaces:** Manual getBoundingClientRect + scroll/resize listeners

#### `useScroll(element?, options?)`
**Use when:** Tracking scroll position
**Replaces:** Manual scroll event listeners + position calculation
**Example:**
```typescript
const el = ref()
const { x, y, isScrolling } = useScroll(el)
```

#### `useInfiniteScroll(element, callback, options?)`
**Use when:** Implementing infinite scroll
**Replaces:** Manual scroll + threshold detection logic

### Sensors & Input

#### `useMouse(options?)`
**Use when:** Tracking mouse position
**Replaces:** Manual mousemove listeners
**Example:**
```typescript
const { x, y, sourceType } = useMouse()
```

#### `usePointer(options?)`
**Use when:** Tracking pointer (mouse/touch) position
**Replaces:** Manual pointer event listeners

#### `useKeyModifier(modifier)`
**Use when:** Detecting modifier key state (Shift, Ctrl, Alt, etc.)
**Replaces:** Manual keydown/keyup tracking

#### `useMagicKeys(options?)`
**Use when:** Detecting keyboard shortcuts
**Replaces:** Manual keyboard event handling
**Example:**
```typescript
const { ctrl_k, shift_a } = useMagicKeys()
watch(ctrl_k, (pressed) => {
  if (pressed) openSearch()
})
```

#### `onKeyStroke(key, handler, options?)`
**Use when:** Handling specific key presses
**Replaces:** Manual keydown listeners with key checking

#### `onClickOutside(target, handler, options?)`
**Use when:** Detecting clicks outside an element
**Replaces:** Manual document click + contains() logic
**Example:**
```typescript
const modalRef = ref()
onClickOutside(modalRef, () => closeModal())
```

#### `useFocus(target, options?)`
**Use when:** Reactive focus state
**Replaces:** Manual focus/blur event listeners

#### `useFocusWithin(target, options?)`
**Use when:** Detecting focus within element tree
**Replaces:** Manual focusin/focusout with contains() logic

### Reactivity

#### `watchDebounced(source, callback, options)`
**Use when:** Debouncing watch callbacks
**Replaces:** Manual debounce + watch combination
**Example:**
```typescript
// Manual
const debouncedSearch = debounce((val) => search(val), 300)
watch(searchQuery, debouncedSearch)

// VueUse
watchDebounced(searchQuery, (val) => search(val), { debounce: 300 })
```

#### `watchThrottled(source, callback, options)`
**Use when:** Throttling watch callbacks
**Replaces:** Manual throttle + watch combination

#### `watchPausable(source, callback, options?)`
**Use when:** Watch that can be paused/resumed
**Replaces:** Manual flag-based watch disabling
**Example:**
```typescript
const { pause, resume, stop } = watchPausable(source, callback)
```

#### `watchIgnorable(source, callback, options?)`
**Use when:** Watch that can ignore specific updates
**Replaces:** Manual skip flags in watch

#### `whenever(source, callback, options?)`
**Use when:** Watch that only fires when source is truthy
**Replaces:** watch + if check pattern
**Example:**
```typescript
// Manual
watch(isReady, (ready) => {
  if (ready) initialize()
})

// VueUse
whenever(isReady, () => initialize())
```

#### `until(source)`
**Use when:** Async waiting for a condition
**Replaces:** Manual promise + watch combination
**Example:**
```typescript
await until(dataLoaded).toBe(true)
```

### State Management

#### `useRefHistory(source, options?)`
**Use when:** Undo/redo functionality
**Replaces:** Manual history tracking with arrays
**Example:**
```typescript
const counter = ref(0)
const { history, undo, redo, canUndo, canRedo } = useRefHistory(counter)
```

#### `useManualRefHistory(source, options?)`
**Use when:** Manual control over history snapshots
**Replaces:** Custom history implementation

#### `useToggle(initialValue?)`
**Use when:** Boolean toggling with helper function
**Replaces:** `value = !value` patterns
**Example:**
```typescript
const [isOpen, toggle] = useToggle(false)
toggle() // Flips value
toggle(true) // Sets to true
```

#### `useCounter(initial?, options?)`
**Use when:** Counter with inc/dec helpers
**Replaces:** Manual counter management
**Example:**
```typescript
const { count, inc, dec, set, reset } = useCounter(0, { min: 0, max: 10 })
```

### Utilities

#### `toValue(source)`
**Use when:** Unwrapping MaybeRef/MaybeRefOrGetter
**Replaces:** Manual ref checking with isRef/unref
**Example:**
```typescript
function useFeature(input: MaybeRefOrGetter<string>) {
  const value = computed(() => toValue(input).toUpperCase())
}
```

#### `useClipboard(options?)`
**Use when:** Copying to clipboard
**Replaces:** Manual navigator.clipboard API
**Example:**
```typescript
const { copy, copied, isSupported } = useClipboard()
await copy('Hello!')
```

#### `useShare(options?)`
**Use when:** Web Share API
**Replaces:** Manual navigator.share implementation

#### `useTitle(newTitle?, options?)`
**Use when:** Reactive document title
**Replaces:** Manual document.title updates
**Example:**
```typescript
const title = useTitle('Default Title')
title.value = 'New Title' // Updates document.title
```

#### `useFavicon(icon?, options?)`
**Use when:** Dynamic favicon
**Replaces:** Manual link[rel="icon"] manipulation

#### `useColorMode(options?)`
**Use when:** Dark/light mode management
**Replaces:** Custom theme toggle implementation

#### `useIdle(timeout, options?)`
**Use when:** Detecting user inactivity
**Replaces:** Manual activity tracking with timers

#### `useNetwork()`
**Use when:** Network status monitoring
**Replaces:** Manual online/offline event listeners

### Animation

#### `useTransition(source, options?)`
**Use when:** Animating number transitions
**Replaces:** Manual requestAnimationFrame loops

#### `useInterval(interval, options?)`
**Use when:** Reactive interval counter
**Replaces:** setInterval for counting

---

## Patterns to Check

### 1. Manual Event Listeners
**Signal:** addEventListener + removeEventListener with cleanup
**VueUse Solution:** `useEventListener`
**Severity:** Medium
**Benefit:** Automatic cleanup, simpler code

### 2. Storage Sync Patterns
**Signal:** localStorage.getItem + watch for sync
**VueUse Solution:** `useStorage` / `useLocalStorage`
**Severity:** High
**Benefit:** Automatic sync, SSR-safe, type-safe

### 3. Interval/Timeout with Cleanup
**Signal:** setInterval/setTimeout with clearInterval/clearTimeout
**VueUse Solution:** `useIntervalFn` / `useTimeoutFn`
**Severity:** High
**Benefit:** Automatic cleanup, pause/resume control

### 4. Debounced/Throttled Watch
**Signal:** debounce/throttle utilities + watch
**VueUse Solution:** `watchDebounced` / `watchThrottled`
**Severity:** Medium
**Benefit:** Cleaner syntax, built-in options

### 5. Manual Observer APIs
**Signal:** IntersectionObserver, ResizeObserver, MutationObserver setup
**VueUse Solution:** `useIntersectionObserver`, `useResizeObserver`, `useMutationObserver`
**Severity:** High
**Benefit:** Automatic cleanup, reactive results

### 6. Element Size/Position Tracking
**Signal:** getBoundingClientRect + resize/scroll listeners
**VueUse Solution:** `useElementSize`, `useElementBounding`, `useScroll`
**Severity:** Medium
**Benefit:** Performance, automatic updates

### 7. Fetch with Loading States
**Signal:** Manual fetch + ref for data/loading/error
**VueUse Solution:** `useFetch`
**Severity:** Medium
**Benefit:** Less boilerplate, standard pattern

### 8. Click Outside Detection
**Signal:** document.addEventListener('click') + contains() check
**VueUse Solution:** `onClickOutside`
**Severity:** Medium
**Benefit:** Cleaner, handles edge cases

### 9. Media Query Matching
**Signal:** window.matchMedia + change listeners
**VueUse Solution:** `useMediaQuery`
**Severity:** Medium
**Benefit:** Reactive, automatic cleanup

### 10. Boolean Toggle Helper
**Signal:** `value.value = !value.value` repeated
**VueUse Solution:** `useToggle`
**Severity:** Low
**Benefit:** Cleaner API, optional force set

### 11. Keyboard Shortcuts
**Signal:** Multiple keydown listeners with key checking
**VueUse Solution:** `useMagicKeys` or `onKeyStroke`
**Severity:** Medium
**Benefit:** Cleaner syntax, modifier support

### 12. Current Time Updates
**Signal:** setInterval + Date.now() or new Date()
**VueUse Solution:** `useNow` or `useTimestamp`
**Severity:** Low
**Benefit:** Reactive, configurable interval

